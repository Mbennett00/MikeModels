<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="ice" cx="50%" cy="30%" r="85%">
      <stop offset="0" stop-color="#e2f2fb"/><stop offset=".6" stop-color="#bfe0f2"/><stop offset="1" stop-color="#8fc4e4"/>
    </radialGradient>
    <linearGradient id="wood" x1="0" x2="1">
      <stop offset="0" stop-color="#e9b766"/><stop offset=".45" stop-color="#f7d593"/><stop offset="1" stop-color="#dca552"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#ice)"/>
  <g fill="#fff" opacity=".85"><circle cx="70" cy="90" r="7"/><circle cx="446" cy="96" r="6"/><circle cx="410" cy="46" r="4"/><circle cx="92" cy="200" r="4"/><circle cx="462" cy="230" r="5"/></g>
  <!-- shadow -->
  <ellipse cx="262" cy="458" rx="170" ry="20" fill="#1f3448" opacity=".2"/>

  <g stroke="#1f3448" stroke-width="12" stroke-linejoin="round" stroke-linecap="round">
    <!-- blade (the "foot") -->
    <path d="M196 380 L196 424 Q196 452 226 452 L420 452 Q446 452 446 430 Q446 412 424 410 L326 404 L326 380 Z" fill="url(#wood)"/>
    <path d="M238 452 L238 408 M268 452 L268 406 M298 452 L298 405" stroke="#1f3448" stroke-width="0"/>
    <path d="M224 452 L224 412 Q224 406 232 406 L420 412 Q436 414 436 428 Q436 442 420 444 L232 446" fill="none" stroke-width="0"/>
    <!-- blade tape -->
    <path d="M226 408 L424 414 Q438 416 438 430 Q438 444 422 446 L226 446 Z" fill="#1f3448" stroke-width="0"/>
    <path d="M254 409 L254 446 M290 410 L290 446 M326 411 L326 446 M362 412 L362 446 M398 413 L398 446" stroke="#3b5873" stroke-width="5"/>

    <!-- shaft / body -->
    <path d="M186 96 Q186 56 226 56 L286 56 Q326 56 326 96 L326 392 L186 392 Z" fill="url(#wood)"/>
    <!-- wood grain -->
    <path d="M214 250 Q222 290 212 330 M298 244 Q290 286 300 320" fill="none" stroke="#c98f3e" stroke-width="5" opacity=".7"/>
    <!-- grip tape -->
    <path d="M186 320 L326 320 L326 392 L186 392 Z" fill="#d9443a"/>
    <path d="M186 334 L326 310 M186 358 L326 334 M186 382 L326 358" stroke="#a82e26" stroke-width="7"/>
    <path d="M186 320 L326 320 L326 392 L186 392 Z" fill="none"/>

    <!-- knob tape / headband -->
    <path d="M180 92 L332 92 L332 132 L180 132 Z" fill="#fffaf0"/>
    <path d="M180 104 L332 104 M180 120 L332 120" stroke="#d9443a" stroke-width="7"/>
    <path d="M332 102 Q362 96 372 118 Q352 118 344 132 Z" fill="#fffaf0" stroke-width="9"/>
    <path d="M332 122 Q364 128 368 152 Q348 146 336 140 Z" fill="#fffaf0" stroke-width="9"/>

    <!-- face panel -->
    <rect x="200" y="146" width="112" height="84" rx="22" fill="#fffaf0"/>
  </g>

  <!-- angry eyes -->
  <g stroke="#1f3448" stroke-linecap="round">
    <ellipse cx="232" cy="190" rx="17" ry="15" fill="#fff" stroke-width="6"/>
    <ellipse cx="280" cy="190" rx="17" ry="15" fill="#fff" stroke-width="6"/>
  </g>
  <circle cx="236" cy="194" r="8" fill="#3f8fd2"/><circle cx="276" cy="194" r="8" fill="#3f8fd2"/>
  <circle cx="237" cy="195" r="4" fill="#1f3448"/><circle cx="275" cy="195" r="4" fill="#1f3448"/>
  <circle cx="239" cy="191" r="2" fill="#fff"/><circle cx="277" cy="191" r="2" fill="#fff"/>
  <path d="M210 170 L250 184" stroke="#1f3448" stroke-width="10" stroke-linecap="round"/>
  <path d="M302 170 L262 184" stroke="#1f3448" stroke-width="10" stroke-linecap="round"/>
  <path d="M242 218 Q256 210 270 218" fill="none" stroke="#1f3448" stroke-width="6" stroke-linecap="round"/>

  <!-- crossed arms: each forearm runs from one elbow to the opposite glove -->
  <g stroke-linecap="round">
    <line x1="160" y1="302" x2="336" y2="258" stroke="#1f3448" stroke-width="50"/>
    <line x1="160" y1="302" x2="336" y2="258" stroke="#fffaf0" stroke-width="28"/>
    <line x1="200" y1="292" x2="236" y2="283" stroke="#d9443a" stroke-width="12" stroke-linecap="butt"/>
    <line x1="352" y1="302" x2="176" y2="258" stroke="#1f3448" stroke-width="50"/>
    <line x1="352" y1="302" x2="176" y2="258" stroke="#fffaf0" stroke-width="28"/>
    <line x1="312" y1="292" x2="276" y2="283" stroke="#d9443a" stroke-width="12" stroke-linecap="butt"/>
  </g>
  <g stroke="#1f3448" stroke-width="11" stroke-linejoin="round">
    <rect x="148" y="232" width="52" height="48" rx="15" fill="#1f3448"/>
    <rect x="312" y="232" width="52" height="48" rx="15" fill="#1f3448"/>
  </g>
  <path d="M158 248 L190 248 M158 262 L190 262 M322 248 L354 248 M322 262 L354 262" stroke="#4d6a86" stroke-width="5" stroke-linecap="round"/>

  <!-- puck -->
  <g stroke="#1f3448" stroke-width="10" stroke-linejoin="round">
    <path d="M70 420 L70 440 Q70 456 116 456 Q162 456 162 440 L162 420" fill="#1f3448"/>
    <ellipse cx="116" cy="420" rx="46" ry="16" fill="#33495e"/>
  </g>
  <path d="M96 418 Q116 412 136 418" stroke="#6d8397" stroke-width="4" fill="none" stroke-linecap="round"/>
</svg>
