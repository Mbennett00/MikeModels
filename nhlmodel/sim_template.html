<style>
/*CALIB_CSS*/
/*SIM_CSS*/
/* ---------- the rink ---------- */
.ice { position: relative; height: 92px; margin: 0 14px 14px; border-radius: 38px; overflow: hidden; background: linear-gradient(180deg, #f4f9ff, #e3eefb); border: 3px solid var(--ink); }
.ice .cl { position: absolute; top: 0; bottom: 0; width: 3px; margin-left: -1.5px; }

.ice .cr.l { left: 7%; border-radius: 0 12px 12px 0; } .ice .cr.r { right: 7%; border-radius: 12px 0 0 12px; }
.ice .fo { position: absolute; top: 50%; left: 50%; width: 24px; height: 24px; margin: -12px; border-radius: 50%; border: 2px solid rgba(70,120,210,.45); }
.ice .zn { position: absolute; top: 5px; font-size: 9px; font-weight: 700; letter-spacing: .08em; color: rgba(30,50,70,.45); }
.ice .dot { position: absolute; width: 10px; height: 10px; margin: -5px; border-radius: 50%; opacity: .5; border: 2px solid var(--ink); }
.ice .dot.g { width: 13px; height: 13px; margin: -6.5px; opacity: 1; border: 2px solid #fff; box-shadow: 0 0 0 2px #f5c84b; }
.ice .dot.now { opacity: 1; box-shadow: 0 0 0 3px rgba(255,255,255,.95), 0 1px 4px rgba(0,0,0,.3); animation: pk .9s ease-out; }

<body class="sim">
<div class="wrap">
  <div class="hdr"><div class="sx-top"><a href="index.html" id="back"></a><b>Game sim</b><img class="mlogo" src="pikt-wordmark.png" alt="Pikt"></div></div>
  <div id="view"><div class="empty"><div class="t">Loading teams…</div></div></div>
</div>
<script>
/*SIM_JS*/
$("#back").innerHTML = ICON.back + "NHL";
let D = null, SDH = null;
const TEAMS = {}, TM = {}, CALK = {}, SIM_VER = "4|";   // bump when the engine changes so saved tunings are redone
const TOI = {F1: 1.25, F2: 1.08, F3: .85, F4: .6, D1: 1.25, D2: 1, D3: .75};
const PEN = ["tripping", "hooking", "slashing", "holding", "interference", "high-sticking", "roughing", "cross-checking", "delay of game", "holding the stick"];
const TYPES = ["wrist", "snap", "slap", "tip-in", "backhand", "deflected", "wrap-around"];
const SAY = {wrist: "wrist shot", snap: "snap shot", slap: "slap shot", "tip-in": "tip-in", backhand: "backhand", deflected: "deflection", "wrap-around": "wrap-around"};
const L3 = p => (p.lam || {});
// league numbers: replaced by nhl_sim.json (built from every shot, goal, penalty and shift of this season and last)
let LGH = {xg: {dist: [10, 20, 30, 40, 50, 60], tab: {}, base: .105}, reb: {rate: .1, lift: 1.5}, pp_lift: 1.5, mix: {wrist: .45, snap: .26, slap: .1, "tip-in": .08, backhand: .08, deflected: .02, "wrap-around": .01},
  att: {on: .48, blocked: .27, miss: .25}, pen60: 3.6, cf60: 55, pp60: 95};
const PER_G = {hits: 21, blk: 14, give: 8, take: 6};

// ---------- teams: the model's projections plus each team's and player's profile ----------
function loadTeams() {
  const Ln = {}; for (const l of D.lines || []) Ln[l.id] = l;
  for (const g of D.games || []) for (const k of ["home", "away"]) {
    const t = g[k], out = new Set((t.injuries || []).filter(x => /^(out|ir|ltir)/i.test(x.status)).map(x => x.name));
    const sk = (D.players || []).filter(p => p.team === t.abbr && !out.has(p.name)).map(p => Object.assign({}, p, Ln[p.id] ? {line: Ln[p.id].line, pp: Ln[p.id].pp} : {}));
    TEAMS[t.abbr] = {ab: t.abbr, name: t.name, full: t.name, color: sxVis(t.color || (D.colors || {})[t.abbr]), logo: t.logo, goalie: t.goalie || `${t.abbr} goalie`, goalieId: t.goalie_id,
      lamFor: k === "home" ? g.lam_home : g.lam_away, lamAg: k === "home" ? g.lam_away : g.lam_home, sk};
  }
}
const xgOf = (type, d) => { const tab = LGH.xg.tab[type] || LGH.xg.tab.wrist; if (!tab) return LGH.xg.base; let i = 0; while (i < LGH.xg.dist.length && d > LGH.xg.dist[i]) i++; return tab[i]; };

    const x = PX(p.id), pos = x.pos || (p.pos === "D" ? "D" : "C");

    const loc = (x.loc || []).map(([ax, ay, ti]) => ({ax, ay, type: TYPES[ti] || "wrist", d: Math.sqrt((89 - ax) ** 2 + ay ** 2)})).filter(s => s.d < 95);

      fo: x.fo ? (x.fo[0] + 50) / (x.fo[1] + 100) : .5, hit: x.hit60 ?? (pos === "D" ? 1.6 : 1.4), blk: x.blk60 ?? (pos === "D" ? 2.6 : .7), pim: x.pim60 ?? (pos === "D" ? 1.1 : .9),
      give: x.give60 ?? .9, take: x.take60 ?? .7, ast: x.ast || {}});

  const tot = [0, 0, 0]; for (const p of sk) if (p.px.split) p.px.split.forEach((v, i) => tot[i] += v);
  const tsum = tot[0] + tot[1] + tot[2] || 1, share = tot.map(v => v / tsum);
  for (const p of sk) {
    const sp = p.px.split, n = sp ? sp[0] + sp[1] + sp[2] : 0;
    p.rel = [0, 1, 2].map(i => sp && tsum > 30 ? ((sp[i] + 8 * share[i]) / (n + 8)) / Math.max(.02, share[i]) : 1);
    if (!sp) p.rel = [1, p.pp === 1 ? 1.6 : p.pp === 2 ? 1.15 : .45, p.pp ? .7 : 1.15];
    p.rel[1] *= p.toi[1] > .3 || !p.px.toi ? 1 : .3; p.rel[2] *= p.toi[2] > .3 || !p.px.toi ? 1 : .3;
  }
  const sog = p => Math.max(.15, L3(p).sog || 1), S = sk.reduce((s, p) => s + sog(p), 0), G = sk.reduce((s, p) => s + Math.max(.01, L3(p).goals || .1), 0);
  const lines = {}; for (const p of sk) if (p.line) (lines[p.line] = lines[p.line] || []).push(p);
  let centers = sk.filter(p => p.pos2 === "C" && p.px.fo && p.px.fo[1] > 10);
  if (centers.length < 3) centers = ["F1", "F2", "F3", "F4"].filter(l => lines[l]).map(l => lines[l][0]);
  if (!centers.length) centers = sk.filter(p => p.pos !== "D").slice(0, 4);
  const gk = (SDH && SDH.goalies && SDH.goalies[String(T.goalieId)]) || {};
  return TM[ab] = Object.assign({}, T, {sk, S, G, avgSh: G / S, centers, x: X, gk, toiSum: [0, 1, 2].map(i => sk.reduce((s, p) => s + p.toi[i], 0))});
}
const gameOf = (a, h) => (D.games || []).find(x => x.home.abbr === h && x.away.abbr === a);
function expected(a, h) {   // regulation expected goals
  const g = gameOf(a, h); if (g) return [g.lam_away, g.lam_home];
  const gpg = (D.model || {}).goals_pg || 3, he = (D.model || {}).home_edge || .02, A = TEAMS[a], H = TEAMS[h];

}
function pModel(a, h) {

// tune each team's shot rate and finishing until its regulation shots and goals average the model's numbers for this matchup

  const ver = SIM_VER + (D.meta.generated_at || D.meta.date) + (SDH ? SDH.built : "");
  const saved = sxCalGet("nhl", ver, key); if (saved) return CALK[key] = saved;
  const [ea, eh] = expected(a, h), E = {a: ea, h: eh}, T = {a: team(a), h: team(h)};
  let c = {a: {s: 1, g: 1}, h: {s: 1, g: 1}};
  for (const n of [200, 400, 700]) {
    CALK[key] = c; const sog = {a: 0, h: 0}, gl = {a: 0, h: 0};
    for (let i = 0; i < n; i++) { const s = simulate(a, h, true); for (const k of ["a", "h"]) { sog[k] += s.st.regSog[k]; gl[k] += s.st.gp[k][0] + s.st.gp[k][1] + s.st.gp[k][2]; } }
    const nc = {}; for (const k of ["a", "h"]) nc[k] = {s: clamp(c[k].s * T[k].S / Math.max(5, sog[k] / n), .5, 2), g: clamp(c[k].g * Math.pow(E[k] / Math.max(.3, gl[k] / n), .9), .3, 3)};
    c = nc;
  }
  sxCalPut("nhl", ver, key, c);
  return CALK[key] = c;
}

// ---------- the engine: second by second ----------
// Shots on goal come at the rate the skaters' projected shots add up to, power plays and penalty kills at the rates these
// two teams generate and allow; each shot is a real location and shot type from the shooter's own history, it goes in at
// the league's rate for that spot and type times his finishing, and the matchup is tuned to the model's expected goals.
// Misses, blocks, rebounds, hits, takeaways, giveaways, penalties and faceoffs follow each team's and player's real rates.
function simulate(a, h, Q) {
  const S = {a: team(a), h: team(h)}, C = CALK[a + "|" + h] || {a: {s: 1, g: 1}, h: {s: 1, g: 1}};
  const ts = () => ({pp: 0, ppg: 0, pim: 0, hits: 0, blk: 0, fow: 0, miss: 0, give: 0, take: 0});
  const st = {score: {a: 0, h: 0}, sog: {a: 0, h: 0}, regSog: {a: 0, h: 0}, per: 1, gp: {a: [0, 0, 0, 0], h: [0, 0, 0, 0]}, sp: {a: [0, 0, 0, 0], h: [0, 0, 0, 0]},
    team: {a: ts(), h: ts()}, box: {}, goals: [], pens: [], so: null, secs: {a: [0, 0, 0], h: [0, 0, 0]},
    gk: {a: {name: S.a.goalie, sa: 0, ga: 0, season: S.a.gk.sv}, h: {name: S.h.goalie, sa: 0, ga: 0, season: S.h.gk.sv}}};
  const ev = [], opp = k => k === "a" ? "h" : "a", X = {a: S.a.x, h: S.h.x}, la = LGH.att;
  const pb = (k, p) => st.box[k + "|" + p.name] || (st.box[k + "|" + p.name] = {k, p, g: 0, a: 0, sog: 0, hit: 0, blk: 0, pim: 0, fow: 0, fol: 0, give: 0, take: 0});
  let t = 0, len = 1200, pens = [], pulled = {a: false, h: false};
  const clk = () => { const r = Math.max(0, len - t); return `${Math.floor(r / 60)}:${String(Math.floor(r % 60)).padStart(2, "0")}`; };
  const pl = () => st.per === 4 ? "OT" : `P${st.per}`;
  const strength = () => { const n = {a: 5, h: 5}; for (const p of pens) n[p.side]--; if (st.per === 4) { n.a -= 2; n.h -= 2; for (const p of pens) n[opp(p.side)]++; } return n; };
  function strLab() {
    const n = strength(), out = [];
    if (n.a !== n.h) { const k = n.a > n.h ? "a" : "h", p = pens.filter(x => x.side !== k).sort((x, y) => x.until - y.until)[0], r = p ? Math.max(0, p.until - t) : 0;
      out.push(`${S[k].ab} power play · ${n.a}-on-${n.h} · ${Math.floor(r / 60)}:${String(r % 60).padStart(2, "0")}`); }
    else if (st.per === 4) out.push("3-on-3 overtime");

  const say = (o, f) => { if (Q) return; ev.push(Object.assign({pl: pl(), t: clk(), score: {...st.score}, sog: {...st.sog}, str: strLab()}, o, {text: f()})); };

  const toiW = (p, i) => p.toi[i] || 0;

    const ca = pick(S.a.centers, S.a.centers.map(p => toiW(p, 0) + 1)), ch = pick(S.h.centers, S.h.centers.map(p => toiW(p, 0) + 1));
    const pa = ca.fo * (1 - ch.fo) / (ca.fo * (1 - ch.fo) + ch.fo * (1 - ca.fo)), w = R() < pa ? "a" : "h";

  }
  function goal(k, shooter, kind, en) {

    const mates = S[k].sk.filter(p => p !== shooter), nA = R() < .05 ? 0 : R() < .2 ? 1 : 2, ast = [], partners = shooter.ast || {}, ptot = Object.values(partners).reduce((s, v) => s + v, 0) || 1;
    for (let i = 0; i < nA && mates.length; i++) {   // assists: projected assists, his usual linemates and real assist partners

    return () => `<b>Goal</b> · ${esc(shooter.name)}${kind ? ` (${kind})` : ""}${ast.length ? `, assists ${ast.map(x => esc(lastName(x.name))).join(" and ")}` : ", unassisted"}${tag ? ` · ${tag === "EN" ? "empty net" : tag === "PP" ? "power play" : "shorthanded"}` : ""}`;

    if (pens.length && pens.some(p => p.until <= t)) { const over = pens.filter(p => p.until <= t); pens = pens.filter(p => p.until > t); for (const p of over) say({kind: "note"}, () => `${esc(S[p.side].ab)} back to full strength`); }

      for (const k of ["a", "h"]) { const o = opp(k); rt[k] = C[k].s * S[k].S / 3600 * (n[k] > n[o] ? PPM[k] : n[k] < n[o] ? .42 : 1) * (st.per === 4 ? 1.6 : 1) * (pulled[k] ? 1.8 : 1); }
    }
    for (const k of ["a", "h"]) st.secs[k][n[k] > n[opp(k)] ? 1 : n[k] < n[opp(k)] ? 2 : 0]++;
    // at most one thing happens in a second: one draw decides whether anything does, a second one decides what
    const pen = st.per < 4 ? 1 : 0, tot = rt.a * (1 + missR.a + blkR.a) + rt.h * (1 + missR.h + blkR.h) + hitR.a + hitR.h + giveR.a + giveR.h + takeR.a + takeR.h + pen * (penR.a + penR.h) + 1 / 165;
    if (R() < tot) {
      let u = R() * tot;
      for (const k of ["a", "h"]) {
        const o = opp(k), si = n[k] > n[o] ? 1 : n[k] < n[o] ? 2 : 0, on = p => toiW(p, si) + .1;
        if ((u -= rt[k]) < 0) { if (shot(k, n, false)) ended = true; break; }
        if ((u -= rt[k] * missR[k]) < 0) { st.team[k].miss++; break; }
        if ((u -= rt[k] * blkR[k]) < 0) { st.team[o].blk++; pb(o, pickSk(o, p => p.blk * on(p))).blk++; break; }
        if ((u -= hitR[k]) < 0) { st.team[k].hits++; pb(k, pickSk(k, p => p.hit * toiW(p, 0))).hit++; break; }
        if ((u -= giveR[k]) < 0) { st.team[k].give++; pb(k, pickSk(k, p => p.give * on(p))).give++; break; }
        if ((u -= takeR[k]) < 0) { st.team[k].take++; pb(k, pickSk(k, p => p.take * on(p))).take++; break; }
        if ((u -= pen * penR[k]) < 0) {
          const who = pickSk(k, p => p.pim * (toiW(p, 0) + toiW(p, 2))), why = pick(PEN, PEN.map(() => 1));
          pens.push({side: k, until: t + 120}); st.team[k].pim += 2; st.team[o].pp++; pb(k, who).pim += 2;
          st.pens.push({pl: pl(), t: clk(), k, who: who.name, why});
          say({kind: "pen", side: k, to: true}, () => `Penalty · ${esc(who.name)}, 2 minutes for ${why}`); faceoff(); break;
        }
        if (k === "h") faceoff();   // icings, offsides, pucks out of play
      }
    }
    if (ended || t < len) continue;
    if (st.per < 3) { say({kind: "sec"}, () => `End of the ${["1st", "2nd"][st.per - 1]} period`); st.per++; t = 0; pens.forEach(p => p.until -= len); say({kind: "sec"}, () => `${["", "", "2nd", "3rd"][st.per]} period`); faceoff(); continue; }
    if (st.score.a !== st.score.h) break;
    if (st.per === 3) { say({kind: "sec"}, () => "End of regulation · 3-on-3 overtime"); st.per = 4; t = 0; len = 300; pulled = {a: false, h: false}; pens.forEach(p => p.until -= 1200); faceoff(); continue; }
    // shootout: three rounds, then sudden death; shooters by projected goals
    say({kind: "sec"}, () => "Shootout");
    const so = {a: 0, h: 0}, shots = {a: 0, h: 0}, L = {a: [...S.a.sk].sort((x, y) => (L3(y).goals || 0) - (L3(x).goals || 0)), h: [...S.h.sk].sort((x, y) => (L3(y).goals || 0) - (L3(x).goals || 0))};
    for (let r = 0; r < 20; r++) {
      let done = false;
      for (const k of ["a", "h"]) {
        const p = L[k][r % L[k].length], sc = R() < .3 + (L3(p).goals || .2) * .3; if (sc) so[k]++;
        if (!Q) ev.push({pl: "SO", t: `Rd ${r + 1}`, score: {...st.score}, sog: {...st.sog}, str: "Shootout", side: k, sc: false, kind: "so", text: `${esc(p.name)} ${sc ? "<b>scores</b>" : `is stopped by ${esc(lastName(S[opp(k)].goalie))}`}`});
        shots[k]++;
        if (r < 3 && (so.a > so.h + 3 - shots.h || so.h > so.a + 3 - shots.a)) { done = true; break; }   // decided before all three rounds
      }
      if (done || (r >= 2 && so.a !== so.h)) break;
    }
    const w = so.a > so.h ? "a" : "h"; st.so = {a: so.a, h: so.h, w}; st.score[w]++;
    break;
  }
  // ice time: each strength's minutes shared by usual deployment (five skaters at even strength, four killing a penalty)
  for (const k of ["a", "h"]) for (const p of S[k].sk) { const b = pb(k, p), T = S[k];
    b.toi = [0, 1, 2].reduce((s, i) => s + (T.toiSum[i] ? st.secs[k][i] * p.toi[i] / T.toiSum[i] * (i === 2 ? 4 : 5) : 0), 0); }
  say({kind: "sec"}, () => `Final${st.so ? " · shootout" : st.per === 4 ? " · overtime" : ""}`);
  return {a, h, T: S, st, ev, final: {...st.score}, exp: expected(a, h)};
}

// ---------- screens ----------
const svp = G => G.sa ? ((G.sa - G.ga) / G.sa).toFixed(3).replace(/^0/, "") : "–";
const SIMX = {
  dataUrl: "data.json", extraUrl: "nhl_sim.json", startPl: "P1", startClock: "20:00", kickText: "Puck drop", otLabel: "OT / shootout", emptyText: "No NHL games on today's slate",
  multiN: 1000, multiChunk: 25, marginBins: [[-99, -3], [-2, -2], [-1, -1], [1, 1], [2, 2], [3, 99]], marginEdge: 3, marginMid: "One-goal games in the middle",
  note: "Teams on today's slate, built from every shot, goal, penalty and shift of this season and last plus the model's projections. The game is played out second by second: each team shoots as often as its skaters' projected shots add up to, shooters follow each player's projected shots and power-play unit, and finishing follows each player's projected shooting rate. Penalties, pulled goalies, 3-on-3 overtime and shootouts all play out. Each matchup is tuned so regulation shots and goals average the model's numbers.",
  fmt: v => v.toFixed(2), avgLabel: "Regulation goals",
  init(d, x) { D = d; if (x && x.league) { SDH = x; LGH = Object.assign({}, LGH, x.league); } loadTeams(); },
  teams: () => Object.keys(TEAMS).map(team).sort((x, y) => x.name.localeCompare(y.name)),
  team, expected, pModel, prepare, simulate,
  slate: () => (D.games || []).map(g => ({a: team(g.away.abbr), h: team(g.home.abbr), pa: g.lam_away, ph: g.lam_home, pHome: pModel(g.away.abbr, g.home.abbr),
    when: g.start_utc ? new Date(g.start_utc).toLocaleTimeString("en-US", {hour: "numeric", minute: "2-digit"}) : ""})),
  slateLabel: () => "Today",
  teamSub: (sim, e, k, final) => !sim.st ? `G ${lastName(sim.T[k].goalie)}` : `${final ? sim.st.sog[k] : e ? e.sog[k] : 0} shots`,
  finalLab: sim => sim.st.so ? "FINAL · SO" : sim.st.per === 4 ? "FINAL · OT" : "FINAL",
  stage(sim, e, n) {
    const T = sim.T, per = e ? e.pl : "P1", dots = sim.ev.slice(0, n).filter(x => x.x != null && x.pl === per).slice(-14), cur = sim.ev[n - 1];
    const str = e && e.str, sog = e ? e.sog : {a: 0, h: 0};
    return `<div class="sx-sit"><span>${str ? `<span class="warn">${esc(str)}</span>` : "Even strength"}</span><span>Shots <b>${sog.a}–${sog.h}</b></span></div>
      <div class="ice"><span class="zn" style="left:13%">${esc(T.h.ab)} NET</span><span class="zn" style="right:13%">${esc(T.a.ab)} NET</span>
        <i class="gl" style="left:9%"></i><i class="gl" style="right:9%"></i><i class="cr l"></i><i class="cr r"></i>
        <i class="cl" style="left:36%;background:rgba(60,110,220,.5)"></i><i class="cl" style="left:50%;background:rgba(210,40,40,.5)"></i><i class="cl" style="left:64%;background:rgba(60,110,220,.5)"></i><i class="fo"></i>
        ${dots.map(d => `<i class="dot ${d.kind === "goal" ? "g" : ""} ${d === cur ? "now" : ""}" style="left:${d.x}%;top:${d.y}%;background:${esc(T[d.side].color)}"></i>`).join("")}</div>`;
  },
  summary(sim) {
    const {st, T} = sim, A = st.team.a, H = st.team.h, ot = st.per === 4 || st.so;
    const c = Object.values(st.box).map(b => ({name: b.p.name, img: b.p.headshot, team: T[b.k], sc: 3 * b.g + 2 * b.a + .12 * b.sog + .04 * (b.hit + b.blk) + (st.score[b.k] > st.score[b.k === "a" ? "h" : "a"] ? .3 : 0), line: `${b.g} G · ${b.a} A · ${b.sog} SOG`}));
    for (const k of ["a", "h"]) { const G = st.gk[k], sv = G.sa - G.ga, p = G.sa ? sv / G.sa : 1;
      c.push({name: G.name, team: T[k], sc: (p - .885) * 40 + sv * .07 + (st.score[k] > st.score[k === "a" ? "h" : "a"] ? .4 : 0) + (G.ga === 0 ? 2.5 : 0), line: `${sv} saves · ${svp(G)}`}); }
    const stars = c.sort((x, y) => y.sc - x.sc).slice(0, 3).map((x, i) => Object.assign(x, {label: ["1st star", "2nd star", "3rd star"][i]}));
    const heads = ["1", "2", "3"].concat(st.per === 4 || st.so ? ["OT"] : []).concat(st.so ? ["SO"] : []);
    const col = k => st.gp[k].slice(0, ot ? 4 : 3).concat(st.so ? [st.so[k]] : []);
    const fo = k => (A.fow + H.fow) ? st.team[k].fow / (A.fow + H.fow) : .5;
    return sxTops(stars)
      + `<div class="sx-h"><b>Scoring</b><span>Shots ${esc(T.a.ab)} ${st.sog.a} · ${esc(T.h.ab)} ${st.sog.h}</span></div>` + sxLineScore(sim, heads, {a: col("a"), h: col("h")})
      + `<div class="sx-card sx-feed" style="margin-top:8px">${st.goals.map(g => `<div class="sx-r sc"><i>${esc(g.pl)} ${esc(g.t)}</i><span><b>${esc(T[g.k].ab)}</b> · ${esc(g.who)}${g.tag ? ` (${g.tag})` : ""}<br><span style="font-size:12px;color:var(--t3)">${g.ast.length ? "Assists: " + g.ast.map(esc).join(", ") : "Unassisted"}</span></span><em>${g.a}–${g.h}</em></div>`).join("")
        + (st.so ? `<div class="sx-r sc"><i>SO</i><span><b>${esc(T[st.so.w].ab)}</b> win the shootout ${Math.max(st.so.a, st.so.h)}–${Math.min(st.so.a, st.so.h)}</span><em>${st.score.a}–${st.score.h}</em></div>` : "") || `<div class="sx-r"><i></i><span>No goals</span></div>`}</div>`
      + `<div class="sx-h"><b>Team stats</b><span>Model xG ${esc(T.a.ab)} ${sim.exp[0].toFixed(2)} – ${sim.exp[1].toFixed(2)} ${esc(T.h.ab)}</span></div>`
      + sxCompare(sim, [["Shots on goal", st.sog.a, st.sog.h, true], ["Power play", A.pp ? A.ppg / A.pp : 0, H.pp ? H.ppg / H.pp : 0, true, `${A.ppg}/${A.pp}`, `${H.ppg}/${H.pp}`],
        ["Faceoffs", fo("a"), fo("h"), true, sxPct(fo("a")), sxPct(fo("h"))], ["Hits", A.hits, H.hits, null], ["Blocked shots", A.blk, H.blk, null], ["Missed shots", A.miss, H.miss, null], ["Takeaways", A.take, H.take, true], ["Giveaways", A.give, H.give, false], ["Penalty minutes", A.pim, H.pim, false]])
      + (st.pens.length ? `<div class="sx-h"><b>Penalties</b></div><div class="sx-card sx-feed">${st.pens.map(p => `<div class="sx-r"><i>${esc(p.pl)} ${esc(p.t)}</i><span><b>${esc(T[p.k].ab)}</b> · ${esc(p.who)}, ${esc(p.why)}</span><em style="color:var(--t3)">2:00</em></div>`).join("")}</div>` : "");
  },
  box(sim) {
    const {st, T} = sim;
    return ["a", "h"].map(k => { const B = Object.values(st.box).filter(b => b.k === k).sort((x, y) => (y.g + y.a) - (x.g + x.a) || y.g - x.g || y.sog - x.sog), G = st.gk[k];
      return `<div class="sx-card" style="margin-top:12px;padding-bottom:6px">${sxHead(T[k])}
        ${sxTable(["Skaters", "G", "A", "SOG", "Hit", "Blk", "FO", "TOI"], B.map(b => [esc(b.p.name), b.g, b.a, b.sog, b.hit, b.blk, b.fow + b.fol ? `${b.fow}-${b.fol}` : "–", b.toi ? `${Math.floor(b.toi / 60)}:${String(Math.round(b.toi % 60)).padStart(2, "0")}` : "–"]))}
        ${sxTable(["Goalie", "SA", "GA", "SV%", "Season"], [[esc(G.name), G.sa, G.ga, svp(G), G.season ? G.season.toFixed(3).replace(/^0/, "") : "–"]])}</div>`; }).join("");
  },
  spreadName: "Puck line",
  spreadLine: B => SIMX.pModel(B.a, B.h) >= .5 ? -1.5 : 1.5,
  frac(e) { const m = /(\d+):(\d+)/.exec(e.t || "") || [0, 0, 0], secs = +m[1] * 60 + +m[2], p = {P1: 1, P2: 2, P3: 3}[e.pl];
    return p ? ((3 - p) * 1200 + secs) / 3600 : e.pl === "OT" ? secs / 3600 * .5 : 0; },
  liveP(sim, e) {   // goals still to come at each side's expected rate; a tie after regulation is a coin flip
    const f = SIMX.frac(e), lead = e.score.h - e.score.a;
    if (f <= 0) return lead > 0 ? 1 : lead < 0 ? 0 : .5;
    const la = sim.exp[0] * f, lh = sim.exp[1] * f, pm = (l, k) => { let v = Math.exp(-l); for (let i = 1; i <= k; i++) v *= l / i; return v; };
    let p = 0; for (let i = 0; i < 12; i++) for (let j = 0; j < 12; j++) { const q = pm(lh, i) * pm(la, j), m = lead + i - j; p += m > 0 ? q : m === 0 ? q / 2 : 0; }
    return p;
  },
  type: T => { const x = T.x || {}; return (x.cf60 || 1) > 1.04 ? {n: "Speed", c: "#f97316"} : (x.blk || 1) > 1.05 ? {n: "Steel", c: "#64748b"} : (x.pp60 || 1) > 1.05 ? {n: "Spark", c: "#eab308"} : {n: "Normal", c: "#8b90a8"}; },
  move(e, sim) {
    const T = sim.T, me = e.side && T[e.side] ? T[e.side].ab : "", txt = e.text || "";
    if (e.kind === "goal") return {mv: `${me} used GOAL FLASH!`, eff: "It's super effective!"};
    if (e.kind === "so") return {mv: `${me} used SHOOTOUT DEKE!`, eff: /scores/.test(txt) ? "It's super effective!" : "But it was blocked!"};
    if (e.kind === "pen") return {mv: `${me} was sent to the box!`, eff: ""};
    if (e.kind === "shot") { const mv = /rebound/.test(txt) ? "REBOUND RUSH" : /slap/.test(txt) ? "SLAP SHOT" : /snap/.test(txt) ? "SNAP SHOT" : /tip-in|deflection/.test(txt) ? "TIP-IN" : /backhand/.test(txt) ? "BACKHAND" : "WRIST FLICK";
      return {mv: `${me} used ${mv}!`, eff: "But the goalie stopped it!"}; }
    if (/pull/.test(txt)) return {mv: `${me} used EXTRA ATTACKER!`, eff: ""};
    return null;
  },
  props(B) {   // the sportsbook's player props: likeliest scorers, top shooters, a point
    const out = [];
    for (const k of ["a", "h"]) {
      const T = B.T[k], sk = T.sk.filter(p => p.lam), val = (d, n, i) => ((d.p[k + "|" + n] || [])[i] || 0);
      [...sk].sort((x, y) => (L3(y).goals || 0) - (L3(x).goals || 0)).slice(0, 3).forEach((p, i) => out.push({id: `g_${k}${i}`, who: p.name, team: k, stat: "anytime goal", kind: "yes", get: d => val(d, p.name, 0)}));
      [...sk].sort((x, y) => (L3(y).sog || 0) - (L3(x).sog || 0)).slice(0, 2).forEach((p, i) => out.push({id: `s_${k}${i}`, who: p.name, team: k, stat: "shots", kind: "ou", get: d => val(d, p.name, 2)}));
      [...sk].sort((x, y) => (L3(y).points || 0) - (L3(x).points || 0)).slice(0, 1).forEach((p, i) => out.push({id: `pt_${k}${i}`, who: p.name, team: k, stat: "a point", kind: "yes", get: d => val(d, p.name, 0) + val(d, p.name, 1)}));
    }
    return out;
  },
  digest(sim) {
    const p = {}; for (const b of Object.values(sim.st.box)) p[b.k + "|" + b.p.name] = [b.g, b.a, b.sog];
    const g = sim.st.gp; return {s: sim.final, r: {a: g.a[0] + g.a[1] + g.a[2], h: g.h[0] + g.h[1] + g.h[2]}, ot: sim.st.per === 4, p};
  },
  multiPlayers(M) {
    const rows = [], n = M.res.length;
    for (const k of ["a", "h"]) { const T = M.T[k];
      for (const p of [...T.sk].filter(p => p.lam).sort((x, y) => (L3(y).points || 0) - (L3(x).points || 0)).slice(0, 5)) {
        let sog = 0, g1 = 0, pt1 = 0; for (const d of M.res) { const v = d.p[k + "|" + p.name] || [0, 0, 0]; sog += v[2]; g1 += v[0] > 0 ? 1 : 0; pt1 += v[0] + v[1] > 0 ? 1 : 0; }
        const mute = v => `<span style="color:var(--t3);font-weight:500"> ${v}</span>`;
        rows.push([`${esc(lastName(p.name))} <span style="color:var(--t3);font-weight:500">${esc(T.ab)}</span>`, `<b>${(sog / n).toFixed(1)}</b>${mute(L3(p).sog.toFixed(1))}`,
          `<b>${sxPct(g1 / n)}</b>${mute(sxPct(1 - Math.exp(-(L3(p).goals || 0))))}`, `<b>${sxPct(pt1 / n)}</b>${mute(sxPct(1 - Math.exp(-(L3(p).points || 0))))}`]);
      } }
    if (!rows.length) return "";
    return `<div class="sx-h"><b>Players: sim vs model</b><span>Sim, then model</span></div><div class="sx-card">${sxTable(["Player", "Shots", "Goal", "Point"], rows)}</div>`;
  },
};
sxBoot();
</script>
