<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070806">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Blitzed">
<title>Blitzed · NHL projections</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Inter+Tight:wght@500;600;650;700;800&family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700;1,800&family=Barlow+Semi+Condensed:wght@600;700;800&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --ice: #bfe0f2; --ice-2: #d7ecf8; --cream: #fffaf0; --navy: #1f3448; --ink: #1f3448; --ink-2: #4d5d6c;
  --muted: #7a8894; --red: #d9443a; --red-soft: #fbe3df; --gold: #e2ae45; --gold-soft: #fbefd2;
  --green: #2e8b57; --green-soft: #def2e5; --line: #e7dfcf;
  --nav-h: 64px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body {
  font-family: var(--fb); color: var(--ink); min-height: 100vh;
  background:
    linear-gradient(90deg, transparent calc(50% - 2px), rgba(217,68,58,.10) calc(50% - 2px), rgba(217,68,58,.10) calc(50% + 2px), transparent calc(50% + 2px)),
    radial-gradient(120% 80% at 50% 0%, #d9eefa 0%, var(--ice) 60%, #a9d4ec 100%) fixed;
}
button { font: inherit; color: inherit; cursor: pointer; }
.wrap { max-width: 720px; margin: 0 auto; padding: calc(10px + env(safe-area-inset-top)) 12px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom)); }

/* header */
.hdr { display: flex; align-items: center; gap: 12px; margin: 4px 4px 12px; }
.hdr .mlogo { height: 56px; width: auto; flex: none; margin: -4px -2px -4px 0; filter: drop-shadow(1px 2px 0 rgba(0,0,0,.25)); }
.hdr .t { flex: 1; min-width: 0; }
.hdr h1 { font-family: var(--fh); font-size: 24px; margin: 0; line-height: 1.1; color: var(--navy); }
.hdr .sub { font-size: 13px; font-weight: 800; color: var(--ink-2); }
.iconbtn { width: 40px; height: 40px; border-radius: 50%; border: 2.5px solid var(--navy); background: var(--cream);
           box-shadow: 2px 3px 0 var(--navy); font-size: 18px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
.sport { display: flex; border: 2.5px solid var(--navy); border-radius: 999px; background: var(--cream); box-shadow: 2px 3px 0 var(--navy); overflow: hidden; }
.sport a { padding: 6px 10px; font-weight: 800; font-size: 13px; color: var(--navy); text-decoration: none; }
.sport a.on { background: var(--navy); color: var(--cream); }
.strip { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 0 0 12px; padding: 2px 4px 4px; }
.strip::-webkit-scrollbar { display: none; }
.chip { flex: 0 0 auto; border: 2.5px solid var(--navy); border-radius: 999px; background: var(--cream); padding: 6px 12px;
        font-weight: 800; font-size: 13.5px; white-space: nowrap; color: var(--navy); }
.chip.on { background: var(--navy); color: var(--cream); }
.chip.info { background: transparent; border-style: dashed; }
.chip.live-c { background: var(--red-soft); }

/* cards */
.card { background: var(--cream); border: 3px solid var(--navy); border-radius: 22px; padding: 14px; box-shadow: 4px 5px 0 var(--navy); margin: 0 4px 16px 0; }
.status { display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 800; color: var(--ink-2); margin-bottom: 8px; }
.live { display: inline-flex; align-items: center; gap: 5px; background: var(--red); color: #fff; font-weight: 800; font-size: 12px;
        border-radius: 999px; padding: 2px 9px; letter-spacing: .04em; }
.live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--surf); animation: blink 1.2s infinite; }
@keyframes blink { 50% { opacity: .2; } }
.final { background: var(--navy); color: var(--cream); font-weight: 800; font-size: 12px; border-radius: 999px; padding: 2px 9px; letter-spacing: .04em; }
.trow { display: grid; grid-template-columns: 40px 1fr auto; gap: 10px; align-items: center; padding: 5px 0; }
.logo { width: 40px; height: 40px; object-fit: contain; }
.code { width: 40px; height: 40px; border-radius: 12px; border: 2px solid var(--navy); background: var(--ice-2); display: flex;
        align-items: center; justify-content: center; font-family: var(--fh); font-weight: 600; font-size: 12px; }
.tname { font-family: var(--fh); font-weight: 600; font-size: 18px; line-height: 1.1; }
.gk { font-size: 12.5px; font-weight: 700; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; vertical-align: 1px; }
.dot.ok { background: var(--green); } .dot.lk { background: var(--gold); } .dot.un { background: var(--surf-2); }
.right { text-align: right; }
.pct { font-family: var(--fh); font-weight: 700; font-size: 18px; }
.score { font-family: var(--fh); font-weight: 700; font-size: 28px; line-height: 1; }
.score.lose { color: var(--muted); }
.bar { display: flex; height: 8px; border-radius: 99px; overflow: hidden; border: 2px solid var(--navy); gap: 2px; background: var(--navy); margin: 8px 0 12px; }

/* price tiles */
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tile { border: 2.5px solid var(--navy); border-radius: 14px; background: var(--surf); padding: 8px 10px; text-align: left; display: flex;
        flex-direction: column; gap: 2px; min-height: 58px; box-shadow: 2px 2px 0 var(--navy); }
.tile:active { transform: translate(2px, 2px); box-shadow: none; }
.tile .l { font-size: 13px; font-weight: 800; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .v { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
.tile .c { font-family: var(--fh); font-weight: 700; font-size: 19px; color: var(--navy); }
.tile .b { font-family: var(--fh); font-weight: 700; font-size: 16px; color: var(--green); }
.tile .dk { font-size: 11.5px; font-weight: 800; color: var(--ink-2); } .tile .dk .pos { color: var(--green); } .tile .dk .neg { color: var(--red); }
.tile.val { border-color: var(--green); box-shadow: 2px 2px 0 var(--green); background: var(--surf-2); }
.tile.won { background: var(--green-soft); } .tile.lost { background: var(--surf-2); } .tile.lost > * { opacity: .5; } .tile.push { background: var(--surf-2); }
.sec { font-size: 11.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 800; margin: 14px 2px 6px; }
.more { width: 100%; margin-top: 10px; border: 2.5px dashed var(--navy); background: transparent; border-radius: 14px; padding: 9px; font-weight: 800; font-size: 14px; color: var(--navy); }
.inj { font-size: 13px; color: var(--ink-2); font-weight: 700; line-height: 1.5; } .inj b { color: var(--red); }
.lines { display: grid; grid-template-columns: 1fr; gap: 12px; font-size: 13px; font-weight: 700; color: var(--ink-2); }
.lines .ln { margin: 3px 0; display: grid; grid-template-columns: 38px 1fr; } .lines .ln b { color: var(--navy); }
.lines .tn { font-family: var(--fh); font-weight: 600; font-size: 15px; color: var(--navy); margin-bottom: 4px; }

/* players */
.search { width: 100%; font: inherit; font-weight: 700; color: var(--navy); background: var(--cream); border: 2.5px solid var(--navy);
          border-radius: 999px; padding: 10px 16px; margin: 0 0 10px; }
.prow { padding: 10px 0; border-bottom: 2px dashed var(--line); }
.prow:last-child { border-bottom: 0; }
.phead { display: flex; align-items: center; gap: 10px; }
.av { position: relative; flex: 0 0 auto; width: 42px; height: 42px; border-radius: 50%; background-color: var(--ice-2);
      background-image: radial-gradient(circle at 35% 28%, rgba(255,255,255,.35), rgba(255,255,255,0) 60%);
      border: 2.5px solid var(--navy); display: flex; align-items: center; justify-content: center;
      font-family: var(--fh); font-weight: 600; font-size: 14px; color: #fff; overflow: hidden; }
.av img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.pname { font-weight: 800; font-size: 15.5px; line-height: 1.15; }
.pmeta { font-size: 12.5px; color: var(--ink-2); font-weight: 700; }
.stat { display: inline-block; margin-left: 4px; font-size: 11.5px; font-weight: 800; padding: 0 7px; border-radius: 999px; border: 2px solid var(--navy); background: var(--surf); }
.stat.in { background: var(--red-soft); } .stat.post { background: var(--surf-2); }
.pchips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin-top: 8px; padding: 0 0 4px 52px; }
.pchips::-webkit-scrollbar { display: none; }
.lc { flex: 0 0 auto; border: 2px solid var(--navy); border-radius: 12px; padding: 4px 9px; background: var(--surf); font-size: 13px; font-weight: 700; text-align: left; box-shadow: 2px 2px 0 var(--navy); }
.lc b { font-family: var(--fh); } .lc .t { color: var(--green); font-weight: 800; }
.lc.won { background: var(--green-soft); } .lc.lost { opacity: .45; }

/* bottom nav */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; justify-content: center;
       padding: 8px 12px calc(8px + env(safe-area-inset-bottom)); background: linear-gradient(180deg, rgba(191,224,242,0), rgba(191,224,242,.95) 35%); }
.nav .in { display: flex; gap: 2px; background: var(--cream); border: 3px solid var(--navy); border-radius: 999px; padding: 5px; box-shadow: 3px 4px 0 var(--navy); width: 100%; max-width: 480px; }
.nav button { flex: 1; border: 0; background: transparent; border-radius: 999px; height: 44px; font-family: var(--fh); font-weight: 600; font-size: 14px; color: var(--navy); padding: 0 2px; white-space: nowrap; }
.nav button.on { background: var(--navy); color: var(--cream); }

/* bottom sheet */
.scrim { position: fixed; inset: 0; background: rgba(31,52,72,.45); z-index: 30; opacity: 0; pointer-events: none; transition: opacity .2s; }
.scrim.open { opacity: 1; pointer-events: auto; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 31; max-width: 560px; margin: 0 auto; background: var(--cream);
         border: 3px solid var(--navy); border-bottom: 0; border-radius: 26px 26px 0 0; padding: 10px 18px calc(18px + env(safe-area-inset-bottom));
         transform: translateY(105%); transition: transform .25s ease; max-height: 88vh; overflow-y: auto; }
.sheet.open { transform: none; }
.grab { width: 44px; height: 5px; border-radius: 9px; background: var(--surf-2); margin: 2px auto 10px; }
.sh-t { font-family: var(--fh); font-weight: 600; font-size: 22px; color: var(--navy); line-height: 1.15; padding-right: 48px; }
.sh-s { font-size: 13.5px; font-weight: 700; color: var(--ink-2); margin-top: 2px; }
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0; }
.kpi { border: 2.5px solid var(--navy); border-radius: 14px; padding: 8px; text-align: center; background: var(--surf); }
.kpi .k { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 800; }
.kpi .n { font-family: var(--fh); font-weight: 700; font-size: 22px; color: var(--navy); }
.kpi.g .n { color: var(--green); }
.oddsrow { display: flex; gap: 8px; align-items: stretch; }
.sign { display: flex; border: 2.5px solid var(--navy); border-radius: 14px; overflow: hidden; }
.sign button { border: 0; width: 46px; font-size: 22px; font-weight: 800; background: var(--surf); }
.sign button.on { background: var(--navy); color: var(--cream); }
.odds { flex: 1; font: inherit; font-family: var(--fh); font-size: 24px; font-weight: 700; color: var(--navy); border: 2.5px solid var(--navy);
        border-radius: 14px; padding: 8px 12px; background: var(--surf); min-width: 0; }
.verdict { margin-top: 14px; border-radius: 16px; padding: 12px 14px; border: 2.5px solid var(--navy); }
.verdict .h { font-family: var(--fh); font-weight: 700; font-size: 24px; }
.verdict.good { background: var(--green-soft); } .verdict.good .h { color: var(--green); }
.verdict.meh { background: var(--gold-soft); } .verdict.meh .h { color: #9a6a12; }
.verdict.bad { background: var(--red-soft); } .verdict.bad .h { color: var(--red); }
.verdict .d { font-size: 14px; font-weight: 700; color: var(--ink-2); margin-top: 4px; }
.hint { font-size: 13px; font-weight: 700; color: var(--ink-2); margin-top: 10px; }
.close { position: absolute; right: 14px; top: 12px; }
.trust { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 2px dashed var(--line); font-weight: 800; }
.trust:last-child { border-bottom: 0; }

/* check (custom line) */
label.f { display: block; font-size: 13px; font-weight: 800; color: var(--ink-2); margin: 10px 0 4px 4px; }
.card input, .card select { font: inherit; font-weight: 700; color: var(--navy); background: var(--cream); border: 2.5px solid var(--navy);
                border-radius: 999px; padding: 9px 14px; min-height: 44px; width: 100%; appearance: none; -webkit-appearance: none; }
.card select { background-image: linear-gradient(45deg, transparent 50%, var(--navy) 50%), linear-gradient(135deg, var(--navy) 50%, transparent 50%);
         background-position: calc(100% - 20px) 50%, calc(100% - 14px) 50%; background-size: 6px 6px; background-repeat: no-repeat; padding-right: 34px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.seg { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.seg button { border: 2.5px solid var(--navy); border-radius: 999px; background: var(--cream); padding: 7px 14px; font-weight: 800; color: var(--navy); }
.seg button.on { background: var(--navy); color: var(--cream); }
.vline { font-size: 16px; font-weight: 700; color: var(--ink-2); margin: 5px 0; } .vline b { color: var(--navy); }
.vs .row { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 700; margin: 5px 0; }
.vs .lab { width: 52px; color: var(--ink-2); }
.vs .bar { flex: 1; height: 12px; border-radius: 99px; background: var(--surf-2); border: 2px solid var(--navy); overflow: hidden; margin: 0; display: block; gap: 0; }
.vs .bar div { height: 100%; } .vs .num { width: 44px; text-align: right; }
.card .verdict { border: 0; padding: 0; margin: 0 0 6px; font-family: var(--fh); font-weight: 700; font-size: 28px; }
.card .verdict.good { color: var(--green); background: none; } .card .verdict.meh { color: #9a6a12; background: none; } .card .verdict.bad { color: var(--red); background: none; }
.note { color: var(--ink-2); font-size: 14.5px; margin: 0 4px 12px; font-weight: 600; }
.empty { text-align: center; } .empty .e { font-size: 40px; } .empty .t { font-family: var(--fh); font-size: 20px; font-weight: 600; margin: 6px 0; }
.foot { text-align: center; color: #56708a; font-size: 12px; font-weight: 700; margin-top: 18px; }
/* team-colour game cards */
.card.gc { padding: 0; overflow: hidden; }
.gc .band { padding: 12px 14px 4px; }
.gc .status { color: inherit; opacity: .9; }
.gc .gk { color: inherit; opacity: .85; }
.gc .tname, .gc .pct, .gc .score { text-shadow: 0 1px 0 rgba(0,0,0,.12); }
.gc .ink-light .tname, .gc .ink-light .pct, .gc .ink-light .score { text-shadow: 0 1px 2px rgba(0,0,0,.35); }
.gc .score.lose { color: inherit; opacity: .5; }
.gc .code { color: var(--navy); text-shadow: none; }
.gc .logo { filter: drop-shadow(0 2px 2px rgba(0,0,0,.25)); }
.gc .final { background: var(--surf); color: var(--navy); border: 2px solid var(--navy); }
.gc .live { border: 2px solid var(--navy); }
.gc .bar { margin: 6px 0 10px; }
.gc .body { padding: 0 14px 14px; }
.gc .more { background: var(--cream); border-style: solid; box-shadow: 2px 2px 0 var(--navy); }
.gc .panel { background: var(--cream); border: 2.5px solid var(--navy); border-radius: 16px; padding: 2px 12px 12px; margin-top: 10px; }
/* matchup breakdown */
.mx .r { display: grid; grid-template-columns: 128px 38px 1fr 38px; align-items: center; gap: 8px; margin: 9px 0; }
.mx .hd { margin: 0 0 4px; }
.mx .hd .v { font-family: var(--fh); font-size: 14px; }
.mx .vs { text-align: center; font-size: 11px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.mx .lab { font-size: 13.5px; font-weight: 800; color: var(--navy); white-space: nowrap; }
.mx .v { font-family: var(--fh); font-weight: 700; font-size: 14px; color: var(--navy); }
.mx .v.r2 { text-align: right; } .mx .v.neg { color: var(--red); }
.mx .tr { display: flex; height: 12px; background: var(--surf-2); border: 2px solid var(--navy); border-radius: 99px; overflow: hidden; }
.mx .half { flex: 1; display: flex; } .mx .half.l { justify-content: flex-end; border-right: 2px solid var(--navy); }
.mx .half div { height: 100%; }
.lu { font-size: 13px; font-weight: 700; color: var(--ink-2); margin-top: 8px; padding: 6px 10px; border-radius: 12px; border: 2px solid var(--navy); }
.lu.dn { background: var(--red-soft); } .lu.up { background: var(--green-soft); } .lu b { color: var(--navy); }
.edges { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 12px; }
.edges .et { font-size: 11.5px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-right: 2px; }
.edge { font-size: 13px; font-weight: 800; border: 2px solid var(--navy); border-radius: 999px; padding: 2px 9px; background: var(--surf); }
.edge.soft { border-style: dashed; background: transparent; color: var(--ink-2); }
/* game panel tabs + compact player rows */
.ptabs { display: flex; gap: 4px; background: var(--surf-2); border-radius: 999px; padding: 4px; margin: 10px 0 12px; }
.ptabs button { flex: 1; border: 0; background: transparent; border-radius: 999px; padding: 7px 0; font-weight: 800; font-size: 13.5px; color: var(--navy); }
.ptabs button.on { background: var(--navy); color: var(--cream); }
.mini { display: grid; grid-template-columns: 36px minmax(0, 1fr); column-gap: 10px; row-gap: 5px; align-items: center; padding: 8px 0; border-bottom: 2px dashed var(--line); }
.mini:last-of-type { border-bottom: 0; }
.mini .av { width: 36px; height: 36px; font-size: 12px; }
.mini .mc { grid-column: 2; display: flex; gap: 6px; } .mini .lc { padding: 3px 7px; font-size: 12px; }
.who { border: 0; background: transparent; padding: 0; text-align: left; min-width: 0; }
.mini .mn { grid-column: 2; } .mini > .who:first-child { grid-row: 1; }
.chev { color: var(--muted); font-weight: 800; }
.props-seg { margin-top: 0; background: var(--cream); border: 2.5px solid var(--navy); }
.phd { display: flex; gap: 12px; align-items: center; padding-right: 44px; }
.phd .av { width: 54px; height: 54px; font-size: 17px; }
.plh, .pl { display: grid; grid-template-columns: 1fr 64px 64px; align-items: center; gap: 6px; }
.plh { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 800; margin: 14px 0 2px; text-align: right; }
.psec { margin-top: 10px; }
.ph { display: flex; justify-content: space-between; align-items: baseline; font-family: var(--fh); font-weight: 600; font-size: 16px; color: var(--navy); border-bottom: 2px solid var(--line); padding-bottom: 3px; }
.ph .pm { font-family: var(--fb); font-size: 12.5px; font-weight: 800; color: var(--ink-2); }
.pl { width: 100%; border: 0; background: transparent; padding: 8px 2px; border-bottom: 2px dashed var(--line); font-weight: 800; font-size: 14.5px; text-align: left; }
.pl .c, .pl .b { text-align: right; font-family: var(--fh); font-weight: 700; } .pl .b { color: var(--green); }
.pl.won { background: var(--green-soft); } .pl.lost { opacity: .45; }
.link { width: 100%; margin-top: 8px; border: 0; background: transparent; font-weight: 800; font-size: 14px; color: var(--navy); text-decoration: underline; padding: 6px; }
.tn2 { color: var(--navy) !important; }
/* model likes */
.likes { background: linear-gradient(160deg, #fff7df, var(--cream)); }
.lk-h { font-family: var(--fh); font-weight: 600; font-size: 19px; color: var(--navy); }
.likerow { width: 100%; display: grid; grid-template-columns: 20px 40px 1fr auto; gap: 10px; align-items: center; border: 0; border-top: 2px dashed var(--line);
      background: transparent; padding: 8px 2px; text-align: left; }
.likerow:first-of-type { border-top: 0; }
.lk-n { font-family: var(--fh); font-weight: 700; color: var(--muted); }
.likerow .av, .likerow .logo, .likerow .code { width: 40px; height: 40px; font-size: 13px; }
.lk-t { min-width: 0; display: flex; flex-direction: column; } .lk-t b { font-size: 15px; color: var(--navy); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lk-t span { font-size: 12.5px; font-weight: 700; color: var(--ink-2); }
.lk-p { text-align: right; display: flex; flex-direction: column; } .lk-p b { font-family: var(--fh); font-size: 20px; color: var(--navy); }
.lk-p span { font-size: 12px; font-weight: 800; color: var(--green); white-space: nowrap; }

// the model's in-game chance the home team wins (null before puck drop / after the final)
function livePh(g) { const st = (LIVE[g.game_id] || {}).state; if (st !== "in") return null; try { return mbLegProb({gid: g.game_id, key: {t: "game", m: "moneyline", s: "home"}}); } catch (e) { return null; } }
function mostLikely(g) {   // the single likeliest final score (regulation matrix, ties go to the OT favourite)
  let best = null; cells(g.reg, (h, a, p) => { if (!best || p > best.p) best = {h, a, p}; });
  if (!best) return "";
  let {h, a} = best; if (h === a) { if (g.p_ot_home >= 0.5) h++; else a++; }
  return h > a ? `${g.home.abbr} ${h}–${a}` : `${g.away.abbr} ${a}–${h}`;
}
function pGame(g) {
  const L = LIVE[g.game_id] || {}, st = L.state === "in" ? "live" : L.state === "post" ? "final" : "pre", ph = gameProb(g, "moneyline", "home");
  let tie = 0; cells(g.reg, (h, a, p) => { if (h === a) tie += p; });
  const sub = t => `<i class="dot ${gdot(t)}"></i>${esc(t.goalie ? t.goalie.split(" ").slice(-1)[0] : "Goalie TBD")}`;
  const v = {id: g.game_id, state: st, time: timeET(g.start_utc), detail: L.detail, ph, lph: livePh(g),
    a: Object.assign({}, g.away, {sub: sub(g.away)}), h: Object.assign({}, g.home, {sub: sub(g.home)}),
    sa: g.lam_away.toFixed(1), sh: g.lam_home.toFixed(1), total: g.lam_home + g.lam_away, totalTxt: `${(g.lam_home + g.lam_away).toFixed(1)} goals`,
    score: st === "pre" ? null : {a: L.away ?? 0, h: L.home ?? 0},
    stats: [["Total", `${(g.lam_home + g.lam_away).toFixed(1)} goals`], ["Likeliest", mostLikely(g)], ["Overtime", pct(tie)],
            ["2+ in 1st", g.p1 ? pct(gameProb(g, "p1_total", "over", 1.5)) : "–"]]};
  if (st === "final") v.hit = (L.home > L.away) === (ph >= 0.5);
  return v;
}
function pPlayer(p) {
  const g = D.games.find(x => x.game_id === p.game_id), t = g ? (g.home.abbr === p.team ? g.home : g.away) : {abbr: p.team, color: "#556"};
  const opp = g ? (g.home.abbr === p.team ? g.away : g.home) : null, s = playerStat(p), live = s && !s.dnp;
  const val = (mk, txt, chance, lab) => p.lam[mk] == null ? null : {v: mk === "goals" ? chance : p.lam[mk], txt, chance, chanceLab: lab, live: live ? s[mk] : null};
  return {id: p.id, gid: p.game_id, name: p.name, team: p.team, pos: p.pos, img: p.headshot, logo: t.logo, color: t.color,
    meta: `${p.team} · ${p.pos}${opp ? ` · ${g.home.abbr === p.team ? "vs" : "@"} ${opp.abbr}` : ""}${p.confirmed === false ? " · lineup TBD" : ""}`,
    vals: {goals: val("goals", pct(propProb(p, "goals", 0.5)), propProb(p, "goals", 0.5), "to score"),
           sog: val("sog", p.lam.sog != null ? p.lam.sog.toFixed(1) : "–", p.lam.sog != null ? propProb(p, "sog", 2.5) : null, "3+ shots"),
           points: val("points", p.lam.points != null ? p.lam.points.toFixed(2) : "–", p.lam.points != null ? propProb(p, "points", 0.5) : null, "1+ point"),
           assists: val("assists", p.lam.assists != null ? p.lam.assists.toFixed(2) : "–", p.lam.assists != null ? propProb(p, "assists", 0.5) : null, "1+ assist")}};
}
PJA = {
  sport: "NHL", sheetNote: "The model's projection for tonight: ice time, linemates, power-play role, shooting, the opponent and their goalie.", totalLabel: "Highest total", topLabel: "Likeliest goal scorers",
  markets: [{k: "goals", label: "Goals", unit: "to score", note: "Chance to score at least once tonight"},
            {k: "sog", label: "Shots", unit: "proj shots", note: "Projected shots on goal · bar = chance of 3+"},
            {k: "points", label: "Points", unit: "proj pts", note: "Projected points · bar = chance of 1+"},
            {k: "assists", label: "Assists", unit: "proj ast", note: "Projected assists · bar = chance of 1+"}],
  kicker: () => `${D === PREV ? "Last night" : D.meta.upcoming ? "Next up" : "Tonight"} · ${dayLab(D)}`,
  gamesLabel: "Tonight's games",
  header, strip,
  games: () => byStatus(D.games).map(pGame),
  players: () => { pjImgAlts(D.players); return D.players.map(pPlayer); },
  top: () => D.players.filter(p => p.lam.goals != null && notStarted(D.games.find(g => g.game_id === p.game_id) || {})).map(pPlayer)
    .sort((x, y) => y.vals.goals.v - x.vals.goals.v).slice(0, 8).map(p => ({p, mk: "goals"})),
  panels: gm => { const g = D.games.find(x => String(x.game_id) === String(gm.id));
    const top = mk => D.players.filter(p => p.game_id === g.game_id && p.lam[mk] != null).map(pPlayer).sort((x, y) => y.vals[mk].v - x.vals[mk].v).slice(0, 6);
    const inj = [g.away, g.home].flatMap(t => t.injuries.map(i => `<span class="xinj"><b>${esc(t.abbr)}</b>${esc(i.name)}<i class="${/out|ir/i.test(i.status) ? "o" : "q"}">${esc(i.status)}</i></span>`));
    return [{k: "matchup", label: "Matchup", html: () => matchupHtml(g)},
      {k: "players", label: "Players", html: () => `<div class="xmk-sec">Likeliest scorers</div><div class="pj-mini">${top("goals").map(p => pjPlayerRow(p, "goals")).join("")}</div>
        <div class="xmk-sec">Most shots</div><div class="pj-mini">${top("sog").map(p => pjPlayerRow(p, "sog")).join("")}</div>`},
      {k: "scores", label: "Scores", html: () => scoresHtml(g)},
      {k: "rink", label: "Rink", html: () => rinkHtml(g) + (inj.length ? `<div class="xinjs"><div class="xmk-sec">Injuries</div>${inj.join("")}</div>` : "")}]; },
  playerLines: id => { const p = D.players.find(x => String(x.id) === String(id)); if (!p) return [];
    const out = [];
    if (p.lam.goals != null) out.push(["Scores a goal", propProb(p, "goals", 0.5)], ["2+ goals", propProb(p, "goals", 1.5)]);
    if (p.lam.sog != null) for (const l of [1.5, 2.5, 3.5, 4.5]) out.push([`${l + 0.5}+ shots`, propProb(p, "sog", l)]);
    if (p.lam.points != null) out.push(["1+ point", propProb(p, "points", 0.5)], ["2+ points", propProb(p, "points", 1.5)]);
    if (p.lam.assists != null) out.push(["1+ assist", propProb(p, "assists", 0.5)]);
    return out; },
  record: () => { const fin = D.games.filter(g => (LIVE[g.game_id] || {}).state === "post"); if (!fin.length) return "";
    const w = fin.filter(g => { const L = LIVE[g.game_id]; return (L.home > L.away) === (gameProb(g, "moneyline", "home") >= 0.5); }).length;
    return `<button class="card pj-rec" data-go="model"><span class="pj-rr"><b>${w}/${fin.length}</b><i>favourites won</i></span><span><b>Model check</b><i>Calibration, accuracy and every update</i></span><span class="chev">›</span></button>`; },
  modelHtml: () => updates(),
  modelWire: render => {
    document.querySelectorAll("[data-info]").forEach(b => b.onclick = () => D && openInfo());
    document.querySelectorAll("[data-weights]").forEach(b => b.onclick = () => D && openWeights());
    document.querySelectorAll("[data-uf]").forEach(b => b.onclick = () => { UFILTER = b.dataset.uf; render(); });
    document.querySelectorAll("[data-hv]").forEach(b => b.onclick = () => { HV = b.dataset.hv; render(); });
    if (HV === "health") wireHealth(render); },
  after: render => {
    document.querySelectorAll("#view [data-rk]").forEach(el => el.onclick = e => { e.stopPropagation(); const [id, k, v] = el.dataset.rk.split("|"); RINK[id][k] = v; render(); });
  },
};
// likeliest final scores, as a small grid of the top outcomes
function scoresHtml(g) {
  const out = []; cells(g.reg, (h, a, p) => { if (h !== a) out.push({h, a, p}); else { out.push({h: h + 1, a, p: p * g.p_ot_home, ot: 1}, {h, a: a + 1, p: p * (1 - g.p_ot_home), ot: 1}); } });
  const by = {}; for (const o of out) { const k = `${o.h}-${o.a}`; by[k] = by[k] || {h: o.h, a: o.a, p: 0}; by[k].p += o.p; }
  const top = Object.values(by).sort((x, y) => y.p - x.p).slice(0, 8), mx = top[0] ? top[0].p : 1;
  return `<div class="xmk-sec">Likeliest final scores</div><div class="pj-scores">${top.map(o => `<div class="pj-sc"><b>${o.h > o.a ? esc(g.home.abbr) : esc(g.away.abbr)} ${Math.max(o.h, o.a)}–${Math.min(o.h, o.a)}</b>${pjMeter(o.p / mx)}<i>${(100 * o.p).toFixed(1)}%</i></div>`).join("")}</div>
    <div class="hint">Includes overtime and shootout wins (the final score counts the winning goal).</div>`;
}
function openInfo() {
  pjSheet(`<div class="sh-t">How it works</div>
    <div class="hint" style="font-size:14.5px">Blitzed projects every game from team strength (5-on-5 attack and defence, special teams, goaltending), tonight's goalies and lineups, rest and home ice.
    Each game is a full score distribution, so you get win chances, projected scores, totals and the likeliest results. Player projections come from ice time, linemates, power-play role, shooting and the opponent.
    Lineups and goalies refresh five times a day; the model re-fits every morning and checks its own calibration (Model tab).</div>`);
}
function render() { pjRender(); }
$("#scrim").onclick = closeSheet;

const darkLogo = u => !u ? u : u.replace("/500/", "/500-dark/").replace(/_light\.svg$/, "_dark.svg");
function darkLogos(d) { for (const g of (d && d.games) || []) for (const t of [g.home, g.away]) if (t) t.logo = darkLogo(t.logo); return d; }
document.addEventListener("error", e => { const el = e.target; if (!el || el.tagName !== "IMG") return;
  const s0 = el.getAttribute("src") || "", alt = s0.includes("/500-dark/") ? s0.replace("/500-dark/", "/500/") : /_dark\.svg$/.test(s0) ? s0.replace(/_dark\.svg$/, "_light.svg") : null;
