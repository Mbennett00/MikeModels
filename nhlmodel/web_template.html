<script>
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const pct = p => (p == null || isNaN(p)) ? "–" : Math.round(100 * p) + "%";
const am = x => (x == null || !isFinite(x)) ? "–" : (x > 0 ? "+" : "") + Math.round(x);
const fair = p => { p = Math.min(Math.max(p, 1e-9), 1 - 1e-9); return p >= 0.5 ? -100 * p / (1 - p) : 100 * (1 - p) / p; };
const UNIT = {sog: "shots", goals: "goals", assists: "assists", points: "points"};
const MNAME = {goals: "Anytime goal", sog: "Shots on goal", assists: "Assists", points: "Points", moneyline: "Moneyline",
               puckline: "Puck line", total: "Total goals", team_total: "Team total", p1_total: "1st period total", p1_3way: "1st period winner"};
let D = null, TODAY = null, PREV = null, TAB = "home";
let LIVE = {};   // game_id -> live/final info from ESPN (scores, clock, player box score)
const OPEN = new Set();   // game cards with "More" expanded
const PANEL = {};         // game_id -> which panel tab is showing
const RINK = {};          // game_id -> {side, line, m} for the rink view
// ---------- math (mirrors nhlmodel.team_model / player_model) ----------
function lgamma(x) {           // Lanczos
  const g = 7, c = [0.99999999999980993, 676.5203681218851, -1259.1392167224028, 771.32342877765313,
    -176.61503916999185, 12.507343278686905, -0.13857109526572012, 9.9843695780195716e-6, 1.5056327351493116e-7];
  if (x < 0.5) return Math.log(Math.PI / Math.sin(Math.PI * x)) - lgamma(1 - x);
  x -= 1; let a = c[0]; const t = x + g + 0.5;
  for (let i = 1; i < 9; i++) a += c[i] / (x + i);
  return 0.5 * Math.log(2 * Math.PI) + (x + 0.5) * Math.log(t) - t + Math.log(a);
}
function poisSF(line, lam) { const k = Math.floor(line); let p = Math.exp(-lam), s = 0;
  for (let i = 0; i <= k; i++) { s += p; p *= lam / (i + 1); } return Math.max(0, 1 - s); }
function nbSF(line, mu, r) { if (!r || r >= 1e5) return poisSF(line, mu);
  const k = Math.floor(line); let s = 0;
  for (let i = 0; i <= k; i++) s += Math.exp(lgamma(i + r) - lgamma(r) - lgamma(i + 1) + r * Math.log(r / (r + mu)) + i * Math.log(mu / (r + mu)));
  return Math.max(0, 1 - s); }
function propProb(pl, market, line) {
  const lam = pl.lam[market]; if (lam == null) return null; const P = D.params;
  if (market === "goals") return poisSF(line, lam);
  if (market === "sog") return nbSF(line, lam, (P.r_sog || {})[pl.pos] || 8);
  if (market === "assists") return nbSF(line, lam, P.r_ast);
  if (market === "points") return (line === 0.5 && P.r_pts >= 1e5) ? 1 - Math.exp(-lam) : nbSF(line, lam, P.r_pts);
}
function cells(m, f) { for (let h = 0; h < m.length; h++) for (let a = 0; a < m[h].length; a++) f(h, a, m[h][a]); }
function gameProb(g, market, sel, line) {
  const m = g.reg, pot = g.p_ot_home; let hw = 0, tie = 0, aw = 0;
  cells(m, (h, a, p) => { if (h > a) hw += p; else if (h === a) tie += p; else aw += p; });
  const ou = (dist, ln, side) => { let o = 0, u = 0, push = 0;
    dist.forEach((p, k) => { if (k > ln) o += p; else if (k < ln) u += p; else push += p; });
    const n = Number.isInteger(ln) ? 1 - push : 1; return (side === "over" ? o : u) / n; };
  if (market === "moneyline") { const ph = hw + tie * pot; return sel === "home" ? ph : 1 - ph; }
  if (market === "puckline") { const pw = sel === "home" ? pot : 1 - pot; let p = 0, t = 0;
    cells(m, (h, a, v) => { const mg = sel === "home" ? h - a : a - h; if (mg === 0) t += v; else if (mg + line > 0) p += v; });
    if (1 + line > 0) p += t * pw; if (-1 + line > 0) p += t * (1 - pw); return p; }
  if (market === "total") { const dist = []; cells(m, (h, a, p) => { const t = h + a + (h === a ? 1 : 0); dist[t] = (dist[t] || 0) + p; });
    return ou(dist.map(x => x || 0), line, sel); }
  if (market === "team_total") { const [side, dir] = sel.split("_"); const pw = side === "home" ? pot : 1 - pot; const dist = [];
    cells(m, (h, a, p) => { const own = side === "home" ? h : a;
      if (h !== a) dist[own] = (dist[own] || 0) + p; else { dist[own] = (dist[own] || 0) + p * (1 - pw); dist[own + 1] = (dist[own + 1] || 0) + p * pw; } });
    return ou(Array.from(dist, x => x || 0), line, dir); }
  if (market === "p1_total") { const dist = []; cells(g.p1, (h, a, p) => { dist[h + a] = (dist[h + a] || 0) + p; });
    return ou(Array.from(dist, x => x || 0), line, sel); }
  if (market === "p1_3way") { let x = {home: 0, draw: 0, away: 0};
    cells(g.p1, (h, a, p) => { x[h > a ? "home" : h === a ? "draw" : "away"] += p; }); return x[sel]; }
}
const thr = m => (D.params.thresholds || {})[m] ?? 0.03;

// ---------- live scores (ESPN allows browser requests; the NHL API does not) ----------
const ESPN = "https://site.api.espn.com/apis/site/v2/sports/hockey/nhl/";
const FROM_ESPN = {LA: "LAK", NJ: "NJD", SJ: "SJS", TB: "TBL", UTAH: "UTA", WAS: "WSH"};
const normName = n => String(n || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z]/g, "");
async function loadLive(data) {
  if (!data || !data.games.length || !data.meta.date) return;
  const r = await fetch(ESPN + "scoreboard?dates=" + data.meta.date.replace(/-/g, ""));
  const sb = await r.json();
  for (const ev of sb.events || []) {
    const c = (ev.competitions || [])[0]; if (!c) continue;
    const side = {};
    for (const t of c.competitors || []) side[t.homeAway] = t;
    if (!side.home || !side.away) continue;
    const ab = t => FROM_ESPN[t.team.abbreviation] || t.team.abbreviation;
    const g = data.games.find(x => x.home.abbr === ab(side.home) && x.away.abbr === ab(side.away));
    if (!g) continue;
    const st = ev.status || c.status || {}, ty = st.type || {};
    const p1 = t => (t.linescores && t.linescores.length) ? Number(t.linescores[0].value) : null;
    const prev = LIVE[g.game_id] || {};
    LIVE[g.game_id] = Object.assign(prev, {
      state: ty.state, detail: ty.shortDetail || ty.detail || "", period: st.period || 0, espn: ev.id,
      home: Number(side.home.score || 0), away: Number(side.away.score || 0), p1h: p1(side.home), p1a: p1(side.away)});
  }
  await Promise.all(data.games.map(async g => {
    const L = LIVE[g.game_id];
    if (!L || L.state === "pre" || (L.state === "post" && L.boxFinal)) return;
    try {
      const sm = await (await fetch(ESPN + "summary?event=" + L.espn)).json();
      const box = {};
      for (const team of (sm.boxscore || {}).players || []) {
        const abbr = FROM_ESPN[team.team.abbreviation] || team.team.abbreviation;
        for (const grp of team.statistics || []) {
          const k = grp.keys || [], ig = k.indexOf("goals"), ia = k.indexOf("assists"), is = k.indexOf("shotsTotal");
          if (ig < 0) continue;
          for (const a of grp.athletes || []) {
            const v = i => i < 0 ? 0 : Number(a.stats[i]) || 0;
            const s = {goals: v(ig), assists: v(ia), sog: v(is)}; s.points = s.goals + s.assists;
            const nm = a.athlete.displayName || "";
            box[abbr + "|" + normName(nm)] = s;
            box[abbr + "|last|" + normName(nm.split(" ").slice(-1)[0])] = box[abbr + "|last|" + normName(nm.split(" ").slice(-1)[0])] ? "dup" : s;
          }
        }
      }
      L.box = box; L.boxFinal = L.state === "post";
    } catch (e) { /* box score is optional */ }
  }));
}
function playerStat(p) {
  const L = LIVE[p.game_id]; if (!L || !L.box) return null;
  const s = L.box[p.team + "|" + normName(p.name)];
  if (s) return s;
  const t = L.box[p.team + "|last|" + normName(p.name.split(" ").slice(-1)[0])];
  return t && t !== "dup" ? t : (L.state === "post" ? {goals: 0, assists: 0, sog: 0, points: 0, dnp: true} : null);
}
// true = won, false = lost, "push", undefined = not decided yet
function cmpLine(x, line, dir, final) {
  if (x > line) return dir === "over";
  if (!final) return undefined;
  if (x < line) return dir === "under";
  return "push";
}
function settle(g, market, sel, line) {
  const L = LIVE[g.game_id]; if (!L || L.state === "pre" || L.state == null) return undefined;
  const fin = L.state === "post", h = L.home, a = L.away;
  if (market === "moneyline") return fin ? (sel === "home" ? h > a : a > h) : undefined;
  if (market === "puckline") { if (!fin) return undefined; const m = (sel === "home" ? h - a : a - h) + line; return m > 0 ? true : m < 0 ? false : "push"; }
  if (market === "total") return cmpLine(h + a, line, sel, fin);
  if (market === "team_total") { const [sd, dir] = sel.split("_"); return cmpLine(sd === "home" ? h : a, line, dir, fin); }
  const p1done = fin || L.period > 1;
  if (L.p1h == null || !p1done) return undefined;
  if (market === "p1_total") return cmpLine(L.p1h + L.p1a, line, sel, true);
  if (market === "p1_3way") { const r = L.p1h > L.p1a ? "home" : L.p1h < L.p1a ? "away" : "draw"; return r === sel; }
}
const RES = r => r === true ? ["won", "✅"] : r === false ? ["lost", "❌"] : r === "push" ? ["push", "➖"] : ["", ""];
let liveTimer = null;
async function refreshLive() {
  try { await loadLive(TODAY); if (PREV) await loadLive(PREV); } catch (e) { return; }
  header();
  const ae = document.activeElement;
  if (!(ae && (ae.tagName === "INPUT" || ae.tagName === "SELECT"))) render();
  const anyLive = [TODAY, PREV].filter(Boolean).some(d => d.games.some(g => (LIVE[g.game_id] || {}).state === "in"
      || ((LIVE[g.game_id] || {}).state !== "post" && new Date(g.start_utc) - Date.now() < 3 * 36e5)));
  clearTimeout(liveTimer);
  liveTimer = setTimeout(refreshLive, anyLive ? 30e3 : 5 * 60e3);   // real time around game time
}

// ---------- rendering ----------
function timeET(s) { if (!s) return ""; const d = new Date(s);
  return d.toLocaleTimeString("en-US", {hour: "numeric", minute: "2-digit", timeZone: "America/New_York"}); }
function logo(t) { return `<img class="logo" src="${esc(t.logo)}" alt="${esc(t.abbr)}" onerror="this.outerHTML='<div class=&quot;code&quot;>${esc(t.abbr)}</div>'">`; }
function initials(n) { const p = String(n).split(" ").filter((w, k) => w && (!k || !/^(jr|sr|ii|iii|iv|v)\.?$/i.test(w))); return p.length > 1 ? p[0][0] + p[p.length - 1][0] : String(n).slice(0, 3); }
function avatar(pl) { const c = (D.colors || {})[pl.team] || "#7a8894";
  return `<div class="av" style="background-color:${esc(c)}"><span>${esc(initials(pl.name))}</span>${pl.headshot ? `<img src="${esc(pl.headshot)}" alt="" loading="lazy" onload="this.previousElementSibling.style.visibility='hidden'" onerror="this.remove()">` : ""}</div>`; }
function lum(hex) { const c = (hex || "#888").replace("#", ""); const f = i => { const v = parseInt(c.substr(i, 2), 16) / 255;
  return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }; return 0.2126 * f(0) + 0.7152 * f(2) + 0.0722 * f(4); }
const inkOf = hex => lum(hex) > 0.3 ? ["#1f3448", ""] : ["#ffffff", "ink-light"];
const gdot = t => t.goalie_status === "Confirmed" ? "ok" : t.goalie_status === "Likely" ? "lk" : "un";
function gameLabel(g) { return `${g.away.name} @ ${g.home.name}`; }
function empty(e, t, s) { return `<div class="card empty"><div class="e">${e}</div><div class="t">${esc(t)}</div><div class="note">${esc(s)}</div></div>`; }
const dayLab = x => new Date(x.meta.date + "T12:00:00").toLocaleDateString("en-US", {weekday: "short", month: "short", day: "numeric"});

function header() {
  const m = D.meta;
  $("#title").textContent = !m.date ? "No games soon" : D === PREV ? "Last night" : (m.upcoming ? "Next up" : "Tonight");
  let sub = m.date ? dayLab(D) : "";
  if (m.generated_at && D === TODAY) sub += " · ↻ " + new Date(m.generated_at).toLocaleTimeString("en-US", {hour: "numeric", minute: "2-digit", timeZone: "America/New_York"});
  $("#sub").textContent = sub;
}
function strip() {
  // one scrollable row: day switch + game filter (props) + status
  let h = "";
  if (PREV && TODAY) h += `<button class="chip ${D === TODAY ? "on" : ""}" data-day="today">${TODAY.meta.upcoming ? "Next up" : "Tonight"}</button>`
    + `<button class="chip ${D === PREV ? "on" : ""}" data-day="prev">Last night</button>`;
  const st = D.games.map(g => (LIVE[g.game_id] || {}).state), nl = st.filter(x => x === "in").length, nf = st.filter(x => x === "post").length;
  if (nl) h += `<span class="chip live-c">🔴 ${nl} live</span>`;
  if (nf) h += `<span class="chip">🏁 ${nf} final</span>`;
  if (TAB === "model" || TAB === "players") h = "";
  $("#strip").innerHTML = h;
  $("#strip").style.display = h ? "" : "none";
  $("#strip").querySelectorAll("[data-day]").forEach(b => b.onclick = () => {
    D = b.dataset.day === "prev" ? PREV : TODAY; PJ.game = "all"; PJ.open.clear(); render(); window.scrollTo(0, 0); });
}
// every row reads "higher = better for that team", as % vs league average
const MX_ROWS = [["Attack", t => t.off - 1], ["Defence", t => 1 - t.dfn], ["Goalie", t => 1 - t.gk],
                 ["Special teams", t => ((t.pp * t.ppc - 1) + (1 - t.pk)) / 2]];
const MX_ICON = {Attack: "⚡", Defence: "🛡️", Goalie: "🥅", "Special teams": "🎯"};
const sgn = v => { const n = Math.round(100 * v); return n === 0 ? "0%" : (n > 0 ? "+" : "−") + Math.abs(n) + "%"; };
function matchupHtml(g) {
  const M = g.mx; if (!M) return "";
  const a = g.away, h = g.home, A = M.away, H = M.home, ph = gameProb(g, "moneyline", "home"), C = 2 * Math.PI * 42;
  const ring = `<div class="xring"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" class="xr-bg"/>
      <circle cx="50" cy="50" r="42" stroke="${esc(h.color)}" stroke-dasharray="${C * ph - 1.5} ${C}" transform="rotate(-90 50 50)"/>
      <circle cx="50" cy="50" r="42" stroke="${esc(a.color)}" stroke-dasharray="${C * (1 - ph) - 1.5} ${C}" transform="rotate(${-90 + 360 * ph} 50 50)"/></svg>
    <div class="xr-in"><b>${g.lam_away.toFixed(1)}<i>–</i>${g.lam_home.toFixed(1)}</b><span>proj score</span></div></div>`;
  const side = (t, p, al) => `<div class="xside ${al}">${logo(t)}<b>${pct(p)}</b><span>${esc(t.abbr)} win</span></div>`;
  const rows = MX_ROWS.map(([lab, fn]) => { const va = fn(A), vh = fn(H), W = 0.15;
    const w = v => Math.max(4, Math.min(Math.abs(v) / W, 1) * 100), better = va > vh + 0.005 ? "a" : vh > va + 0.005 ? "h" : "";
    return `<div class="xrow"><span class="xv ${va < 0 ? "neg" : ""} ${better === "a" ? "win" : ""}">${sgn(va)}</span>
      <div class="xmid"><span class="xlab">${lab}</span><div class="xbars"><div class="xb l"><i style="width:${w(va)}%;background:${va >= 0 ? esc(a.color) : "#ff6b6b"};opacity:${better === "h" ? .45 : 1}"></i></div>
        <div class="xb"><i style="width:${w(vh)}%;background:${vh >= 0 ? esc(h.color) : "#ff6b6b"};opacity:${better === "a" ? .45 : 1}"></i></div></div></div>
      <span class="xv r ${vh < 0 ? "neg" : ""} ${better === "h" ? "win" : ""}">${sgn(vh)}</span></div>`; }).join("");

  const miss = [[a, A], [h, H]].map(([t, X]) => { const m = (X.missing || []).filter(x => x[1] >= 0.01); if (!m.length) return "";
    return `<div class="xmiss"><span class="xmd"></span><b>${esc(t.abbr)}</b> without ${m.map(x => `${esc(x[0].split(" ").slice(-1)[0])} <i>${Math.round(100 * x[1])}% of scoring</i>`).join(", ")}</div>`; }).join("");
  return `<div class="xmx"><div class="xtop">${side(a, 1 - ph, "")}${ring}${side(h, ph, "r")}</div>
    <div class="xhd"><span>${esc(a.abbr)}</span><span>vs league average</span><span>${esc(h.abbr)}</span></div>${rows}
    ${edges.length || notes.length ? `<div class="xedges">${edges.length ? `<span class="xet">Edge</span>${edges.join("")}` : `<span class="xet">Even matchup</span>`}${notes.map(n => `<span class="xchip soft">${n}</span>`).join("")}</div>` : ""}
    ${miss}</div>`;

// ---------- rink view: one line at a time, each player coloured by tonight's projection vs his position ----------
function posAvg(mk) {   // slate average by position, the "0" on the colour scale
  const out = {};
  for (const pos of ["F", "D"]) { const v = D.players.filter(p => p.pos === pos && p.lam[mk] != null).map(p => p.lam[mk]);
    out[pos] = v.length ? v.reduce((a, b) => a + b, 0) / v.length : 0; }
  return out;
}
function heat(v, scale) {
  const x = Math.max(-1, Math.min(1, v / scale));
  if (Math.abs(x) < 0.12) return ["#8b95a5", "#fff"];
  return x > 0 ? (x > 0.5 ? ["#2fe06e", "#fff"] : ["#8af0b0", "#fff"]) : (x < -0.5 ? ["#ff4d4d", "#fff"] : ["#ff9a8f", "#fff"]);
}
function rinkHtml(g) {
  const R = RINK[g.game_id] || (RINK[g.game_id] = {side: "away", line: "1", m: "points"});
  const t = R.side === "away" ? g.away : g.home, opp = R.side === "away" ? g.home : g.away;
  const L = D.lines.filter(x => x.team === t.abbr), byId = Object.fromEntries(D.players.map(p => [p.id, p]));
  const mk = R.m, avg = posAvg(mk), scale = mk === "points" ? 0.3 : 1.2;
  let F, Dd;
  if (R.line === "PP") { const u = L.filter(x => x.pp === 1); F = u.filter(x => x.pos === "F"); Dd = u.filter(x => x.pos === "D"); }

  return `<div class="xmk-sec">Likeliest final scores</div><div class="pj-scores">${top.map(o => `<div class="pj-sc"><b>${o.h > o.a ? esc(g.home.abbr) : esc(g.away.abbr)} ${Math.max(o.h, o.a)}–${Math.min(o.h, o.a)}</b>${pjMeter(o.p / mx)}<i>${(100 * o.p).toFixed(1)}%</i></div>`).join("")}</div>
    <div class="hint">Includes overtime and shootout wins (the final score counts the winning goal).</div>`;
}
function openInfo() {
  pjSheet(`<div class="sh-t">How it works</div>
    <div class="hint" style="font-size:14.5px">The engine projects every game from team strength (5-on-5 attack and defence, special teams, goaltending), tonight's goalies and lineups, rest and home ice.
    Each game is a full score distribution, so you get win chances, projected scores, totals and the likeliest results. Player projections come from ice time, linemates, power-play role, shooting and the opponent.
    Lineups and goalies refresh five times a day; the model re-fits every morning and checks its own calibration (Model tab).</div>`);
}
function render() { pjRender(); }
$("#scrim").onclick = closeSheet;
$("#updBtn").onclick = () => { if (!D) return; pjGo(TAB === "model" ? "home" : "model"); };
$("#infoBtn").onclick = () => D && openInfo();
function openWeights() {
  $("#sheet").innerHTML = `<div class="grab"></div><button class="iconbtn close" id="shx" aria-label="Close">✕</button>
    <div class="sh-t">⚙️ How the model is weighted</div>${weightsHtml(((TODAY || D).calib || {}).weights)}`;
  $("#shx").onclick = closeSheet;
  $("#scrim").classList.add("open"); $("#sheet").classList.add("open"); $("#sheet").scrollTop = 0;
}
$("#gearBtn").onclick = () => D && openWeights();
// logos made for dark backgrounds (ESPN 500-dark, NHL _dark.svg); any that fail fall back to the normal file
const darkLogo = u => !u ? u : u.replace("/500/", "/500-dark/").replace(/_light\.svg$/, "_dark.svg");
function darkLogos(d) { for (const g of (d && d.games) || []) for (const t of [g.home, g.away]) if (t) t.logo = darkLogo(t.logo); return d; }
document.addEventListener("error", e => { const el = e.target; if (!el || el.tagName !== "IMG") return;
  const s0 = el.getAttribute("src") || "", alt = s0.includes("/500-dark/") ? s0.replace("/500-dark/", "/500/") : /_dark\.svg$/.test(s0) ? s0.replace(/_dark\.svg$/, "_light.svg") : null;
  if (alt) { e.stopImmediatePropagation(); e.stopPropagation(); el.src = alt; } }, true);
fetch("data.json?v=" + Date.now()).then(r => r.json()).then(async d => {
  D = TODAY = darkLogos(d); render();
  try { const p = await (await fetch("prev.json?v=" + Date.now())).json(); if (p.meta && p.meta.date !== d.meta.date && p.games.length) PREV = darkLogos(p); } catch (e) {}
  if (PREV) render();
  refreshLive();
}).catch(e => { $("#title").textContent = "Almost game time"; $("#sub").textContent = "Today's prices aren't published yet."; });
