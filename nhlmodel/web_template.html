<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#bfe0f2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MikeModels">
<title>MikeModels · NHL</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --ice: #bfe0f2; --ice-2: #d7ecf8; --cream: #fffaf0; --navy: #1f3448; --ink: #1f3448; --ink-2: #4d5d6c;
  --muted: #7a8894; --red: #d9443a; --red-soft: #fbe3df; --gold: #e2ae45; --gold-soft: #fbefd2;
  --green: #2e8b57; --green-soft: #def2e5; --line: #e7dfcf;
  --nav-h: 64px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body {
  font-family: 'Nunito', system-ui, sans-serif; color: var(--ink); min-height: 100vh;
  background:
    linear-gradient(90deg, transparent calc(50% - 2px), rgba(217,68,58,.10) calc(50% - 2px), rgba(217,68,58,.10) calc(50% + 2px), transparent calc(50% + 2px)),
    radial-gradient(120% 80% at 50% 0%, #d9eefa 0%, var(--ice) 60%, #a9d4ec 100%) fixed;
}
button { font: inherit; color: inherit; cursor: pointer; }
.wrap { max-width: 720px; margin: 0 auto; padding: calc(10px + env(safe-area-inset-top)) 12px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom)); }

/* header */
.hdr { display: flex; align-items: center; gap: 12px; margin: 4px 4px 12px; }
.hdr .mlogo { height: 56px; width: auto; flex: none; margin: -4px -2px -4px 0; filter: drop-shadow(1px 2px 0 rgba(0,0,0,.25)); }
.hdr .t { flex: 1; min-width: 0; }
.hdr h1 { font-family: 'Fredoka', sans-serif; font-size: 24px; margin: 0; line-height: 1.1; color: var(--navy); }
.hdr .sub { font-size: 13px; font-weight: 800; color: var(--ink-2); }
.iconbtn { width: 40px; height: 40px; border-radius: 50%; border: 2.5px solid var(--navy); background: var(--cream);
           box-shadow: 2px 3px 0 var(--navy); font-size: 18px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
.sport { display: flex; border: 2.5px solid var(--navy); border-radius: 999px; background: var(--cream); box-shadow: 2px 3px 0 var(--navy); overflow: hidden; }
.sport a { padding: 6px 10px; font-weight: 800; font-size: 13px; color: var(--navy); text-decoration: none; }
.sport a.on { background: var(--navy); color: var(--cream); }
.strip { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 0 0 12px; padding: 2px 4px 4px; }
.strip::-webkit-scrollbar { display: none; }
.chip { flex: 0 0 auto; border: 2.5px solid var(--navy); border-radius: 999px; background: var(--cream); padding: 6px 12px;
        font-weight: 800; font-size: 13.5px; white-space: nowrap; color: var(--navy); }
.chip.on { background: var(--navy); color: var(--cream); }
.chip.info { background: transparent; border-style: dashed; }
.chip.live-c { background: var(--red-soft); }

/* cards */
.card { background: var(--cream); border: 3px solid var(--navy); border-radius: 22px; padding: 14px; box-shadow: 4px 5px 0 var(--navy); margin: 0 4px 16px 0; }
.status { display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 800; color: var(--ink-2); margin-bottom: 8px; }
.live { display: inline-flex; align-items: center; gap: 5px; background: var(--red); color: #fff; font-weight: 800; font-size: 12px;
        border-radius: 999px; padding: 2px 9px; letter-spacing: .04em; }
.live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #fff; animation: blink 1.2s infinite; }
@keyframes blink { 50% { opacity: .2; } }
.final { background: var(--navy); color: var(--cream); font-weight: 800; font-size: 12px; border-radius: 999px; padding: 2px 9px; letter-spacing: .04em; }
.trow { display: grid; grid-template-columns: 40px 1fr auto; gap: 10px; align-items: center; padding: 5px 0; }
.logo { width: 40px; height: 40px; object-fit: contain; }
.code { width: 40px; height: 40px; border-radius: 12px; border: 2px solid var(--navy); background: var(--ice-2); display: flex;
        align-items: center; justify-content: center; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 12px; }
.tname { font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 18px; line-height: 1.1; }
.gk { font-size: 12.5px; font-weight: 700; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; vertical-align: 1px; }
.dot.ok { background: var(--green); } .dot.lk { background: var(--gold); } .dot.un { background: #b8c0c8; }
.right { text-align: right; }
.pct { font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 18px; }
.score { font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 28px; line-height: 1; }
.score.lose { color: var(--muted); }
.bar { display: flex; height: 8px; border-radius: 99px; overflow: hidden; border: 2px solid var(--navy); gap: 2px; background: var(--navy); margin: 8px 0 12px; }

/* price tiles */
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tile { border: 2.5px solid var(--navy); border-radius: 14px; background: #fff; padding: 8px 10px; text-align: left; display: flex;
        flex-direction: column; gap: 2px; min-height: 58px; box-shadow: 2px 2px 0 var(--navy); }
.tile:active { transform: translate(2px, 2px); box-shadow: none; }
.tile .l { font-size: 13px; font-weight: 800; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .v { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
.tile .c { font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 19px; color: var(--navy); }
.tile .b { font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 16px; color: var(--green); }
.tile .dk { font-size: 11.5px; font-weight: 800; color: var(--ink-2); } .tile .dk .pos { color: var(--green); } .tile .dk .neg { color: var(--red); }
.tile.val { border-color: var(--green); box-shadow: 2px 2px 0 var(--green); background: #f3fbf5; }
.tile.won { background: var(--green-soft); } .tile.lost { background: #e9edf1; } .tile.lost > * { opacity: .5; } .tile.push { background: #f1f1f1; }
.sec { font-size: 11.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 800; margin: 14px 2px 6px; }
.more { width: 100%; margin-top: 10px; border: 2.5px dashed var(--navy); background: transparent; border-radius: 14px; padding: 9px; font-weight: 800; font-size: 14px; color: var(--navy); }
.inj { font-size: 13px; color: var(--ink-2); font-weight: 700; line-height: 1.5; } .inj b { color: var(--red); }
.lines { display: grid; grid-template-columns: 1fr; gap: 12px; font-size: 13px; font-weight: 700; color: var(--ink-2); }
.lines .ln { margin: 3px 0; display: grid; grid-template-columns: 38px 1fr; } .lines .ln b { color: var(--navy); }
.lines .tn { font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 15px; color: var(--navy); margin-bottom: 4px; }

/* players */
.search { width: 100%; font: inherit; font-weight: 700; color: var(--navy); background: var(--cream); border: 2.5px solid var(--navy);
          border-radius: 999px; padding: 10px 16px; margin: 0 0 10px; }
.prow { padding: 10px 0; border-bottom: 2px dashed var(--line); }
.prow:last-child { border-bottom: 0; }
.phead { display: flex; align-items: center; gap: 10px; }
.av { position: relative; flex: 0 0 auto; width: 42px; height: 42px; border-radius: 50%; background-color: var(--ice-2);
      background-image: radial-gradient(circle at 35% 28%, rgba(255,255,255,.35), rgba(255,255,255,0) 60%);
      border: 2.5px solid var(--navy); display: flex; align-items: center; justify-content: center;
      font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 14px; color: #fff; overflow: hidden; }
.av img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.pname { font-weight: 800; font-size: 15.5px; line-height: 1.15; }
.pmeta { font-size: 12.5px; color: var(--ink-2); font-weight: 700; }
.stat { display: inline-block; margin-left: 4px; font-size: 11.5px; font-weight: 800; padding: 0 7px; border-radius: 999px; border: 2px solid var(--navy); background: #fff; }
.stat.in { background: var(--red-soft); } .stat.post { background: #eef1f4; }
.pchips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin-top: 8px; padding: 0 0 4px 52px; }
.pchips::-webkit-scrollbar { display: none; }
.lc { flex: 0 0 auto; border: 2px solid var(--navy); border-radius: 12px; padding: 4px 9px; background: #fff; font-size: 13px; font-weight: 700; text-align: left; box-shadow: 2px 2px 0 var(--navy); }
.lc b { font-family: 'Fredoka', sans-serif; } .lc .t { color: var(--green); font-weight: 800; }
.lc.won { background: var(--green-soft); } .lc.lost { opacity: .45; }

/* bottom nav */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; justify-content: center;
       padding: 8px 12px calc(8px + env(safe-area-inset-bottom)); background: linear-gradient(180deg, rgba(191,224,242,0), rgba(191,224,242,.95) 35%); }
.nav .in { display: flex; gap: 2px; background: var(--cream); border: 3px solid var(--navy); border-radius: 999px; padding: 5px; box-shadow: 3px 4px 0 var(--navy); width: 100%; max-width: 480px; }
.nav button { flex: 1; border: 0; background: transparent; border-radius: 999px; height: 44px; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 14px; color: var(--navy); padding: 0 2px; white-space: nowrap; }
.nav button.on { background: var(--navy); color: var(--cream); }

/* bottom sheet */
.scrim { position: fixed; inset: 0; background: rgba(31,52,72,.45); z-index: 30; opacity: 0; pointer-events: none; transition: opacity .2s; }
.scrim.open { opacity: 1; pointer-events: auto; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 31; max-width: 560px; margin: 0 auto; background: var(--cream);
         border: 3px solid var(--navy); border-bottom: 0; border-radius: 26px 26px 0 0; padding: 10px 18px calc(18px + env(safe-area-inset-bottom));
         transform: translateY(105%); transition: transform .25s ease; max-height: 88vh; overflow-y: auto; }
.sheet.open { transform: none; }
.grab { width: 44px; height: 5px; border-radius: 9px; background: #cfc6b4; margin: 2px auto 10px; }
.sh-t { font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 22px; color: var(--navy); line-height: 1.15; padding-right: 48px; }
.sh-s { font-size: 13.5px; font-weight: 700; color: var(--ink-2); margin-top: 2px; }
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0; }
.kpi { border: 2.5px solid var(--navy); border-radius: 14px; padding: 8px; text-align: center; background: #fff; }
.kpi .k { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 800; }
.kpi .n { font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 22px; color: var(--navy); }
.kpi.g .n { color: var(--green); }
.oddsrow { display: flex; gap: 8px; align-items: stretch; }
.sign { display: flex; border: 2.5px solid var(--navy); border-radius: 14px; overflow: hidden; }
.sign button { border: 0; width: 46px; font-size: 22px; font-weight: 800; background: #fff; }
.sign button.on { background: var(--navy); color: var(--cream); }
.odds { flex: 1; font: inherit; font-family: 'Fredoka', sans-serif; font-size: 24px; font-weight: 700; color: var(--navy); border: 2.5px solid var(--navy);
        border-radius: 14px; padding: 8px 12px; background: #fff; min-width: 0; }
.verdict { margin-top: 14px; border-radius: 16px; padding: 12px 14px; border: 2.5px solid var(--navy); }
.verdict .h { font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 24px; }
.verdict.good { background: var(--green-soft); } .verdict.good .h { color: var(--green); }
.verdict.meh { background: var(--gold-soft); } .verdict.meh .h { color: #9a6a12; }
.verdict.bad { background: var(--red-soft); } .verdict.bad .h { color: var(--red); }
.verdict .d { font-size: 14px; font-weight: 700; color: var(--ink-2); margin-top: 4px; }
.hint { font-size: 13px; font-weight: 700; color: var(--ink-2); margin-top: 10px; }
.close { position: absolute; right: 14px; top: 12px; }
.trust { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 2px dashed var(--line); font-weight: 800; }
.trust:last-child { border-bottom: 0; }

/* check (custom line) */
label.f { display: block; font-size: 13px; font-weight: 800; color: var(--ink-2); margin: 10px 0 4px 4px; }
.card input, .card select { font: inherit; font-weight: 700; color: var(--navy); background: var(--cream); border: 2.5px solid var(--navy);
                border-radius: 999px; padding: 9px 14px; min-height: 44px; width: 100%; appearance: none; -webkit-appearance: none; }
.card select { background-image: linear-gradient(45deg, transparent 50%, var(--navy) 50%), linear-gradient(135deg, var(--navy) 50%, transparent 50%);
         background-position: calc(100% - 20px) 50%, calc(100% - 14px) 50%; background-size: 6px 6px; background-repeat: no-repeat; padding-right: 34px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.seg { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.seg button { border: 2.5px solid var(--navy); border-radius: 999px; background: var(--cream); padding: 7px 14px; font-weight: 800; color: var(--navy); }
.seg button.on { background: var(--navy); color: var(--cream); }
.vline { font-size: 16px; font-weight: 700; color: var(--ink-2); margin: 5px 0; } .vline b { color: var(--navy); }
.vs .row { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 700; margin: 5px 0; }
.vs .lab { width: 52px; color: var(--ink-2); }
.vs .bar { flex: 1; height: 12px; border-radius: 99px; background: #efe7d6; border: 2px solid var(--navy); overflow: hidden; margin: 0; display: block; gap: 0; }
.vs .bar div { height: 100%; } .vs .num { width: 44px; text-align: right; }
.card .verdict { border: 0; padding: 0; margin: 0 0 6px; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 28px; }
.card .verdict.good { color: var(--green); background: none; } .card .verdict.meh { color: #9a6a12; background: none; } .card .verdict.bad { color: var(--red); background: none; }
.note { color: var(--ink-2); font-size: 14.5px; margin: 0 4px 12px; font-weight: 600; }
.empty { text-align: center; } .empty .e { font-size: 40px; } .empty .t { font-family: 'Fredoka', sans-serif; font-size: 20px; font-weight: 600; margin: 6px 0; }
.foot { text-align: center; color: #56708a; font-size: 12px; font-weight: 700; margin-top: 18px; }
/* team-colour game cards */
.card.gc { padding: 0; overflow: hidden; }
.gc .band { padding: 12px 14px 4px; }
.gc .status { color: inherit; opacity: .9; }
.gc .gk { color: inherit; opacity: .85; }
.gc .tname, .gc .pct, .gc .score { text-shadow: 0 1px 0 rgba(0,0,0,.12); }
.gc .ink-light .tname, .gc .ink-light .pct, .gc .ink-light .score { text-shadow: 0 1px 2px rgba(0,0,0,.35); }
.gc .score.lose { color: inherit; opacity: .5; }
.gc .code { color: var(--navy); text-shadow: none; }
.gc .logo { filter: drop-shadow(0 2px 2px rgba(0,0,0,.25)); }
.gc .final { background: rgba(255,255,255,.9); color: var(--navy); border: 2px solid var(--navy); }
.gc .live { border: 2px solid var(--navy); }
.gc .bar { margin: 6px 0 10px; }
.gc .body { padding: 0 14px 14px; }
.gc .more { background: var(--cream); border-style: solid; box-shadow: 2px 2px 0 var(--navy); }
.gc .panel { background: var(--cream); border: 2.5px solid var(--navy); border-radius: 16px; padding: 2px 12px 12px; margin-top: 10px; }
/* matchup breakdown */
.mx .r { display: grid; grid-template-columns: 128px 38px 1fr 38px; align-items: center; gap: 8px; margin: 9px 0; }
.mx .hd { margin: 0 0 4px; }
.mx .hd .v { font-family: 'Fredoka', sans-serif; font-size: 14px; }
.mx .vs { text-align: center; font-size: 11px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.mx .lab { font-size: 13.5px; font-weight: 800; color: var(--navy); white-space: nowrap; }
.mx .v { font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 14px; color: var(--navy); }
.mx .v.r2 { text-align: right; } .mx .v.neg { color: var(--red); }
.mx .tr { display: flex; height: 12px; background: #efe7d6; border: 2px solid var(--navy); border-radius: 99px; overflow: hidden; }
.mx .half { flex: 1; display: flex; } .mx .half.l { justify-content: flex-end; border-right: 2px solid var(--navy); }
.mx .half div { height: 100%; }
.lu { font-size: 13px; font-weight: 700; color: var(--ink-2); margin-top: 8px; padding: 6px 10px; border-radius: 12px; border: 2px solid var(--navy); }
.lu.dn { background: var(--red-soft); } .lu.up { background: var(--green-soft); } .lu b { color: var(--navy); }
.edges { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 12px; }
.edges .et { font-size: 11.5px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-right: 2px; }
.edge { font-size: 13px; font-weight: 800; border: 2px solid var(--navy); border-radius: 999px; padding: 2px 9px; background: #fff; }
.edge.soft { border-style: dashed; background: transparent; color: var(--ink-2); }
/* game panel tabs + compact player rows */
.ptabs { display: flex; gap: 4px; background: #efe7d6; border-radius: 999px; padding: 4px; margin: 10px 0 12px; }
.ptabs button { flex: 1; border: 0; background: transparent; border-radius: 999px; padding: 7px 0; font-weight: 800; font-size: 13.5px; color: var(--navy); }
.ptabs button.on { background: var(--navy); color: var(--cream); }
.mini { display: grid; grid-template-columns: 36px minmax(0, 1fr); column-gap: 10px; row-gap: 5px; align-items: center; padding: 8px 0; border-bottom: 2px dashed var(--line); }
.mini:last-of-type { border-bottom: 0; }
.mini .av { width: 36px; height: 36px; font-size: 12px; }
.mini .mc { grid-column: 2; display: flex; gap: 6px; } .mini .lc { padding: 3px 7px; font-size: 12px; }
.who { border: 0; background: transparent; padding: 0; text-align: left; min-width: 0; }
.mini .mn { grid-column: 2; } .mini > .who:first-child { grid-row: 1; }
.chev { color: var(--muted); font-weight: 800; }
.props-seg { margin-top: 0; background: var(--cream); border: 2.5px solid var(--navy); }
.phd { display: flex; gap: 12px; align-items: center; padding-right: 44px; }
.phd .av { width: 54px; height: 54px; font-size: 17px; }
.plh, .pl { display: grid; grid-template-columns: 1fr 64px 64px; align-items: center; gap: 6px; }
.plh { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 800; margin: 14px 0 2px; text-align: right; }
.psec { margin-top: 10px; }
.ph { display: flex; justify-content: space-between; align-items: baseline; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 16px; color: var(--navy); border-bottom: 2px solid var(--line); padding-bottom: 3px; }
.ph .pm { font-family: 'Nunito', sans-serif; font-size: 12.5px; font-weight: 800; color: var(--ink-2); }
.pl { width: 100%; border: 0; background: transparent; padding: 8px 2px; border-bottom: 2px dashed var(--line); font-weight: 800; font-size: 14.5px; text-align: left; }
.pl .c, .pl .b { text-align: right; font-family: 'Fredoka', sans-serif; font-weight: 700; } .pl .b { color: var(--green); }
.pl.won { background: var(--green-soft); } .pl.lost { opacity: .45; }
.link { width: 100%; margin-top: 8px; border: 0; background: transparent; font-weight: 800; font-size: 14px; color: var(--navy); text-decoration: underline; padding: 6px; }
.tn2 { color: var(--navy) !important; }
/* model likes */
.likes { background: linear-gradient(160deg, #fff7df, var(--cream)); }
.lk-h { font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 19px; color: var(--navy); }
.likerow { width: 100%; display: grid; grid-template-columns: 20px 40px 1fr auto; gap: 10px; align-items: center; border: 0; border-top: 2px dashed var(--line);
      background: transparent; padding: 8px 2px; text-align: left; }
.likerow:first-of-type { border-top: 0; }
.lk-n { font-family: 'Fredoka', sans-serif; font-weight: 700; color: var(--muted); }
.likerow .av, .likerow .logo, .likerow .code { width: 40px; height: 40px; font-size: 13px; }
.lk-t { min-width: 0; display: flex; flex-direction: column; } .lk-t b { font-size: 15px; color: var(--navy); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lk-t span { font-size: 12.5px; font-weight: 700; color: var(--ink-2); }
.lk-p { text-align: right; display: flex; flex-direction: column; } .lk-p b { font-family: 'Fredoka', sans-serif; font-size: 20px; color: var(--navy); }

// ---------- 🍀 FEELING LUCKY: parlay of the day + shot ladders ----------
// Parlay: only legs priced by the market with a positive model edge, in markets the model is trusted on, one per game.
const MAX_EDGE = 0.12;   // a bigger "edge" on a game line is almost always a bad market line, not value
const MNAME_L = {moneyline: "ML", puckline: "Puck line", total: "Total"};
const decOf = a => a > 0 ? 1 + a / 100 : 1 + 100 / -a;
const amOf = d => d >= 2 ? 100 * (d - 1) : -100 / (d - 1);
function trustOK(m) { const t = (D.trust || []).find(r => r.market === m); return !t || t.status === "OK"; }
function notStarted(g) { const L = LIVE[g.game_id]; return (!L || !L.state || L.state === "pre") && (!g.start_utc || new Date(g.start_utc) > Date.now() - 6e4); }
function legLabel(g, b) { return b.m === "total" ? `${b.s === "over" ? "Over" : "Under"} ${b.l}` : b.m === "moneyline" ? `${(b.s === "home" ? g.home : g.away).abbr} win`
  : `${(b.s === "home" ? g.home : g.away).abbr} ${b.l > 0 ? "+" : ""}${b.l}`; }
function parlayNHL() {
  const legs = [];
  for (const g of D.games) { if (!notStarted(g)) continue;
    const c = (g.dk || []).filter(b => b.edge != null && b.edge >= 0.015 && b.edge <= MAX_EDGE && b.price && trustOK(b.m) && (b.nv + b.edge) >= 0.45 && b.price <= 200)
      .sort((x, y) => y.edge - x.edge)[0];
    if (c) legs.push({g, b: c, p: c.nv + c.edge}); }

    <div id="vd">${isFinite(o) && Math.abs(o) >= 100 ? verdictHtml(b.p, b.market, o) : `<div class="hint">Type the price from ${BOOK()} to see if it's worth it. Anything at or better than the green “bet at” price is a bet.</div>`}</div>`;
  $("#shx").onclick = closeSheet;
  $("#sheet").querySelectorAll("[data-s]").forEach(x => x.onclick = () => { SH.sign = Number(x.dataset.s); drawSheet(); $("#odds").focus(); });
  $("#odds").oninput = e => { SH.num = e.target.value.replace(/[^0-9]/g, ""); const o2 = SH.sign * Number(SH.num);
    $("#vd").innerHTML = SH.num && Math.abs(o2) >= 100 ? verdictHtml(b.p, b.market, o2) : `<div class="hint">Keep typing… (American odds, e.g. 115)</div>`; };
}
function openInfo() {
  const rows = (D.trust || []).map(r => { const s = r.status; const [i, l] = s === "OK" ? ["✅", "Trust it"] : s.startsWith("DOWN") ? ["⚠️", "Bet smaller"] : ["⛔", "Skip it"];
    return `<div class="trust"><span>${esc(MNAME[r.market] || r.market)}</span><span>${i} ${l}</span></div>`; }).join("");
  $("#sheet").innerHTML = `<div class="grab"></div><button class="iconbtn close" id="shx" aria-label="Close">✕</button>
    <div class="sh-t">How it works</div>
    <div class="hint" style="font-size:14.5px">Every price shows the model's <b>chance</b> and a green <b>bet at</b> price: the worst ${BOOK()} odds that still leave an edge. Tap a price, type ${BOOKS()} odds, and you'll get a verdict. Lineups and goalies come from Daily Faceoff (🟢 confirmed, 🟡 likely); scores from ESPN.</div>
    ${rows ? `<div class="sec">How much to trust each market</div>${rows}` : ""}`;
  $("#shx").onclick = closeSheet;
  $("#scrim").classList.add("open"); $("#sheet").classList.add("open");
}

function render() {
  BETS = [];
  header(); strip(); nav();
  const v = {games, props, check, updates}[TAB]();
  $("#view").innerHTML = v;
  if (TAB === "props") { wireProps(); wireMix(render, m => { PMODE = m; }); }
  if (TAB === "check") wireCheck();
  document.querySelectorAll("[data-like]").forEach(b => b.onclick = () => { LIKE = b.dataset.like; render(); });
  document.querySelectorAll("[data-uf]").forEach(b => b.onclick = () => { UFILTER = b.dataset.uf; render(); });
  document.querySelectorAll("[data-hv]").forEach(b => b.onclick = () => { HV = b.dataset.hv; render(); });
  if (TAB === "updates" && HV === "health") wireHealth(render);
  $("#view").querySelectorAll("[data-bet]").forEach(el => el.onclick = e => { e.stopPropagation(); openSheet(BETS[Number(el.dataset.bet)]); });
  $("#view").querySelectorAll("[data-player]").forEach(el => el.onclick = () => openPlayer(el.dataset.player));
  $("#view").querySelectorAll("[data-rk]").forEach(el => el.onclick = e => { e.stopPropagation(); const [id, k, v] = el.dataset.rk.split("|"); RINK[id][k] = v; render(); });
  $("#view").querySelectorAll("[data-pv]").forEach(el => el.onclick = () => { const [id, k] = el.dataset.pv.split("|"); PANEL[id] = k; render(); });
  $("#view").querySelectorAll("[data-golucky]").forEach(el => el.onclick = () => { PSTATE.market = "lucky"; TAB = "props"; render(); window.scrollTo(0, 0); });
  $("#view").querySelectorAll("[data-allprops]").forEach(el => el.onclick = () => { PSTATE.game = el.dataset.allprops; PSTATE.q = ""; TAB = "props"; render(); window.scrollTo(0, 0); });
  $("#view").querySelectorAll("[data-more]").forEach(el => el.onclick = () => {
    const id = Number(el.dataset.more); OPEN.has(id) ? OPEN.delete(id) : OPEN.add(id); render(); });
}
$("#scrim").onclick = closeSheet;
$("#infoBtn").onclick = () => D && openInfo();
function openWeights() {
  $("#sheet").innerHTML = `<div class="grab"></div><button class="iconbtn close" id="shx" aria-label="Close">✕</button>
    <div class="sh-t">⚙️ How the model is weighted</div>${weightsHtml(((TODAY || D).calib || {}).weights)}`;
  $("#shx").onclick = closeSheet;
  $("#scrim").classList.add("open"); $("#sheet").classList.add("open"); $("#sheet").scrollTop = 0;
}
$("#gearBtn").onclick = () => D && openWeights();
fetch("data.json?v=" + Date.now()).then(r => r.json()).then(async d => {
  D = TODAY = d; render();
  try { const p = await (await fetch("prev.json?v=" + Date.now())).json(); if (p.meta && p.meta.date !== d.meta.date && p.games.length) PREV = p; } catch (e) {}
  if (PREV) render();
  refreshLive();
}).catch(e => { $("#title").textContent = "Almost game time"; $("#sub").textContent = "Today's prices aren't published yet."; });
</script>
</body>
</html>
