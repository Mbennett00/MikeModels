name: daily model run

# Times are UTC. During daylight time ET = UTC-4 (subtract one more hour in winter).
on:
  schedule:
    - cron: "5 10 * * *"        # ~6am ET: fetch last night's games, grade logged plays, refresh backtest
    - cron: "5 15 * * *"        # ~11am ET: price today's slate (morning lines)
    - cron: "35 21 * * *"       # ~5:30pm ET: re-price with later lines / goalie news
    - cron: "15 16-23 * * *"    # hourly: closing odds for games starting within 75 minutes
    - cron: "15 0-3 * * *"
  push:
    paths: ["overrides/**"]     # committing a lineup/goalie override re-prices the slate
  workflow_dispatch:
    inputs:
      task:
        description: "What to run"
        type: choice
        default: slate
        options: [slate, morning, update, grade, backtest, close, tune]

permissions:
  contents: write

concurrency:
  group: model-state
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      GH_TOKEN: ${{ github.token }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      # credit budget (override in Settings -> Secrets and variables -> Actions -> Variables)
      ODDS_BOOKMAKERS: ${{ vars.ODDS_BOOKMAKERS || 'draftkings' }}
      ODDS_PROP_MARKETS: ${{ vars.ODDS_PROP_MARKETS || 'player_shots_on_goal' }}
      ODDS_EXTRA_MARKETS: ${{ vars.ODDS_EXTRA_MARKETS || '' }}
      ODDS_CLOSE_MARKETS: ${{ vars.ODDS_CLOSE_MARKETS || 'h2h,totals' }}
      ODDS_MIN_CREDITS: ${{ vars.ODDS_MIN_CREDITS || '20' }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "numpy>=1.26" "pandas>=2.1" "scipy>=1.11" "requests>=2.31"
      - name: Pick task
        id: pick
        run: |
          # odds credits: only the 5:30pm run pulls new odds; other runs reuse today's stored prices
          odds=auto
          case "${{ github.event_name }}|${{ github.event.schedule }}" in
            "schedule|5 10 * * *") t=morning; odds=reuse ;;
            "schedule|5 15 * * *") t=slate; odds=reuse ;;
            "schedule|35 21 * * *") t=slate; odds=fetch ;;
            schedule*) t=close ;;
            push*) t=slate ;;
            *) t="${{ inputs.task }}" ;;
          esac
          echo "task=$t" >> "$GITHUB_OUTPUT"
          echo "odds=$odds" >> "$GITHUB_OUTPUT"
          echo "Task: $t (odds: $odds)"
      - name: Download state
        id: pull
        run: scripts/state.sh pull
      - name: Morning (update data, grade, backtest)
        if: steps.pick.outputs.task == 'morning'
        run: |
          python -m nhlmodel.daily update
          python -m nhlmodel.daily grade
          python -m nhlmodel.daily backtest
          python -m nhlmodel.daily slate --odds ${{ steps.pick.outputs.odds }}
      - name: Run ${{ steps.pick.outputs.task }}
        if: steps.pick.outputs.task != 'morning'
        run: |
          if [ "${{ steps.pick.outputs.task }}" = "slate" ]; then
            python -m nhlmodel.daily slate --odds ${{ steps.pick.outputs.odds }}
          else
            python -m nhlmodel.daily ${{ steps.pick.outputs.task }}
          fi
      - name: Upload state
        # also after a failure, so checkpointed games from a long first load are kept
        if: always() && steps.pull.outcome == 'success'
        run: scripts/state.sh push
