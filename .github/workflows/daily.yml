name: daily model run

# Times are UTC. During daylight time ET = UTC-4 (subtract one more hour in winter).
on:
  schedule:
    - cron: "5 10 * * *"        # ~6am ET: fetch last night's games, grade logged plays, refresh backtest
    - cron: "5 15 * * *"        # ~11am ET: price today's slate (morning lines)
    - cron: "5 17 * * *"        # ~1pm ET: after morning skates (Daily Faceoff goalie confirmations)
    - cron: "35 19 * * *"       # ~3:30pm ET
    - cron: "35 21 * * *"       # ~5:30pm ET: re-price with later lines / goalie news
    - cron: "40 22 * * *"       # ~6:40pm ET: last check before 7pm puck drops
  push:
    paths: ["overrides/**"]     # committing a lineup/goalie override re-prices the slate
  workflow_dispatch:
    inputs:
      task:
        description: "What to run"
        type: choice
        default: slate
        options: [slate, morning, update, grade, backtest, close, tune, dfo-probe, xg-compare]

permissions:
  contents: write

concurrency:
  group: model-state
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    outputs:
      web: ${{ steps.web.outputs.web }}
    env:
      GH_TOKEN: ${{ github.token }}
      # DraftKings game lines from the-odds-api.com, pulled at the ~11am and ~6:40pm ET runs only
      # (3 credits each); other runs reuse the latest prices. "0" = no feed, "1" = full feed incl. props.
      ODDS_ENABLED: "lean"   # DraftKings game lines, 2 pulls a day (~180 credits / month)
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "numpy>=1.26" "pandas>=2.1" "scipy>=1.11" "requests>=2.31"
      - name: Pick task
        id: pick
        run: |
          case "${{ github.event_name }}|${{ github.event.schedule }}" in
            "schedule|5 10 * * *") t=morning ;;
            schedule*) t=slate ;;
            push*) t=slate ;;
            *) t="${{ inputs.task }}" ;;
          esac
          echo "task=$t" >> "$GITHUB_OUTPUT"
          case "${{ github.event.schedule }}" in
            "5 15 * * *") echo "ODDS_PULL=1" >> "$GITHUB_ENV" ;;
            "40 22 * * *") echo "ODDS_PULL=1" >> "$GITHUB_ENV"; echo "ODDS_CLOSE=1" >> "$GITHUB_ENV" ;;
          esac
          echo "Task: $t"
      - name: Download state
        id: pull
        run: scripts/state.sh pull
      - name: Morning (update data, grade, backtest)
        if: steps.pick.outputs.task == 'morning'
        run: |
          python -m nhlmodel.daily update
          python -m nhlmodel.daily grade
          python -m nhlmodel.daily backtest
          python -m nhlmodel.daily slate
      - name: Run ${{ steps.pick.outputs.task }}
        if: steps.pick.outputs.task != 'morning'
        run: python -m nhlmodel.daily ${{ steps.pick.outputs.task }}
      - name: Upload state
        # also after a failure, so checkpointed games from a long first load are kept
        if: always() && steps.pull.outcome == 'success'
        run: scripts/state.sh push
      - name: Check for web page
        id: web
        if: always()
        run: |
          if [ -f state/site/web/index.html ]; then echo "web=true" >> "$GITHUB_OUTPUT"; fi
      - name: Package web page
        if: always() && steps.web.outputs.web == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: state/site/web

  # Publishes the price sheet to GitHub Pages (https://<owner>.github.io/<repo>/).
  # One-time setup: repo Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
  pages:
    needs: run
    if: always() && needs.run.outputs.web == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
