name: daily model run

# Times are UTC. During daylight time ET = UTC-4 (subtract one more hour in winter).
on:
  schedule:
    - cron: "5 10 * * *"        # ~6am ET: fetch last night's games, grade logged plays, refresh backtest
    - cron: "5 15 * * *"        # ~11am ET: price today's slate (morning lines)
    - cron: "5 17 * * *"        # ~1pm ET: after morning skates (Daily Faceoff goalie confirmations)
    - cron: "35 19 * * *"       # ~3:30pm ET
    - cron: "35 21 * * *"       # ~5:30pm ET: re-price with later lines / goalie news
    - cron: "40 22 * * *"       # ~6:40pm ET: last check before 7pm puck drops
  push:
    paths: ["overrides/**"]     # committing a lineup/goalie override re-prices the slate
  workflow_dispatch:
    inputs:
      task:
        description: "What to run"
        type: choice
        default: slate
        options: [slate, morning, update, grade, backtest, tune, dfo-probe, xg-compare, recalibrate, sharp-probe]
  workflow_call:                # used by recalibrate.yml (the page's RECALIBRATE MODEL button)
    inputs:
      task:
        type: string
        default: recalibrate

permissions:
  contents: write

concurrency:
  group: model-state
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    outputs:
      web: ${{ steps.web.outputs.web }}
    env:
      GH_TOKEN: ${{ github.token }}
      # Pikt's market odds come from calib/odds.py: DraftKings + FanDuel game lines and props from SharpAPI's free tier.
      # ESPN is used for injuries and scores only.
      SHARP_API_KEY: ${{ secrets.SHARP_API_KEY }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "numpy>=1.26" "pandas>=2.1" "scipy>=1.11" "requests>=2.31" "pyarrow>=14"
      - name: Pick task
        id: pick
        run: |
          case "${{ github.event_name }}|${{ github.event.schedule }}" in
            "schedule|5 10 * * *") t=morning ;;
            schedule*) t=slate ;;
            push*) t=slate ;;
            *) t="${{ inputs.task }}" ;;
          esac
          echo "task=$t" >> "$GITHUB_OUTPUT"
          echo "Task: $t"
      - name: Download state
        id: pull
        run: scripts/state.sh pull
      - name: Morning (update data, grade, backtest)
        if: steps.pick.outputs.task == 'morning'
        run: |
          python -m nhlmodel.daily update
          python -m nhlmodel.daily grade
          python -m nhlmodel.daily backtest
          # weekly self-calibration (Mondays): applies a new version only if it beats the current one walk-forward
          if [ "$(TZ=America/New_York date +%u)" = "1" ]; then python -m calib recalibrate --sport all || true; fi
          python -m nhlmodel.daily slate
      - name: SharpAPI probe
        if: steps.pick.outputs.task == 'sharp-probe'
        run: |
          python scripts/sharp_probe.py
          mv -f sharp_probe.txt state/site/       # the state upload at the end publishes it (and would overwrite a direct upload)
      - name: Run ${{ steps.pick.outputs.task }}
        if: steps.pick.outputs.task != 'morning' && steps.pick.outputs.task != 'recalibrate' && steps.pick.outputs.task != 'sharp-probe'
        run: python -m nhlmodel.daily ${{ steps.pick.outputs.task }}
      - name: Recalibrate and republish
        if: steps.pick.outputs.task == 'recalibrate'
        run: |
          python -m nhlmodel.daily grade || true
          python -m calib recalibrate --sport all
          python -m nhlmodel.daily slate
      - name: NFL (nflverse refresh, ratings, this week's projections)
        # every run: cheap (current-season play-by-play only), and an NFL failure never blocks the other pages
        if: always() && steps.pull.outcome == 'success'
        continue-on-error: true
        run: python -m nflmodel.daily
      - name: NBA (ESPN scores and box scores, team ratings, tonight's projections)
        if: always() && steps.pull.outcome == 'success'
        continue-on-error: true
        run: |
          python -m nbamodel.daily 2>&1 | tee nba.log
          echo "::notice title=NBA run::$(grep '^nba:' nba.log | tail -n 4 | tr '\n' ' ')"
      - name: Odds (DraftKings + FanDuel lines and props from SharpAPI)
        if: always() && steps.pull.outcome == 'success'
        continue-on-error: true
        run: |
          python -m calib.odds 2>&1 | tee odds.log
          grep '^odds:' odds.log | while read -r l; do echo "::notice title=Odds::$l"; done
      - name: Sim data (league, team and player profiles for the NFL, NHL and NBA game simulators)
        if: always() && steps.pull.outcome == 'success'
        continue-on-error: true
        run: |
          python -m nflmodel.simdata 2>&1 | tee sim.log || true
          python -m nhlmodel.simdata 2>&1 | tee -a sim.log || true
          python -m nbamodel.simdata 2>&1 | tee -a sim.log || true
          if [ -d state/site/web ]; then cp -f state/site/nfl_sim.json state/site/nhl_sim.json state/site/nba_sim.json state/site/web/ 2>/dev/null || true; fi
          grep -E '^(nfl|nhl|nba) sim:' sim.log | while read -r l; do echo "::notice title=Sim data::$l"; done
      - name: Upload state
        # also after a failure, so checkpointed games from a long first load are kept
        if: always() && steps.pull.outcome == 'success'
        run: scripts/state.sh push
      - name: Check for web page
        id: web
        if: always()
        run: |
          if [ -f state/site/web/index.html ]; then echo "web=true" >> "$GITHUB_OUTPUT"; fi
      - name: Package web page
        if: always() && steps.web.outputs.web == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: state/site/web

  # Publishes the price sheet to GitHub Pages (https://<owner>.github.io/<repo>/).
  # One-time setup: repo Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
  pages:
    needs: run
    if: always() && needs.run.outputs.web == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
