name: dfo probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "pandas>=2.1" "requests>=2.31" "numpy>=1.26" "scipy>=1.11"
      - run: python scripts/dfo_probe.py
      - name: Score feeds (CORS + sample)
        run: |
          O="Origin: https://mbennett00.github.io"
          for u in "https://api-web.nhle.com/v1/score/2026-09-30" \
                   "https://site.api.espn.com/apis/site/v2/sports/hockey/nhl/scoreboard?dates=20260930"; do
            echo "=== $u"; curl -sS -D - -o /tmp/r.json -H "$O" "$u" | grep -iE "^HTTP|access-control"
            python -c "import json;d=json.load(open('/tmp/r.json'));print(json.dumps(d)[:2500])"
          done
          ev=$(python -c "import json;d=json.load(open('/tmp/r.json'));print(d['events'][0]['id'])")
          u="https://site.api.espn.com/apis/site/v2/sports/hockey/nhl/summary?event=$ev"
          echo "=== $u"; curl -sS -D - -o /tmp/s.json -H "$O" "$u" | grep -iE "^HTTP|access-control"
          python - <<'PY'
          import json; d=json.load(open('/tmp/s.json'))
          print(list(d)); b=d.get('boxscore',{})
          for t in b.get('players',[])[:1]:
              print(t['team'].get('abbreviation'))
              for g in t['statistics']:
                  print(g.get('name'), g.get('labels'), g.get('keys'))
                  for a in g['athletes'][:2]: print(a['athlete'].get('displayName'), a['athlete'].get('id'), a['stats'])
          print(json.dumps(d.get('header',{}))[:1200])
          PY
