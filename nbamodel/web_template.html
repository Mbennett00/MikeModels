<script>
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const pct = p => (p == null || isNaN(p)) ? "–" : Math.round(100 * p) + "%";
let D = null, TAB = "home", LIVE = {};
const phi = x => { const t = 1 / (1 + 0.2316419 * Math.abs(x)), d = 0.3989423 * Math.exp(-x * x / 2), p = d * t * (0.3193815 + t * (-0.3565638 + t * (1.781478 + t * (-1.821256 + t * 1.330274)))); return x > 0 ? 1 - p : p; };
// ---------- chances (mirror nbamodel.model) ----------
const pOver = (mean, sd, L) => 1 - phi((L - mean) / Math.max(sd, 1e-6));
function pThrees(mean, L) { const k = Math.floor(L), lam = Math.max(mean, 1e-6); let cdf = 0, pm = Math.exp(-lam); for (let i = 0; i <= k; i++) { cdf += pm; pm *= lam / (i + 1); } return 1 - cdf; }
function pStat(p, k, L) { return k === "fg3" ? pThrees(p.fg3, L) : k === "pra" ? pOver(p.pts + p.reb + p.ast, Math.hypot(p.sd.pts, p.sd.reb, p.sd.ast), L) : pOver(p[k], p.sd[k], L); }

// ---------- live scores + box scores (ESPN, in the browser) ----------
const ESPN = "https://site.api.espn.com/apis/site/v2/sports/basketball/nba/";
async function loadLive() {
  try {
    const r = await (await fetch(ESPN + "scoreboard?dates=" + String(D.meta.date).replace(/-/g, ""))).json();
    for (const ev of r.events || []) {
      const g = D.games.find(x => String(x.game_id) === String(ev.id)); if (!g) continue;
      const c = ev.competitions[0], tm = {}; c.competitors.forEach(x => tm[x.homeAway] = Number(x.score));
      LIVE[g.game_id] = {state: ev.status.type.state, detail: ev.status.type.shortDetail, home: tm.home, away: tm.away,
        period: ev.status.period, clock: ev.status.displayClock};
    }
  } catch (e) {}
}
const NBOX = {};
async function loadBoxes() {
  await Promise.all(D.games.filter(g => { const L = LIVE[g.game_id]; return L && L.state !== "pre" && !(NBOX[g.game_id] && NBOX[g.game_id].final); }).map(async g => {
    try {
      const sm = await (await fetch(ESPN + "summary?event=" + g.game_id)).json(), box = {};
      for (const team of (sm.boxscore || {}).players || []) for (const grp of team.statistics || []) {
        const lab = (grp.labels || []).map(x => String(x).toUpperCase()), at = k => lab.indexOf(k);
        for (const a of grp.athletes || []) { const v = a.stats || []; if (!v.length) continue; const n = i => i < 0 ? 0 : Number(String(v[i]).split("-")[0]) || 0;
          box[String((a.athlete || {}).id)] = {pts: n(at("PTS")), reb: n(at("REB")), ast: n(at("AST")), fg3: n(at("3PT")), min: n(at("MIN"))}; }
      }
      NBOX[g.game_id] = {box, final: (LIVE[g.game_id] || {}).state === "post"};
    } catch (e) {}
  }));
}
function scoreOf(g) { const L = LIVE[g.game_id]; if (L && (L.state === "in" || L.state === "post")) return L;
  if (g.result) return {state: "post", detail: "Final", home: g.result.home, away: g.result.away}; return null; }
// live win chance: the model's margin shrinks with time left, plus the current lead
function liveP(g) { const s = scoreOf(g); if (!s || s.state !== "in") return null;
  const per = Math.max(1, Number((LIVE[g.game_id] || {}).period) || 1), clock = String((LIVE[g.game_id] || {}).clock || "12:00").split(":"), left = Math.max(0, (4 - per) * 12 + Number(clock[0] || 0) + Number(clock[1] || 0) / 60);
  const f = Math.min(1, left / 48), m = (s.home - s.away) + g.margin * f, sd = Math.max(1.5, g.sd_margin * Math.sqrt(f)); return phi(m / sd); }

// ---------- helpers ----------
const tipLab = s => new Date(s).toLocaleString("en-US", {weekday: "short", hour: "numeric", minute: "2-digit", timeZone: "America/New_York"});
const teamOf = abbr => { for (const g of D.games) { if (g.home.abbr === abbr) return g.home; if (g.away.abbr === abbr) return g.away; } return {abbr, name: abbr, color: "#556070", logo: ""}; };
const gameOf = p => D.games.find(x => String(x.game_id) === String(p.game_id));
const sgn = x => (x > 0 ? "+" : x < 0 ? "−" : "") + Math.abs(x).toFixed(1);
function modelLine(g) { const m = g.margin; if (Math.abs(m) < 0.25) return "Pick'em"; return `${m > 0 ? g.home.abbr : g.away.abbr} −${(Math.round(2 * Math.abs(m)) / 2).toFixed(1)}`; }
const closeGame = g => phi((5.5 - Math.abs(g.margin)) / g.sd_margin) - phi((-5.5 - Math.abs(g.margin)) / g.sd_margin);
const ST = s => { s = String(s || ""); return /^out/i.test(s) ? "Out" : /^doubt/i.test(s) ? "Doubtful" : /^quest/i.test(s) ? "Q" : /day/i.test(s) ? "GTD" : s; };
function header() {
  const m = D.meta, d = new Date(String(m.date) + "T12:00:00");
  $("#title").textContent = m.upcoming ? d.toLocaleDateString("en-US", {weekday: "long", month: "short", day: "numeric"}) : "Tonight";
  let sub = "NBA"; if (m.generated_at) sub += " · ↻ " + new Date(m.generated_at).toLocaleString("en-US", {hour: "numeric", minute: "2-digit", timeZone: "America/New_York"});
  $("#sub").textContent = sub;
}
function strip() {
  let h = ""; const st = D.games.map(g => (scoreOf(g) || {}).state), nl = st.filter(x => x === "in").length, nf = st.filter(x => x === "post").length;
  if (TAB === "games") { if (nl) h += `<span class="chip" style="background:var(--red-soft)">🔴 ${nl} live</span>`; if (nf) h += `<span class="chip">🏁 ${nf} final</span>`; }
  if (D.meta.upcoming && TAB === "home") h += `<span class="chip">📅 Next games: ${esc(new Date(String(D.meta.date) + "T12:00:00").toLocaleDateString("en-US", {weekday: "short", month: "short", day: "numeric"}))}</span>`;
  if (D.meta.preseason && (TAB === "home" || TAB === "games")) h += `<span class="chip">🏀 Preseason</span>`;
  $("#strip").innerHTML = h; $("#strip").style.display = h ? "" : "none";
}
// ---------- adapter pieces ----------
function nGame(g) {
  const s = scoreOf(g), st = !s ? "pre" : s.state === "in" ? "live" : "final";
  const sub = t => t.b2b ? "2nd night of a back-to-back" : esc(t.city || "");
  const v = {id: g.game_id, state: st, time: tipLab(g.start_utc), detail: s && s.detail, ph: g.p_home, lph: liveP(g),
    a: Object.assign({}, g.away, {sub: sub(g.away)}), h: Object.assign({}, g.home, {sub: sub(g.home)}),
    sa: Math.round(g.pts_away), sh: Math.round(g.pts_home), total: g.total, totalTxt: `${g.total.toFixed(1)} pts`,
    score: st === "pre" ? null : {a: s.away ?? 0, h: s.home ?? 0},
    note: g.pre ? "Preseason · rotations vary" : g.home.b2b || g.away.b2b ? `🔋 ${[g.away, g.home].filter(t => t.b2b).map(t => t.abbr).join(" & ")} on a back-to-back` : (g.neutral ? "Neutral site" : ""),
    stats: [["Total", `${g.total.toFixed(1)} pts`], ["Line", modelLine(g)], ["Within 5", pct(closeGame(g))], ["Margin", `±${g.sd_margin.toFixed(0)}`]]};
  if (st === "final") v.hit = (s.home > s.away) === (g.p_home >= 0.5);
  return v;
}
const NMK = {pts: {L: 19.5, lab: "20+ pts", d: 1}, reb: {L: 7.5, lab: "8+ reb", d: 1}, ast: {L: 5.5, lab: "6+ ast", d: 1}, fg3: {L: 1.5, lab: "2+ threes", d: 1}, pra: {L: 29.5, lab: "30+ PRA", d: 1}};
function nPlayer(p) {
  const t = teamOf(p.team), g = gameOf(p), B = g && NBOX[g.game_id] ? NBOX[g.game_id].box[String(p.id)] : null;
  const live = k => B ? (k === "pra" ? B.pts + B.reb + B.ast : B[k]) : null, pra = p.pts + p.reb + p.ast;
  const val = (k, v, txt) => ({v, txt, chance: pStat(p, k, NMK[k].L), chanceLab: NMK[k].lab, live: live(k)});
  return {id: p.id, gid: p.game_id, name: p.name, team: p.team, pos: p.pos, img: p.headshot, logo: t.logo, color: t.color,
    meta: `${p.team} · ${p.pos || "–"}${g ? ` · ${g.home.abbr === p.team ? "vs" : "@"} ${p.opp}` : ""} · ${p.min.toFixed(0)} min${!p.gp && p.gp_pre ? " · from preseason" : ""}${p.status ? " · " + ST(p.status) : ""}`,
    vals: {pts: val("pts", p.pts, p.pts.toFixed(1)), reb: val("reb", p.reb, p.reb.toFixed(1)), ast: val("ast", p.ast, p.ast.toFixed(1)),
           fg3: val("fg3", p.fg3, p.fg3.toFixed(1)), pra: val("pra", pra, pra.toFixed(1))}};
}
function bars(a, h, lab, va, vh, ra, rh, sc) {
  const w = v => Math.max(4, Math.min(100, 100 * Math.abs(v) / sc)), better = ra < rh ? "a" : rh < ra ? "h" : "";
  return `<div class="xrow"><span class="xv ${better === "a" ? "win" : ""}">#${ra ?? "–"}</span><div class="xmid"><span class="xlab">${lab}</span><div class="xbars">
    <div class="xb l"><i style="width:${w(va)}%;background:${va >= 0 ? esc(a.color) : "#ff6b6b"};opacity:${better === "h" ? .45 : 1}"></i></div>
    <div class="xb"><i style="width:${w(vh)}%;background:${vh >= 0 ? esc(h.color) : "#ff6b6b"};opacity:${better === "a" ? .45 : 1}"></i></div></div></div>
    <span class="xv r ${better === "h" ? "win" : ""}">#${rh ?? "–"}</span></div>`;
}
function matchupHtml(g) {
  const A = D.teams[g.away.abbr] || {}, H = D.teams[g.home.abbr] || {}, a = g.away, h = g.home, ra = A.rank || {}, rh = H.rank || {};
  const M = D.meta.model || {};
  return `<div class="xmk-sec">Team ratings (points per game vs an average team)</div>
    ${bars(a, h, "Offence", A.off ?? 0, H.off ?? 0, ra.off, rh.off, 8)}${bars(a, h, "Defence", A.dfn ?? 0, H.dfn ?? 0, ra.dfn, rh.dfn, 8)}${bars(a, h, "Net rating", A.net ?? 0, H.net ?? 0, ra.net, rh.net, 14)}
    <div class="hint">${esc(a.abbr)} ${sgn(A.net ?? 0)} net (#${ra.net ?? "–"}) at ${esc(h.abbr)} ${sgn(H.net ?? 0)} (#${rh.net ?? "–"}). Home court is worth ${(M.hca ?? 0).toFixed(1)} pts${a.b2b || h.b2b ? `; a back-to-back costs about ${Math.abs(M.b2b_own ?? 0).toFixed(1)} pts of scoring` : ""}.</div>`;
}
function marginHtml(g) {
  const sd = g.sd_margin, xs = []; for (let m = -30; m <= 30; m += 3) xs.push(m);
  const pm = xs.map(m => phi((m + 1.5 - g.margin) / sd) - phi((m - 1.5 - g.margin) / sd)), top = Math.max(...pm);
  return `<div class="xmk-sec">Final margin (home − away)</div><div class="nb-dist">${xs.map((m, i) => `<div class="${m > 0 ? "h" : m < 0 ? "a" : ""}" style="--h:${(100 * pm[i] / top).toFixed(0)}%"><i></i><span>${m % 9 === 0 ? (m > 0 ? "+" + m : m) : ""}</span></div>`).join("")}</div>
    <div class="hint">${esc(g.home.abbr)} wins ${pct(g.p_home)} · within 5 points ${pct(closeGame(g))} · projected ${g.pts_away.toFixed(0)}–${g.pts_home.toFixed(0)}, total ${g.total.toFixed(1)} (±${g.sd_total.toFixed(0)}).</div>`;
}
// court view: each side's projected starting five on a half court, spotted by position
const CT = {};   // game_id -> "home" | "away"
const CSPOT = [[50, 70], [13, 47], [87, 47], [22, 17], [66, 15]];   // PG top of the key, wings, short corner, post (% of the court)
const posRank = p => { const s = String(p.pos || "").toUpperCase(); return s === "PG" ? 0 : s === "G" ? 0.5 : s === "SG" ? 1 : /G-F|SF/.test(s) ? 2 : s === "F" ? 2.5 : /F-C|PF/.test(s) ? 3 : s === "C" ? 4 : 2.5; };
const COURT = `<svg class="nb-lines" viewBox="0 0 500 470" preserveAspectRatio="none" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2.5">
  <rect x="170" y="0" width="160" height="190" class="lane"/><circle cx="250" cy="190" r="60"/><path d="M220 40h60"/><circle cx="250" cy="52.5" r="7.5"/>
  <path d="M210 52.5a40 40 0 0 0 80 0"/><path d="M30 0v142a237.5 237.5 0 0 0 440 0V0"/><path d="M190 470a60 60 0 0 1 120 0"/></g></svg>`;
function courtHtml(g) {
  const side = CT[g.game_id] || (CT[g.game_id] = "home"), t = g[side];
  const seg = `<div class="rk-hd"><div class="seg2">${["away", "home"].map(k => `<button class="chip ${side === k ? "on" : ""}" data-ct="${esc(g.game_id)}|${k}">${esc(g[k].abbr)}</button>`).join("")}</div>
    <span class="nb-ctot">${(side === "home" ? g.pts_home : g.pts_away).toFixed(0)} pts projected</span></div>`;
  const P = (D.players || []).filter(p => String(p.game_id) === String(g.game_id) && p.team === t.abbr && !/^out/i.test(p.status || "")).sort((x, y) => y.min - x.min);
  if (!P.length) return seg + `<div class="hint">No player projections for ${esc(t.abbr)} yet.</div>`;
  const five = P.slice(0, 5).sort((x, y) => posRank(x) - posRank(y) || y.ast - x.ast), bench = P.slice(5, 10);
  const last = n => { const w = n.split(" "); return /^(Jr\.?|Sr\.?|II|III|IV)$/.test(w[w.length - 1]) && w.length > 2 ? w[w.length - 2] : w[w.length - 1]; };
  const dots = five.map((p, i) => `<button class="nb-cp${p.status ? " q" : ""}" style="left:${CSPOT[i][0]}%;top:${CSPOT[i][1]}%" data-player="${esc(p.id)}">
      <span class="nb-ch"><img src="${esc(p.headshot)}" alt="" loading="lazy" onerror="this.remove()"><i>${esc(String(p.pos || "").split("-")[0])}</i>${p.status ? `<em>${esc(ST(p.status))}</em>` : ""}</span>
      <b>${esc(last(p.name))}</b><span>${p.pts.toFixed(1)} pts</span><small>${p.reb.toFixed(1)} reb · ${p.ast.toFixed(1)} ast</small></button>`).join("");
  const outs = (D.injuries || []).filter(o => o.team === t.abbr && /^(out|doubt)/i.test(o.status || ""));
  return seg + `<div class="nb-court" style="--tc:${esc(t.color || "#556")}">${t.logo ? `<img class="nb-clogo" src="${esc(t.logo)}" alt="" onerror="this.remove()">` : ""}${COURT}${dots}</div>
    ${bench.length ? `<div class="xmk-sec">Bench</div><div class="nb-bench">${bench.map(p => `<button data-player="${esc(p.id)}"><b>${esc(last(p.name))}</b><span>${p.min.toFixed(0)} min · ${p.pts.toFixed(1)} pts</span></button>`).join("")}</div>` : ""}
    ${outs.length ? `<div class="hint">🚑 Not playing: ${outs.map(o => `${esc(o.name)} <b class="neg">${esc(ST(o.status))}</b>`).join(", ")}.</div>` : ""}
    <div class="hint">Projected starting five: the five players with the most projected minutes${g.pre ? " (preseason rotations are guesses)" : ""}. Gold ring = questionable. Tap anyone for their chances.</div>`;
}
function powerTable() {
  const rows = Object.entries(D.teams || {}).sort((x, y) => y[1].net - x[1].net);
  return `<div class="card nb-pow">${rows.map(([ab, t], i) => `<div class="nb-pr"><span class="nb-rk">${i + 1}</span><b>${esc(ab)}</b><span class="nb-v ${t.net >= 0 ? "pos" : "neg"}">${sgn(t.net)}</span>
    <span class="nb-s">O ${sgn(t.off)} · D ${sgn(t.dfn)}</span></div>`).join("")}</div>`;
}
let UF = "all";
const UPD = {all: "All", injury: "🚑 Injuries", teams: "📈 Teams", data: "📥 Data"};
const fmtT = t => new Date(t).toLocaleString("en-US", {weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit", timeZone: "America/New_York"}) + " ET";
function modelHtml() {
  const M = D.meta.model || {}, m = D.meta;
  const now = `<div class="card"><div class="lk-h">The model right now</div><div class="kv" style="margin-top:8px">
      <div><span>Results through</span><b>${esc(m.data_through || "–")}</b></div><div><span>Games fit</span><b>${M.games_fit ?? "–"} <span style="font-size:12px;color:var(--t3)">${M.games_this_season ?? 0} this season</span></b></div>
      <div><span>League scoring</span><b>${(M.league_pts ?? 0).toFixed(1)} pts/team</b></div><div><span>Home court</span><b>+${(M.hca ?? 0).toFixed(1)} pts</b></div>
      <div><span>Margin spread</span><b>±${(M.sd_margin ?? 0).toFixed(1)}</b></div><div><span>Back-to-back</span><b>${(M.b2b_own ?? 0).toFixed(1)} pts</b></div>
      <div><span>Preseason learned</span><b>${M.games_preseason ?? 0} games <span style="font-size:12px;color:var(--t3)">at ${Math.round(100 * (M.preseason_weight ?? 0.25))}% weight</span></b></div></div>
    <div class="hint">Refits every run on all finished games: team offence and defence, home court and back-to-backs, with recent games weighted most (a game's weight halves every ${M.half_life ?? 60} game days; last season counts ${Math.round(100 * (M.carry ?? 0.7))}% until this season's games take over). Preseason games count ${Math.round(100 * (M.preseason_weight ?? 0.25))}%: starters rest and rotations are tryouts, so they nudge the ratings and give rookies and new arrivals their first numbers without rewriting last season.</div></div>`;
  const runs = D.updates || [], chips = `<div class="strip" style="padding-left:0">${Object.keys(UPD).map(k => `<button class="chip ${UF === k ? "on" : ""}" data-uf="${k}">${UPD[k]}</button>`).join("")}</div>`;
  const list = runs.map(r => { const it = r.items.filter(i => UF === "all" || i.kind === UF); if (!it.length) return "";
    return `<div class="card upd"><div class="ut">${esc(fmtT(r.time))}</div>${it.map(i => `<div class="ui"><span>${i.icon}</span><span>${esc(i.text)}</span></div>`).join("")}</div>`; }).join("");
  return `<div class="updlinks"><button data-info="1">How it works</button></div>` + now + chips + (list || `<div class="note" style="color:var(--t3)">No changes logged yet.</div>`)
    + `<div class="hx-h" style="margin:22px 2px 10px"><b>Power ratings</b></div>` + powerTable();
}
function openInfo() {
  pjSheet(`<div class="sh-t">How the NBA model works</div><div class="hint" style="font-size:14.5px">Every team gets an offence and a defence rating in points per game against an average team, fit on every finished game with the most recent games weighted most. A game's projection is league scoring + home court + the offence − the other side's defence, adjusted for back-to-backs. Win chance comes from the projected margin and how much NBA margins vary (about ±${(D.meta.model.sd_margin || 12).toFixed(0)} points).<br><br>Players: projected minutes and per-minute production from recent games, injured players removed, minutes re-balanced to a full 240-minute game, and points scaled to the team's projected score. Chances use each stat's spread. Projections only, no betting advice.</div>`);
}
/*CALIB_JS*/
PJA = {
  sport: "NBA", sheetNote: "The model's projection for this game: recent minutes and per-minute production, the opponent, injuries and the team's projected score.",
  totalLabel: "Highest total", topLabel: "Top projected scorers", gamesLabel: "Tonight's games",
  markets: [{k: "pts", label: "Points", unit: "proj pts", note: "Projected points · bar = chance of 20+"},
            {k: "reb", label: "Rebounds", unit: "proj reb", note: "Projected rebounds · bar = chance of 8+"},
            {k: "ast", label: "Assists", unit: "proj ast", note: "Projected assists · bar = chance of 6+"},
            {k: "fg3", label: "Threes", unit: "proj 3PM", note: "Projected threes made · bar = chance of 2+"},
            {k: "pra", label: "PRA", unit: "proj PRA", note: "Points + rebounds + assists · bar = chance of 30+"}],
  kicker: () => `NBA · ${D.meta.preseason ? "Preseason" : D.meta.upcoming ? "Next slate" : "Tonight"}`,
  header, strip,
  games: () => D.games.slice().sort((x, y) => new Date(x.start_utc) - new Date(y.start_utc)).map(nGame),
  players: () => (D.players || []).map(nPlayer),
  top: () => (D.players || []).slice().sort((x, y) => y.pts - x.pts).slice(0, 8).map(p => ({p: nPlayer(p), mk: "pts"})),
  panels: gm => { const g = D.games.find(x => String(x.game_id) === String(gm.id)), P = (D.players || []).filter(p => String(p.game_id) === String(g.game_id)).map(nPlayer);
    const top = mk => P.slice().sort((x, y) => y.vals[mk].v - x.vals[mk].v).slice(0, 5);
    return [{k: "matchup", label: "Matchup", html: () => matchupHtml(g)}, {k: "court", label: "Court", html: () => courtHtml(g)},
      {k: "players", label: "Players", html: () => `<div class="xmk-sec">Points</div><div class="pj-mini">${top("pts").map(p => pjPlayerRow(p, "pts")).join("")}</div>
        <div class="xmk-sec">Rebounds</div><div class="pj-mini">${top("reb").map(p => pjPlayerRow(p, "reb")).join("")}</div>
        <div class="xmk-sec">Assists</div><div class="pj-mini">${top("ast").map(p => pjPlayerRow(p, "ast")).join("")}</div>`},
      {k: "margin", label: "Margin", html: () => marginHtml(g)}]; },
  playerLines: id => { const p = (D.players || []).find(x => String(x.id) === String(id)); if (!p) return [];
    const out = [], near = (m, step, lo) => { const c = Math.max(lo, Math.round((m - step) / step) * step); return [c, c + step, c + 2 * step].map(x => x - 0.5).filter(x => x > 0); };
    for (const L of near(p.pts, 5, 5)) out.push([`${L + 0.5}+ points`, pStat(p, "pts", L), {stat: "pts", n: L + 0.5}]);
    for (const L of near(p.reb, 2, 2)) out.push([`${L + 0.5}+ rebounds`, pStat(p, "reb", L), {stat: "reb", n: L + 0.5}]);
    for (const L of near(p.ast, 2, 2)) out.push([`${L + 0.5}+ assists`, pStat(p, "ast", L), {stat: "ast", n: L + 0.5}]);
    for (const L of [0.5, 1.5, 2.5, 3.5]) if (p.fg3 >= 0.3 || L < 1) out.push([`${L + 0.5}+ threes`, pStat(p, "fg3", L), {stat: "fg3", n: L + 0.5}]);
    const pra = p.pts + p.reb + p.ast; for (const L of near(pra, 5, 10)) out.push([`${L + 0.5}+ PRA`, pStat(p, "pra", L), {stat: "pra", n: L + 0.5}]);
    return out; },
  ctx: gid => { const g = D.games.find(x => String(x.game_id) === String(gid)); if (!g) return null;
    return {sport: "NBA", espnIds: true, game: `${g.away.abbr} @ ${g.home.abbr}`, start: g.start_utc, open: !scoreOf(g) && new Date(g.start_utc) > Date.now(),
      ev: {date: bkEvDate(g.start_utc), home: g.home.abbr, away: g.away.abbr, id: String(g.game_id)}}; },
  lines: gid => { const g = D.games.find(x => String(x.game_id) === String(gid)), C = PJA.ctx(gid); if (!g || !C || !C.open) return null;
    const S = (kind, side, line, p, pick, mkt) => bkSel(Object.assign({kind, side, line, p, pick, mkt, gid: String(g.game_id)}, C));
    const lh = g.margin >= 0 ? -bkHalf(g.margin) : bkHalf(-g.margin), T = bkHalf(g.total), ph = phi((g.margin + lh) / g.sd_margin), po = 1 - phi((T - g.total) / g.sd_total);
    return {spread: [S("spread", "away", -lh, 1 - ph, `${g.away.abbr} ${pjSp(-lh)}`, "Spread"), S("spread", "home", lh, ph, `${g.home.abbr} ${pjSp(lh)}`, "Spread")],
      total: [S("total", "over", T, po, `Over ${T}`, "Total points"), S("total", "under", T, 1 - po, `Under ${T}`, "Total points")],
      ml: [S("ml", "away", null, 1 - g.p_home, `${g.away.abbr} to win`, "Moneyline"), S("ml", "home", null, g.p_home, `${g.home.abbr} to win`, "Moneyline")]}; },
  record: () => { const fin = D.games.filter(g => { const s = scoreOf(g); return s && s.state === "post"; }); if (!fin.length) return "";
    const w = fin.filter(g => { const s = scoreOf(g); return (s.home > s.away) === (g.p_home >= 0.5); }).length;
    return `<button class="card pj-rec" data-go="model"><span class="pj-rr"><b>${w}/${fin.length}</b><i>favourites won</i></span><span><b>Model check</b><i>Power ratings and every update</i></span><span class="chev">›</span></button>`; },
  modelHtml,
  after: render => document.querySelectorAll("#view [data-ct]").forEach(b => b.onclick = e => { e.stopPropagation(); const [id, k] = b.dataset.ct.split("|"); CT[id] = k; render(); }),
  modelWire: render => {
    document.querySelectorAll("[data-info]").forEach(b => b.onclick = () => D && openInfo());
    document.querySelectorAll("[data-uf]").forEach(b => b.onclick = () => { UF = b.dataset.uf; render(); }); },
};
function render() { pjRender(); }
$("#gearBtn").style.display = "none";
$("#infoBtn").onclick = () => D && openInfo();
$("#updBtn").onclick = () => { TAB = "model"; render(); window.scrollTo(0, 0); };
document.addEventListener("error", e => { const el = e.target; if (!el || el.tagName !== "IMG") return; const s0 = el.getAttribute("src") || "";
  if (s0.includes("/500-dark/")) { e.stopImmediatePropagation(); e.stopPropagation(); el.src = s0.replace("/500-dark/", "/500/"); } }, true);
fetch("nba.json?v=" + Date.now()).then(r => r.json()).then(async d => {
  D = d; render(); await loadLive(); await loadBoxes(); render();
  setInterval(async () => { if (D.games.some(g => (LIVE[g.game_id] || {}).state === "in")) { await loadLive(); await loadBoxes(); render(); } }, 60000);
}).catch(e => { $("#title").textContent = "NBA"; $("#sub").textContent = "Projections aren't published yet."; const sp = document.getElementById("splash"); if (sp) sp.remove(); });

</script>
