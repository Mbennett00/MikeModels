<style>
:root {
  --turf: #2f7d3a; --turf-2: #368a41; --cream: #fffaf0; --navy: #14301f; --ink: #14301f; --ink-2: #4a5d50;
  --muted: #7b8a7f; --red: #d9443a; --red-soft: #fbe3df; --gold: #e2ae45; --gold-soft: #fbefd2;
  --green: #23824a; --green-soft: #dff2e4; --line: #e7dfcf; --nav-h: 64px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body {
  font-family: var(--fb); color: var(--ink); min-height: 100vh; background-color: var(--turf);
  background-image:
    linear-gradient(90deg, rgba(255,255,255,.55) 0 3px, transparent 3px calc(100% - 3px), rgba(255,255,255,.55) calc(100% - 3px)),
    repeating-linear-gradient(180deg, rgba(255,255,255,.5) 0 2px, transparent 2px 90px),
    repeating-linear-gradient(180deg, var(--turf) 0 90px, var(--turf-2) 90px 180px);
  background-attachment: fixed;
}
button { font: inherit; color: inherit; cursor: pointer; }
.wrap { max-width: 720px; margin: 0 auto; padding: calc(10px + env(safe-area-inset-top)) 16px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom)); }
.hdr { display: flex; align-items: center; gap: 12px; margin: 4px 4px 12px; }
.hdr .mlogo { height: 56px; width: auto; flex: none; margin: -4px -2px -4px 0; filter: drop-shadow(1px 2px 0 rgba(0,0,0,.25)); }
.ball { width: 44px; height: 44px; border-radius: 12px; border: 2.5px solid var(--navy); box-shadow: 2px 3px 0 var(--navy); background: var(--cream);
        display: flex; align-items: center; justify-content: center; font-size: 26px; }
.hdr .t { flex: 1; min-width: 0; }

.hdr .sub { font-size: 13px; font-weight: 800; color: #e6f3e6; }
.iconbtn { width: 40px; height: 40px; border-radius: 50%; border: 2.5px solid var(--navy); background: var(--cream);
           box-shadow: 2px 3px 0 var(--navy); font-size: 18px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
.sport { display: flex; border: 2.5px solid var(--navy); border-radius: 999px; background: var(--cream); box-shadow: 2px 3px 0 var(--navy); overflow: hidden; }
.sport a { padding: 6px 10px; font-weight: 800; font-size: 13px; color: var(--navy); text-decoration: none; }
.sport a.on { background: var(--navy); color: var(--cream); }
.strip { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 0 0 12px; padding: 2px 4px 4px; }
.strip::-webkit-scrollbar { display: none; }
.chip { flex: 0 0 auto; border: 2.5px solid var(--navy); border-radius: 999px; background: var(--cream); padding: 6px 12px; font-weight: 800; font-size: 13.5px; white-space: nowrap; color: var(--navy); }
.chip.on { background: var(--navy); color: var(--cream); }
.chip.info { background: var(--surf); border-style: dashed; }
.card { background: var(--cream); border: 3px solid var(--navy); border-radius: 22px; padding: 14px; box-shadow: 4px 5px 0 var(--navy); margin: 0 4px 16px 0; }
.status { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13px; font-weight: 800; margin-bottom: 8px; opacity: .92; }
.live { display: inline-flex; align-items: center; gap: 5px; background: var(--red); color: #fff; font-weight: 800; font-size: 12px; border-radius: 999px; padding: 2px 9px; border: 2px solid var(--navy); }
.live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--surf); animation: blink 1.2s infinite; }
@keyframes blink { 50% { opacity: .2; } }
.final { background: var(--surf); color: var(--navy); border: 2px solid var(--navy); font-weight: 800; font-size: 12px; border-radius: 999px; padding: 2px 9px; }
.trow { display: grid; grid-template-columns: 44px 1fr auto; gap: 10px; align-items: center; padding: 5px 0; }
.logo { width: 44px; height: 44px; object-fit: contain; filter: drop-shadow(0 2px 2px rgba(0,0,0,.25)); }
.code { width: 40px; height: 40px; border-radius: 12px; border: 2px solid var(--navy); background: var(--surf); color: var(--navy); display: flex; align-items: center; justify-content: center; font-family: var(--fh); font-weight: 600; font-size: 12px; }
.tname { font-family: var(--fh); font-weight: 600; font-size: 18px; line-height: 1.1; }
.qb { font-size: 12.5px; font-weight: 700; opacity: .88; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ink-light .tname, .ink-light .pct, .ink-light .score { text-shadow: 0 1px 2px rgba(0,0,0,.35); }
.right { text-align: right; }
.pct { font-family: var(--fh); font-weight: 700; font-size: 18px; }
.score { font-family: var(--fh); font-weight: 700; font-size: 28px; line-height: 1; } .score.lose { opacity: .5; }
.bar { display: flex; height: 8px; border-radius: 99px; overflow: hidden; border: 2px solid var(--navy); gap: 2px; background: var(--navy); margin: 6px 0 10px; }
.card.gc { padding: 0; overflow: hidden; }
.gc .band { padding: 12px 14px 8px; }
.gc .body { padding: 0 14px 14px; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tile { border: 2.5px solid var(--navy); border-radius: 14px; background: var(--surf); padding: 8px 10px; text-align: left; display: flex; flex-direction: column; gap: 2px; min-height: 58px; box-shadow: 2px 2px 0 var(--navy); }
.tile:active { transform: translate(2px, 2px); box-shadow: none; }
.tile .l { font-size: 13px; font-weight: 800; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .v { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
.tile .c { font-family: var(--fh); font-weight: 700; font-size: 19px; color: var(--navy); }
.tile .b { font-family: var(--fh); font-weight: 700; font-size: 16px; color: var(--green); }
.tile .dk { font-size: 11.5px; font-weight: 800; color: var(--ink-2); } .pos { color: var(--green); } .neg { color: var(--red); }
.tile.val { border-color: var(--green); box-shadow: 2px 2px 0 var(--green); background: var(--surf-2); }
.tile.won { background: var(--green-soft); } .tile.lost > * { opacity: .45; } .tile.push { background: var(--surf-2); }
.more { width: 100%; margin-top: 10px; border: 2.5px solid var(--navy); background: var(--cream); box-shadow: 2px 2px 0 var(--navy); border-radius: 14px; padding: 9px; font-weight: 800; font-size: 14px; color: var(--navy); }

.ptabs button.on { background: var(--navy); color: var(--cream); }
.sec { font-size: 11.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 800; margin: 14px 2px 6px; }
.mx .r { display: grid; grid-template-columns: 118px 40px 1fr 40px; align-items: center; gap: 8px; margin: 9px 0; }
.mx .lab { font-size: 13.5px; font-weight: 800; color: var(--navy); white-space: nowrap; }
.mx .v { font-family: var(--fh); font-weight: 700; font-size: 14px; color: var(--navy); } .mx .v.r2 { text-align: right; }
.mx .tr { display: flex; height: 12px; background: var(--surf-2); border: 2px solid var(--navy); border-radius: 99px; overflow: hidden; }
.mx .half { flex: 1; display: flex; } .mx .half.l { justify-content: flex-end; border-right: 2px solid var(--navy); } .mx .half div { height: 100%; }
.mx .hd .v { font-size: 13px; } .mx .vs { text-align: center; font-size: 11px; font-weight: 800; color: var(--muted); text-transform: uppercase; }
.ih { display: flex; justify-content: space-between; font-family: var(--fh); font-weight: 600; color: var(--navy); margin-top: 8px; border-bottom: 2px solid var(--line); }
.ir { display: flex; justify-content: space-between; gap: 8px; font-size: 13.5px; font-weight: 800; color: var(--navy); padding: 4px 0; border-bottom: 2px dashed var(--line); }
.ps { font-size: 12px; font-weight: 700; color: var(--muted); } .tn2 { color: var(--navy); }
.hint { font-size: 13px; font-weight: 700; color: var(--ink-2); margin-top: 10px; line-height: 1.4; }
/* score distribution */
.dist { display: flex; align-items: flex-end; gap: 1px; height: 110px; border-bottom: 2.5px solid var(--navy); margin-top: 8px; }
.dist div { flex: 1; background: var(--surf-2); border-radius: 3px 3px 0 0; min-height: 1px; }
.dist div.k { background: var(--green); } .dist div.z { background: var(--navy); }
.dlab { display: flex; justify-content: space-between; font-size: 11.5px; font-weight: 800; color: var(--muted); margin-top: 3px; }
/* field view */
.field { position: relative; height: 150px; border: 3px solid var(--navy); border-radius: 16px; overflow: hidden; margin-top: 4px;
  background: repeating-linear-gradient(90deg, rgba(255,255,255,.6) 0 2px, transparent 2px 10%), linear-gradient(90deg, var(--ez-a) 0 8%, var(--turf) 8% 92%, var(--ez-h) 92%); }
.field .ez { position: absolute; top: 0; bottom: 0; width: 8%; display: flex; align-items: center; justify-content: center; writing-mode: vertical-rl;
             font-family: var(--fh); font-weight: 700; color: #fff; font-size: 13px; letter-spacing: .1em; text-shadow: 0 1px 2px rgba(0,0,0,.4); }
.field .ez.a { left: 0; transform: rotate(180deg); } .field .ez.h { right: 0; }
.field .fb { position: absolute; top: 50%; transform: translate(-50%, -50%); font-size: 26px; transition: left .4s; }
.field .fl { position: absolute; bottom: 6px; transform: translateX(-50%); background: var(--cream); border: 2px solid var(--navy); border-radius: 999px; font-size: 12px; font-weight: 800; padding: 0 8px; white-space: nowrap; }
/* teams */
.tr2 { display: grid; grid-template-columns: 26px 36px 1fr 74px; gap: 10px; align-items: center; padding: 8px 0; border-top: 2px dashed var(--line); }
.tr2:first-child { border-top: 0; }

.tr2 .logo { width: 36px; height: 36px; }

.nbar { height: 10px; border-radius: 99px; background: var(--surf-2); border: 2px solid var(--navy); overflow: hidden; display: flex; }
.likes { background: linear-gradient(160deg, #fff7df, var(--cream)); }
.lk-h { font-family: var(--fh); font-weight: 600; font-size: 19px; color: var(--navy); }

.likerow:first-of-type { border-top: 0; }

.lk-t { min-width: 0; display: flex; flex-direction: column; } .lk-t b { font-size: 15px; color: var(--navy); } .lk-t span { font-size: 12.5px; font-weight: 700; color: var(--ink-2); }
.lk-p { text-align: right; display: flex; flex-direction: column; } .lk-p b { font-family: var(--fh); font-size: 20px; color: var(--navy); } .lk-p span { font-size: 12px; font-weight: 800; color: var(--green); }
.likerow.won { background: var(--green-soft); } .likerow.lost { opacity: .45; }
.note { color: var(--ink-2); font-size: 14.5px; margin: 0 4px 12px; font-weight: 600; }
.empty { text-align: center; } .empty .e { font-size: 40px; } .empty .t { font-family: var(--fh); font-size: 20px; font-weight: 600; margin: 6px 0; }
.foot { text-align: center; color: #e6f3e6; font-size: 12px; font-weight: 700; margin-top: 18px; }
.kv { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; } .kv div { display: flex; flex-direction: column; }
.kv span { font-size: 12px; font-weight: 800; color: var(--muted); } .kv b { font-family: var(--fh); font-size: 18px; color: var(--navy); }
label.f { display: block; font-size: 13px; font-weight: 800; color: var(--ink-2); margin: 10px 0 4px 4px; }
.card input, .card select { font: inherit; font-weight: 700; color: var(--navy); background: var(--cream); border: 2.5px solid var(--navy); border-radius: 999px; padding: 9px 14px; min-height: 44px; width: 100%; appearance: none; -webkit-appearance: none; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.seg { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 4px; }
.seg button { border: 2.5px solid var(--navy); border-radius: 999px; background: var(--cream); padding: 7px 14px; font-weight: 800; color: var(--navy); }
.seg button.on { background: var(--navy); color: var(--cream); }
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; justify-content: center; padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
       background: linear-gradient(180deg, rgba(47,125,58,0), rgba(47,125,58,.95) 35%); }
.nav .in { display: flex; gap: 2px; background: var(--cream); border: 3px solid var(--navy); border-radius: 999px; padding: 5px; box-shadow: 3px 4px 0 var(--navy); width: 100%; max-width: 480px; }
.nav button { flex: 1; border: 0; background: transparent; border-radius: 999px; height: 44px; font-family: var(--fh); font-weight: 600; font-size: 12.5px; padding: 0 1px; color: var(--navy); white-space: nowrap; }
.nav button.on { background: var(--navy); color: var(--cream); }
.scrim { position: fixed; inset: 0; background: rgba(20,48,31,.45); z-index: 30; opacity: 0; pointer-events: none; transition: opacity .2s; }
.scrim.open { opacity: 1; pointer-events: auto; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 31; max-width: 560px; margin: 0 auto; background: var(--cream); border: 3px solid var(--navy); border-bottom: 0;
         border-radius: 26px 26px 0 0; padding: 10px 18px calc(18px + env(safe-area-inset-bottom)); transform: translateY(105%); transition: transform .25s ease; max-height: 88vh; overflow-y: auto; }
.sheet.open { transform: none; }
.grab { width: 44px; height: 5px; border-radius: 9px; background: var(--surf-2); margin: 2px auto 10px; }
.sh-t { font-family: var(--fh); font-weight: 600; font-size: 22px; color: var(--navy); line-height: 1.15; padding-right: 44px; }
.sh-s { font-size: 13.5px; font-weight: 700; color: var(--ink-2); margin-top: 2px; }
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0; }
.kpi { border: 2.5px solid var(--navy); border-radius: 14px; padding: 8px; text-align: center; background: var(--surf); }
.kpi .k { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 800; }
.kpi .n { font-family: var(--fh); font-weight: 700; font-size: 22px; color: var(--navy); } .kpi.g .n { color: var(--green); }
.oddsrow { display: flex; gap: 8px; }

.odds { flex: 1; font: inherit; font-family: var(--fh); font-size: 24px; font-weight: 700; color: var(--navy); border: 2.5px solid var(--navy); border-radius: 14px; padding: 8px 12px; background: var(--surf); min-width: 0; }

.close { position: absolute; right: 14px; top: 12px; }
.mk3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.mcol { border: 2.5px solid var(--navy); border-radius: 14px; background: var(--surf); padding: 7px 6px; display: flex; flex-direction: column; align-items: center; gap: 1px; box-shadow: 2px 2px 0 var(--navy); min-width: 0; }
.mcol:active { transform: translate(2px, 2px); box-shadow: none; }

.mcol .me.none { background: transparent; border-color: transparent; color: var(--muted); font-weight: 700; }
.mcol .me.lost { background: var(--surf-2); color: var(--muted); border-color: #ccc; }

.wx { font-size: 12.5px; font-weight: 800; margin: -4px 0 6px; opacity: .92; } .wx b { font-weight: 900; }
.wxc { font-size: 13px; font-weight: 700; color: var(--ink-2); background: var(--surf-2); border: 2px solid var(--navy); border-radius: 12px; padding: 8px 10px; margin-top: 10px; line-height: 1.45; }
/* formation */
.rk-hd { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 8px; } .seg2 { display: flex; gap: 4px; } .seg2 .chip { padding: 5px 11px; }
.field2 { position: relative; height: 400px; border: 3px solid var(--navy); border-radius: 16px; overflow: hidden;
  background: repeating-linear-gradient(180deg, rgba(255,255,255,.45) 0 2px, transparent 2px 12.5%), repeating-linear-gradient(180deg, var(--turf) 0 12.5%, var(--turf-2) 12.5% 25%); }
.fl-logo { position: absolute; left: 50%; top: 50%; width: 46%; transform: translate(-50%, -50%); opacity: .14; pointer-events: none; }

      font-family: var(--fh); font-weight: 700; font-size: 11px; box-shadow: 0 0 0 3px rgba(255,255,255,.55); }
.fc.q { box-shadow: 0 0 0 3px var(--gold); }

.fn { margin-top: 2px; font-weight: 800; font-size: 10.5px; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.8); white-space: nowrap; max-width: 58px; overflow: hidden; text-overflow: ellipsis; }
.fv { font-size: 9.5px; font-weight: 800; color: #eaffea; text-shadow: 0 1px 2px rgba(0,0,0,.7); white-space: nowrap; }
.link { width: 100%; margin-top: 8px; border: 0; background: transparent; font-weight: 800; font-size: 13.5px; color: var(--navy); text-decoration: underline; padding: 6px; text-align: left; }
.fg { position: absolute; top: -8px; left: -14px; font-family: var(--fh); font-weight: 700; font-size: 10px; border: 1.5px solid var(--navy); border-radius: 99px; padding: 0 4px; background: var(--surf); color: var(--navy); }
.grades .fg, .grades b { position: static; }
.fp .fg { position: absolute; top: -6px; left: 2px; z-index: 3; }

<script>
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const pct = p => (p == null || isNaN(p)) ? "–" : Math.round(100 * p) + "%";
let D = null, TAB = "home", LIVE = {};
const phi = x => { const t = 1 / (1 + 0.2316419 * Math.abs(x)), d = 0.3989423 * Math.exp(-x * x / 2), p = d * t * (0.3193815 + t * (-0.3565638 + t * (1.781478 + t * (-1.821256 + t * 1.330274)))); return x > 0 ? 1 - p : p; };

const pOver = (mean, sd, L) => 1 - phi((L - mean) / Math.max(sd, 1e-6));

// ---------- live scores + box scores (ESPN, in the browser) ----------
const ESPN = "https://site.api.espn.com/apis/site/v2/sports/basketball/nba/";
async function loadLive() {
  try {
    const r = await (await fetch(ESPN + "scoreboard?dates=" + String(D.meta.date).replace(/-/g, ""))).json();
    for (const ev of r.events || []) {
      const g = D.games.find(x => String(x.game_id) === String(ev.id)); if (!g) continue;
      const c = ev.competitions[0], tm = {}; c.competitors.forEach(x => tm[x.homeAway] = Number(x.score));
      LIVE[g.game_id] = {state: ev.status.type.state, detail: ev.status.type.shortDetail, home: tm.home, away: tm.away,
        period: ev.status.period, clock: ev.status.displayClock};

  } catch (e) {}
}
const NBOX = {};
async function loadBoxes() {
  await Promise.all(D.games.filter(g => { const L = LIVE[g.game_id]; return L && L.state !== "pre" && !(NBOX[g.game_id] && NBOX[g.game_id].final); }).map(async g => {
    try {
      const sm = await (await fetch(ESPN + "summary?event=" + g.game_id)).json(), box = {};
      for (const team of (sm.boxscore || {}).players || []) for (const grp of team.statistics || []) {
        const lab = (grp.labels || []).map(x => String(x).toUpperCase()), at = k => lab.indexOf(k);
        for (const a of grp.athletes || []) { const v = a.stats || []; if (!v.length) continue; const n = i => i < 0 ? 0 : Number(String(v[i]).split("-")[0]) || 0;
          box[String((a.athlete || {}).id)] = {pts: n(at("PTS")), reb: n(at("REB")), ast: n(at("AST")), fg3: n(at("3PT")), min: n(at("MIN"))}; }
      }

    } catch (e) {}

}
function scoreOf(g) { const L = LIVE[g.game_id]; if (L && (L.state === "in" || L.state === "post")) return L;
  if (g.result) return {state: "post", detail: "Final", home: g.result.home, away: g.result.away}; return null; }

function liveP(g) { const s = scoreOf(g); if (!s || s.state !== "in") return null;
  const per = Math.max(1, Number((LIVE[g.game_id] || {}).period) || 1), clock = String((LIVE[g.game_id] || {}).clock || "12:00").split(":"), left = Math.max(0, (4 - per) * 12 + Number(clock[0] || 0) + Number(clock[1] || 0) / 60);
  const f = Math.min(1, left / 48), m = (s.home - s.away) + g.margin * f, sd = Math.max(1.5, g.sd_margin * Math.sqrt(f)); return phi(m / sd); }

// ---------- helpers ----------
const tipLab = s => new Date(s).toLocaleString("en-US", {weekday: "short", hour: "numeric", minute: "2-digit", timeZone: "America/New_York"});
const teamOf = abbr => { for (const g of D.games) { if (g.home.abbr === abbr) return g.home; if (g.away.abbr === abbr) return g.away; } return {abbr, name: abbr, color: "#556070", logo: ""}; };
const gameOf = p => D.games.find(x => String(x.game_id) === String(p.game_id));

  $("#sub").textContent = sub;
}

  if (TAB === "games") { if (nl) h += `<span class="chip" style="background:var(--red-soft)">🔴 ${nl} live</span>`; if (nf) h += `<span class="chip">🏁 ${nf} final</span>`; }

}
// ---------- adapter pieces ----------
function nGame(g) {
  const s = scoreOf(g), st = !s ? "pre" : s.state === "in" ? "live" : "final";
  const sub = t => t.b2b ? "2nd night of a back-to-back" : esc(t.city || "");
  const v = {id: g.game_id, state: st, time: tipLab(g.start_utc), detail: s && s.detail, ph: g.p_home, lph: liveP(g),
    a: Object.assign({}, g.away, {sub: sub(g.away)}), h: Object.assign({}, g.home, {sub: sub(g.home)}),
    sa: Math.round(g.pts_away), sh: Math.round(g.pts_home), total: g.total, totalTxt: `${g.total.toFixed(1)} pts`,
    score: st === "pre" ? null : {a: s.away ?? 0, h: s.home ?? 0},
    note: g.home.b2b || g.away.b2b ? `🔋 ${[g.away, g.home].filter(t => t.b2b).map(t => t.abbr).join(" & ")} on a back-to-back` : (g.neutral ? "Neutral site" : ""),
    stats: [["Total", `${g.total.toFixed(1)} pts`], ["Line", modelLine(g)], ["Within 5", pct(closeGame(g))], ["Margin", `±${g.sd_margin.toFixed(0)}`]]};
  if (st === "final") v.hit = (s.home > s.away) === (g.p_home >= 0.5);
  return v;
}
const NMK = {pts: {L: 19.5, lab: "20+ pts", d: 1}, reb: {L: 7.5, lab: "8+ reb", d: 1}, ast: {L: 5.5, lab: "6+ ast", d: 1}, fg3: {L: 1.5, lab: "2+ threes", d: 1}, pra: {L: 29.5, lab: "30+ PRA", d: 1}};
function nPlayer(p) {
  const t = teamOf(p.team), g = gameOf(p), B = g && NBOX[g.game_id] ? NBOX[g.game_id].box[String(p.id)] : null;
  const live = k => B ? (k === "pra" ? B.pts + B.reb + B.ast : B[k]) : null, pra = p.pts + p.reb + p.ast;
  const val = (k, v, txt) => ({v, txt, chance: pStat(p, k, NMK[k].L), chanceLab: NMK[k].lab, live: live(k)});
  return {id: p.id, gid: p.game_id, name: p.name, team: p.team, pos: p.pos, img: p.headshot, logo: t.logo, color: t.color,
    meta: `${p.team} · ${p.pos || "–"}${g ? ` · ${g.home.abbr === p.team ? "vs" : "@"} ${p.opp}` : ""} · ${p.min.toFixed(0)} min${p.status ? " · " + ST(p.status) : ""}`,
    vals: {pts: val("pts", p.pts, p.pts.toFixed(1)), reb: val("reb", p.reb, p.reb.toFixed(1)), ast: val("ast", p.ast, p.ast.toFixed(1)),
           fg3: val("fg3", p.fg3, p.fg3.toFixed(1)), pra: val("pra", pra, pra.toFixed(1))}};
}
function bars(a, h, lab, va, vh, ra, rh, sc) {
  const w = v => Math.max(4, Math.min(100, 100 * Math.abs(v) / sc)), better = ra < rh ? "a" : rh < ra ? "h" : "";
  return `<div class="xrow"><span class="xv ${better === "a" ? "win" : ""}">#${ra ?? "–"}</span><div class="xmid"><span class="xlab">${lab}</span><div class="xbars">
    <div class="xb l"><i style="width:${w(va)}%;background:${va >= 0 ? esc(a.color) : "#ff6b6b"};opacity:${better === "h" ? .45 : 1}"></i></div>
    <div class="xb"><i style="width:${w(vh)}%;background:${vh >= 0 ? esc(h.color) : "#ff6b6b"};opacity:${better === "a" ? .45 : 1}"></i></div></div></div>
    <span class="xv r ${better === "h" ? "win" : ""}">#${rh ?? "–"}</span></div>`;
}
function matchupHtml(g) {
  const A = D.teams[g.away.abbr] || {}, H = D.teams[g.home.abbr] || {}, a = g.away, h = g.home, ra = A.rank || {}, rh = H.rank || {};
  const M = D.meta.model || {};
  return `<div class="xmk-sec">Team ratings (points per game vs an average team)</div>
    ${bars(a, h, "Offence", A.off ?? 0, H.off ?? 0, ra.off, rh.off, 8)}${bars(a, h, "Defence", A.dfn ?? 0, H.dfn ?? 0, ra.dfn, rh.dfn, 8)}${bars(a, h, "Net rating", A.net ?? 0, H.net ?? 0, ra.net, rh.net, 14)}
    <div class="hint">${esc(a.abbr)} ${sgn(A.net ?? 0)} net (#${ra.net ?? "–"}) at ${esc(h.abbr)} ${sgn(H.net ?? 0)} (#${rh.net ?? "–"}). Home court is worth ${(M.hca ?? 0).toFixed(1)} pts${a.b2b || h.b2b ? `; a back-to-back costs about ${Math.abs(M.b2b_own ?? 0).toFixed(1)} pts of scoring` : ""}.</div>`;
}
function marginHtml(g) {
  const sd = g.sd_margin, xs = []; for (let m = -30; m <= 30; m += 3) xs.push(m);
  const pm = xs.map(m => phi((m + 1.5 - g.margin) / sd) - phi((m - 1.5 - g.margin) / sd)), top = Math.max(...pm);
  return `<div class="xmk-sec">Final margin (home − away)</div><div class="nb-dist">${xs.map((m, i) => `<div class="${m > 0 ? "h" : m < 0 ? "a" : ""}" style="--h:${(100 * pm[i] / top).toFixed(0)}%"><i></i><span>${m % 9 === 0 ? (m > 0 ? "+" + m : m) : ""}</span></div>`).join("")}</div>
    <div class="hint">${esc(g.home.abbr)} wins ${pct(g.p_home)} · within 5 points ${pct(closeGame(g))} · projected ${g.pts_away.toFixed(0)}–${g.pts_home.toFixed(0)}, total ${g.total.toFixed(1)} (±${g.sd_total.toFixed(0)}).</div>`;
}
function powerTable() {
  const rows = Object.entries(D.teams || {}).sort((x, y) => y[1].net - x[1].net);
  return `<div class="card nb-pow">${rows.map(([ab, t], i) => `<div class="nb-pr"><span class="nb-rk">${i + 1}</span><b>${esc(ab)}</b><span class="nb-v ${t.net >= 0 ? "pos" : "neg"}">${sgn(t.net)}</span>
    <span class="nb-s">O ${sgn(t.off)} · D ${sgn(t.dfn)}</span></div>`).join("")}</div>`;
}
let UF = "all";
const UPD = {all: "All", injury: "🚑 Injuries", teams: "📈 Teams", data: "📥 Data"};
const fmtT = t => new Date(t).toLocaleString("en-US", {weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit", timeZone: "America/New_York"}) + " ET";
function modelHtml() {
  const M = D.meta.model || {}, m = D.meta;
  const now = `<div class="card"><div class="lk-h">The model right now</div><div class="kv" style="margin-top:8px">
      <div><span>Results through</span><b>${esc(m.data_through || "–")}</b></div><div><span>Games fit</span><b>${M.games_fit ?? "–"} <span style="font-size:12px;color:var(--t3)">${M.games_this_season ?? 0} this season</span></b></div>
      <div><span>League scoring</span><b>${(M.league_pts ?? 0).toFixed(1)} pts/team</b></div><div><span>Home court</span><b>+${(M.hca ?? 0).toFixed(1)} pts</b></div>
      <div><span>Margin spread</span><b>±${(M.sd_margin ?? 0).toFixed(1)}</b></div><div><span>Back-to-back</span><b>${(M.b2b_own ?? 0).toFixed(1)} pts</b></div></div>
    <div class="hint">Refits every run on all finished games: team offence and defence, home court and back-to-backs, with recent games weighted most (a game's weight halves every ${M.half_life ?? 60} game days; last season counts ${Math.round(100 * (M.carry ?? 0.7))}% until this season's games take over).</div></div>`;
  const runs = D.updates || [], chips = `<div class="strip" style="padding-left:0">${Object.keys(UPD).map(k => `<button class="chip ${UF === k ? "on" : ""}" data-uf="${k}">${UPD[k]}</button>`).join("")}</div>`;
  const list = runs.map(r => { const it = r.items.filter(i => UF === "all" || i.kind === UF); if (!it.length) return "";
    return `<div class="card upd"><div class="ut">${esc(fmtT(r.time))}</div>${it.map(i => `<div class="ui"><span>${i.icon}</span><span>${esc(i.text)}</span></div>`).join("")}</div>`; }).join("");
  return `<div class="updlinks"><button data-info="1">How it works</button></div>` + now + chips + (list || `<div class="note" style="color:var(--t3)">No changes logged yet.</div>`)
    + `<div class="hx-h" style="margin:22px 2px 10px"><b>Power ratings</b></div>` + powerTable();
}
function openInfo() {
  pjSheet(`<div class="sh-t">How the NBA model works</div><div class="hint" style="font-size:14.5px">Every team gets an offence and a defence rating in points per game against an average team, fit on every finished game with the most recent games weighted most. A game's projection is league scoring + home court + the offence − the other side's defence, adjusted for back-to-backs. Win chance comes from the projected margin and how much NBA margins vary (about ±${(D.meta.model.sd_margin || 12).toFixed(0)} points).<br><br>Players: projected minutes and per-minute production from recent games, injured players removed, minutes re-balanced to a full 240-minute game, and points scaled to the team's projected score. Chances use each stat's spread. Projections only, no betting advice.</div>`);
}
/*CALIB_JS*/
PJA = {
  sport: "NBA", sheetNote: "The model's projection for this game: recent minutes and per-minute production, the opponent, injuries and the team's projected score.",
  totalLabel: "Highest total", topLabel: "Top projected scorers", gamesLabel: "Tonight's games",
  markets: [{k: "pts", label: "Points", unit: "proj pts", note: "Projected points · bar = chance of 20+"},
            {k: "reb", label: "Rebounds", unit: "proj reb", note: "Projected rebounds · bar = chance of 8+"},
            {k: "ast", label: "Assists", unit: "proj ast", note: "Projected assists · bar = chance of 6+"},
            {k: "fg3", label: "Threes", unit: "proj 3PM", note: "Projected threes made · bar = chance of 2+"},
            {k: "pra", label: "PRA", unit: "proj PRA", note: "Points + rebounds + assists · bar = chance of 30+"}],
  kicker: () => `NBA · ${D.meta.upcoming ? "Next slate" : "Tonight"}`,
  header, strip,
  games: () => D.games.slice().sort((x, y) => new Date(x.start_utc) - new Date(y.start_utc)).map(nGame),
  players: () => (D.players || []).map(nPlayer),
  top: () => (D.players || []).slice().sort((x, y) => y.pts - x.pts).slice(0, 8).map(p => ({p: nPlayer(p), mk: "pts"})),
  panels: gm => { const g = D.games.find(x => String(x.game_id) === String(gm.id)), P = (D.players || []).filter(p => String(p.game_id) === String(g.game_id)).map(nPlayer);
    const top = mk => P.slice().sort((x, y) => y.vals[mk].v - x.vals[mk].v).slice(0, 5);
    return [{k: "matchup", label: "Matchup", html: () => matchupHtml(g)},
      {k: "players", label: "Players", html: () => `<div class="xmk-sec">Points</div><div class="pj-mini">${top("pts").map(p => pjPlayerRow(p, "pts")).join("")}</div>
        <div class="xmk-sec">Rebounds</div><div class="pj-mini">${top("reb").map(p => pjPlayerRow(p, "reb")).join("")}</div>
        <div class="xmk-sec">Assists</div><div class="pj-mini">${top("ast").map(p => pjPlayerRow(p, "ast")).join("")}</div>`},
      {k: "margin", label: "Margin", html: () => marginHtml(g)}]; },
  playerLines: id => { const p = (D.players || []).find(x => String(x.id) === String(id)); if (!p) return [];
    const out = [], near = (m, step, lo) => { const c = Math.max(lo, Math.round((m - step) / step) * step); return [c, c + step, c + 2 * step].map(x => x - 0.5).filter(x => x > 0); };
    for (const L of near(p.pts, 5, 5)) out.push([`${L + 0.5}+ points`, pStat(p, "pts", L)]);
    for (const L of near(p.reb, 2, 2)) out.push([`${L + 0.5}+ rebounds`, pStat(p, "reb", L)]);
    for (const L of near(p.ast, 2, 2)) out.push([`${L + 0.5}+ assists`, pStat(p, "ast", L)]);
    for (const L of [0.5, 1.5, 2.5, 3.5]) if (p.fg3 >= 0.3 || L < 1) out.push([`${L + 0.5}+ threes`, pStat(p, "fg3", L)]);
    const pra = p.pts + p.reb + p.ast; for (const L of near(pra, 5, 10)) out.push([`${L + 0.5}+ PRA`, pStat(p, "pra", L)]);
    return out; },
  record: () => { const fin = D.games.filter(g => { const s = scoreOf(g); return s && s.state === "post"; }); if (!fin.length) return "";
    const w = fin.filter(g => { const s = scoreOf(g); return (s.home > s.away) === (g.p_home >= 0.5); }).length;
    return `<button class="card pj-rec" data-go="model"><span class="pj-rr"><b>${w}/${fin.length}</b><i>favourites won</i></span><span><b>Model check</b><i>Power ratings and every update</i></span><span class="chev">›</span></button>`; },
  modelHtml,
  modelWire: render => {
    document.querySelectorAll("[data-info]").forEach(b => b.onclick = () => D && openInfo());
    document.querySelectorAll("[data-uf]").forEach(b => b.onclick = () => { UF = b.dataset.uf; render(); }); },
};
function render() { pjRender(); }
$("#gearBtn").style.display = "none";
$("#infoBtn").onclick = () => D && openInfo();
$("#updBtn").onclick = () => { TAB = "model"; render(); window.scrollTo(0, 0); };
document.addEventListener("error", e => { const el = e.target; if (!el || el.tagName !== "IMG") return; const s0 = el.getAttribute("src") || "";
  if (s0.includes("/500-dark/")) { e.stopImmediatePropagation(); e.stopPropagation(); el.src = s0.replace("/500-dark/", "/500/"); } }, true);
fetch("nba.json?v=" + Date.now()).then(r => r.json()).then(async d => {
  D = d; render(); await loadLive(); await loadBoxes(); render();
  setInterval(async () => { if (D.games.some(g => (LIVE[g.game_id] || {}).state === "in")) { await loadLive(); await loadBoxes(); render(); } }, 60000);
}).catch(e => { $("#title").textContent = "NBA"; $("#sub").textContent = "Projections aren't published yet."; const sp = document.getElementById("splash"); if (sp) sp.remove(); });

</script>
