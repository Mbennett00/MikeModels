"use strict";
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const pct = p => (p == null || isNaN(p)) ? "–" : Math.round(100 * p) + "%";
const am = x => (x == null || !isFinite(x)) ? "–" : (x > 0 ? "+" : "") + Math.round(x);
const fair = p => { p = Math.min(Math.max(p, 1e-9), 1 - 1e-9); return p >= 0.5 ? -100 * p / (1 - p) : 100 * (1 - p) / p; };
const implied = o => o < 0 ? -o / (-o + 100) : 100 / (o + 100);
const decimal = o => 1 + (o > 0 ? o / 100 : 100 / -o);
const sp = x => x == null ? "" : (x > 0 ? "+" : x < 0 ? "−" : "") + Math.abs(x);
const THR = 0.025;
// walk-forward 2021-25: totals edges of 4%+ won 60.6% (94 bets); 3-4% about break-even after -110 juice; under 3% lost
const LIKE_EDGE = 0.04;   // shade on the fair price before a bet is worth it (the model has not beaten closing lines)
let D = null, TAB = "home", LIVE = {}, BETS = [], SH = null, C = {game: null, m: "spread", side: "home", line: null};
const OPEN = new Set(), PANEL = {};
const BOOK = () => (D && D.meta.book) || "Caesars";
const BOOKS = () => BOOK() + (BOOK().endsWith("s") ? "'" : "'s");

// ---------- pricing from the exported distributions (mirrors nflmodel.model) ----------
function dist(g, m) { return m === "total" ? g.tpmf : g.mpmf; }
function prob(g, m, side, line) {
  // returns win chance with pushes removed: ml, spread (line = home handicap, e.g. -3.5), total (line = points)
  if (m === "ml") { const ph = g.p_home; return side === "home" ? ph : 1 - ph; }
  // spread lines are the handicap of the side asked about (home -3.5 / away +3.5)
  const d = dist(g, m); let over = 0, push = 0, under = 0;
  const cut = m === "total" ? line : (side === "home" ? -line : line);    // home covers -3.5 when margin > 3.5
  d.p.forEach((p, i) => { const k = d.lo + i; if (k > cut) over += p; else if (k === cut) push += p; else under += p; });
  const pf = over / Math.max(over + under, 1e-9);
  return (side === "home" || side === "over") ? pf : 1 - pf;
}
function pushP(g, m, line, side) { if (m === "ml") return 0; const d = dist(g, m), cut = m === "total" ? line : (side === "home" ? -line : line); return d.p[cut - d.lo] || 0; }

// ---------- live scores (ESPN) ----------
const ESPN_FIX = {LAR: "LA", WSH: "WAS"};
async function loadLive() {
  try {
    const r = await (await fetch("https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard")).json();
    for (const ev of r.events || []) {
      const c = ev.competitions[0], tm = {}; c.competitors.forEach(x => tm[x.homeAway] = {abbr: ESPN_FIX[x.team.abbreviation] || x.team.abbreviation, score: Number(x.score)});
      const g = D.games.find(x => x.home.abbr === tm.home.abbr && x.away.abbr === tm.away.abbr); if (!g) continue;
      const bo = mbParseEspnOdds(c); if (bo && (bo.ml.home || bo.total.over.odds)) LIVEODDS[g.game_id] = bo;   // DraftKings, live
      LIVE[g.game_id] = {espn: ev.id, state: ev.status.type.state, detail: ev.status.type.shortDetail, home: tm.home.score, away: tm.away.score,
                         poss: (c.situation || {}).possession, yard: (c.situation || {}).yardLine, down: (c.situation || {}).shortDownDistanceText};
    }
  } catch (e) {}
}
// box scores (ESPN game summary) for games with open prop bets: drives the sweat and grades NFL props at the final
const NBOX = {};
const nrm = s => String(s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/\b(jr|sr|ii|iii|iv)\b/g, "").replace(/[^a-z]/g, "");
async function loadBoxes() {
  let need;
  try { need = new Set(mbLoad().bets.filter(b => b.status === "open" && b.sport === "NFL").flatMap(b => b.legs.filter(l => (l.key || {}).t === "prop").map(l => l.gid))); } catch (e) { return; }
  await Promise.all([...need].map(async gid => {
    const L = LIVE[gid]; if (!L || !L.espn || L.state === "pre" || (NBOX[gid] && NBOX[gid].final)) return;
    try {
      const sm = await (await fetch("https://site.api.espn.com/apis/site/v2/sports/football/nfl/summary?event=" + L.espn)).json(), box = {};
      for (const team of (sm.boxscore || {}).players || []) for (const grp of team.statistics || []) {
        const k = grp.keys || [];
        for (const a of grp.athletes || []) {
          const v = a.stats || [], get = key => { const i = k.indexOf(key); return i < 0 ? 0 : Number(String(v[i]).split("/")[0]) || 0; };
          const o = box[nrm((a.athlete || {}).displayName)] = box[nrm((a.athlete || {}).displayName)] || {rec: 0, rec_yds: 0, rush_yds: 0, pass_yds: 0, td: 0, pass_td: 0};
          if (grp.name === "passing") { o.pass_yds = get("passingYards"); o.pass_td = get("passingTouchdowns"); }
          if (grp.name === "rushing") { o.rush_yds = get("rushingYards"); o.td += get("rushingTouchdowns"); }
          if (grp.name === "receiving") { o.rec = get("receptions"); o.rec_yds = get("receivingYards"); o.td += get("receivingTouchdowns"); }
        }
      }
      NBOX[gid] = {box, final: L.state === "post"};
    } catch (e) {}
  }));
}
function boxStat(gid, k) { const B = (NBOX[gid] || {}).box; if (!B) return undefined; const o = B[nrm(k.name)]; return o ? (k.mk === "td" ? o.td : o[k.mk]) : null; }
function scoreOf(g) { const L = LIVE[g.game_id]; if (L && (L.state === "in" || L.state === "post")) return L;
  if (g.result) return {state: "post", detail: "Final", home: g.result.home, away: g.result.away}; return null; }
function settle(g, b) {
  const s = scoreOf(g); if (!s || s.state !== "post") return "";
  const m = s.home - s.away, t = s.home + s.away; let v;
  if (b.m === "ml") v = b.s === "home" ? m : -m;
  else if (b.m === "spread") v = b.s === "home" ? m + b.line : b.line - m;
  else v = b.s === "over" ? t - b.line : b.line - t;
  return v > 0 ? "won" : v < 0 ? "lost" : "push";
}

// ---------- helpers ----------
function lum(hex) { const c = (hex || "#888").replace("#", ""); const f = i => { const v = parseInt(c.substr(i, 2), 16) / 255;
  return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }; return 0.2126 * f(0) + 0.7152 * f(2) + 0.0722 * f(4); }
const inkOf = hex => lum(hex) > 0.3 ? ["#14301f", ""] : ["#ffffff", "ink-light"];
function logo(t) { return `<img class="logo" src="${esc(t.logo)}" alt="${esc(t.abbr)}" onerror="this.outerHTML='<div class=&quot;code&quot;>${esc(t.abbr)}</div>'">`; }
const kickLab = s => new Date(s).toLocaleString("en-US", {weekday: "short", hour: "numeric", minute: "2-digit", timeZone: "America/New_York"});
function empty(e, t, s) { return `<div class="card empty"><div class="e">${e}</div><div class="t">${esc(t)}</div><div class="note">${esc(s)}</div></div>`; }
function bet(o) { BETS.push(o); return BETS.length - 1; }
function label(g, b) {
  const t = b.s === "home" ? g.home : g.away;
  if (b.m === "ml") return `${t.abbr} win`;
  if (b.m === "spread") return `${t.abbr} ${sp(b.line)}`;
  return `${b.s === "over" ? "Over" : "Under"} ${b.line}`;
}
const duo = (g, big) => `<span class="duo ${big ? "duo-b" : ""}"><img src="${esc(g.away.logo)}" alt="" onerror="this.remove()"><img src="${esc(g.home.logo)}" alt="" onerror="this.remove()"></span>`;
const tlabel = (g, b) => (b.m === "total" ? duo(g) : "") + esc(label(g, b));
function mkBets(g) {   // attach line numbers (home handicap = −spread) to the exported model-vs-market rows
  return g.bets.map(b => Object.assign({}, b, {line: b.m === "spread" ? (b.s === "home" ? -g.spread : g.spread) : b.m === "total" ? g.total_line : null}));

  const x = p.dk[`${k.mk}|${k.mk === "td" ? 0.5 : k.l}`], o = x && ((k.dir || "over") === "over" ? x.o : x.u);

// 🏈 anytime-TD pricing: consensus across books when posted (Odds API), else the model's fair price
const imp = o => o > 0 ? 100 / (o + 100) : -o / (-o + 100);

}
function tdBet(p, l = 0.5) { const q = tdQuote(p, l); return bet({tdp: p, l, p: q.pr, odds: q.odds, mkt: q.mkt, src: q.src, label: `${p.name} ${l === 0.5 ? "anytime TD" : "2+ TDs"}`}); }

// what a tapped price becomes on the slip

// 🏠 home hooks: which sport this is, and one-tap quick picks from the model
function mbMiniGames(px) { if (!D || !D.games.length) return [];

function mbQuickPicks() {
  if (!D || !D.games.length) return [];
  const out = [], used = new Set();
  const vals = D.games.filter(nflOpen).flatMap(g => mkBets(g).filter(b => b.edge != null && b.edge >= LIKE_EDGE).map(b => ({g, b}))).sort((x, y) => y.b.edge - x.b.edge)
    .filter(x => used.has(x.g.game_id) ? false : (used.add(x.g.game_id), true)).slice(0, 3);
  const gleg = ({g, b}) => Object.assign(mbLegOf({g, b, p: b.p, label: label(g, b)}), {sport: "NFL", odds: dkLive(g, b) || b.price || Math.round(fair(b.p)), book: dkLive(g, b) ? "DraftKings" : null});
  if (vals.length >= 2) out.push({tag: "MODEL PARLAY", title: `The model's top ${vals.length} edges`, legs: vals.map(gleg)});
  const u2 = new Set(), tds = (D.players || []).filter(p => nflOpen(gameOf(p))).map(p => ({p, q: tdQuote(p)})).sort((a, b) => b.q.pr - a.q.pr)
    .filter(x => u2.has(x.p.game_id) ? false : (u2.add(x.p.game_id), true)).slice(0, 3);
  const tleg = ({p, q}) => Object.assign(tdLeg({tdp: p, l: 0.5, p: q.pr, label: `${p.name} anytime TD`}), {sport: "NFL", odds: q.odds, book: q.mkt ? "Consensus" : null});
  if (tds.length === 3) out.push({tag: "TD 3-PACK", title: "Three likeliest scorers, three games", legs: tds.map(tleg)});
  const tv = (D.players || []).filter(p => nflOpen(gameOf(p))).map(p => ({p, q: tdQuote(p)})).filter(x => x.q.edge != null && x.q.edge > 0).sort((a, b) => b.q.edge - a.q.edge)[0];

// a TD price tap toggles it on the slip, like a sportsbook
function tdToggle(o) {

// ✓ prices already on the slip light up
function mbMarkSlip() {

// 💸 cash out before kickoff at the model's price (in-game NFL pricing isn't modelled: no offer once a game starts)
function mbLegProb(leg) {
  const k = leg.key || {}, g = D.games.find(x => String(x.game_id) === String(leg.gid)); if (!g || scoreOf(g)) return null;
  if (k.t === "game") { const b = mkBets(g).find(x => x.m === k.m && x.s === k.s && (k.l == null || x.line == null || Math.abs(x.line - k.l) < 1e-6)); return b ? b.p : leg.p; }
  if (k.t === "prop") { const p = (D.players || []).find(x => String(x.id) === String(k.pid)); if (!p) return null;
    const q = k.mk === "td" ? 1 - Math.exp(-p.lam_td) : pOver(p, k.mk, k.l); return (k.dir || "over") === "over" ? q : 1 - q; }
  return null;
}
function mbArtFor(leg) {   // logos / headshot for bets saved without them

function mbLiveLeg(leg) {
  const g = D.games.find(x => x.game_id === leg.gid); if (!g) return null;
  const L = scoreOf(g) || LIVE[g.game_id] || {}, k = leg.key || {}; let cur = null, unit = "";

}
