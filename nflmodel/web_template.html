<style>

<script>
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const pct = p => (p == null || isNaN(p)) ? "–" : Math.round(100 * p) + "%";
const am = x => (x == null || !isFinite(x)) ? "–" : (x > 0 ? "+" : "") + Math.round(x);
const fair = p => { p = Math.min(Math.max(p, 1e-9), 1 - 1e-9); return p >= 0.5 ? -100 * p / (1 - p) : 100 * (1 - p) / p; };
const implied = o => o < 0 ? -o / (-o + 100) : 100 / (o + 100);
const decimal = o => 1 + (o > 0 ? o / 100 : 100 / -o);
const sp = x => x == null ? "" : (x > 0 ? "+" : x < 0 ? "−" : "") + Math.abs(x);
const THR = 0.025;
// walk-forward 2021-25: totals edges of 4%+ won 60.6% (94 bets); 3-4% about break-even after -110 juice; under 3% lost
const LIKE_EDGE = 0.04;   // shade on the fair price before a bet is worth it (the model has not beaten closing lines)
let D = null, TAB = "games", LIVE = {}, BETS = [], SH = null, C = {game: null, m: "spread", side: "home", line: null};
const OPEN = new Set(), PANEL = {};
const BOOK = () => (D && D.meta.book) || "Caesars";
const BOOKS = () => BOOK() + (BOOK().endsWith("s") ? "'" : "'s");

// ---------- pricing from the exported distributions (mirrors nflmodel.model) ----------
function dist(g, m) { return m === "total" ? g.tpmf : g.mpmf; }
function prob(g, m, side, line) {
  // returns win chance with pushes removed: ml, spread (line = home handicap, e.g. -3.5), total (line = points)
  if (m === "ml") { const ph = g.p_home; return side === "home" ? ph : 1 - ph; }
  // spread lines are the handicap of the side asked about (home -3.5 / away +3.5)
  const d = dist(g, m); let over = 0, push = 0, under = 0;
  const cut = m === "total" ? line : (side === "home" ? -line : line);    // home covers -3.5 when margin > 3.5
  d.p.forEach((p, i) => { const k = d.lo + i; if (k > cut) over += p; else if (k === cut) push += p; else under += p; });
  const pf = over / Math.max(over + under, 1e-9);
  return (side === "home" || side === "over") ? pf : 1 - pf;
}
function pushP(g, m, line, side) { if (m === "ml") return 0; const d = dist(g, m), cut = m === "total" ? line : (side === "home" ? -line : line); return d.p[cut - d.lo] || 0; }

// ---------- live scores (ESPN) ----------
const ESPN_FIX = {LAR: "LA", WSH: "WAS"};
async function loadLive() {
  try {
    const r = await (await fetch("https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard")).json();
    for (const ev of r.events || []) {
      const c = ev.competitions[0], tm = {}; c.competitors.forEach(x => tm[x.homeAway] = {abbr: ESPN_FIX[x.team.abbreviation] || x.team.abbreviation, score: Number(x.score)});
      const g = D.games.find(x => x.home.abbr === tm.home.abbr && x.away.abbr === tm.away.abbr); if (!g) continue;
      const bo = mbParseEspnOdds(c); if (bo && (bo.ml.home || bo.total.over.odds)) LIVEODDS[g.game_id] = bo;   // DraftKings, live
      LIVE[g.game_id] = {espn: ev.id, state: ev.status.type.state, detail: ev.status.type.shortDetail, home: tm.home.score, away: tm.away.score,
                         poss: (c.situation || {}).possession, yard: (c.situation || {}).yardLine, down: (c.situation || {}).shortDownDistanceText};
    }
  } catch (e) {}
}
// box scores (ESPN game summary) for games with open prop bets: drives the sweat and grades NFL props at the final
const NBOX = {};
const nrm = s => String(s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/\b(jr|sr|ii|iii|iv)\b/g, "").replace(/[^a-z]/g, "");
async function loadBoxes() {
  let need;
  try { need = new Set(mbLoad().bets.filter(b => b.status === "open" && b.sport === "NFL").flatMap(b => b.legs.filter(l => (l.key || {}).t === "prop").map(l => l.gid))); } catch (e) { return; }
  await Promise.all([...need].map(async gid => {
    const L = LIVE[gid]; if (!L || !L.espn || L.state === "pre" || (NBOX[gid] && NBOX[gid].final)) return;
    try {
      const sm = await (await fetch("https://site.api.espn.com/apis/site/v2/sports/football/nfl/summary?event=" + L.espn)).json(), box = {};
      for (const team of (sm.boxscore || {}).players || []) for (const grp of team.statistics || []) {
        const k = grp.keys || [];
        for (const a of grp.athletes || []) {
          const v = a.stats || [], get = key => { const i = k.indexOf(key); return i < 0 ? 0 : Number(String(v[i]).split("/")[0]) || 0; };
          const o = box[nrm((a.athlete || {}).displayName)] = box[nrm((a.athlete || {}).displayName)] || {rec: 0, rec_yds: 0, rush_yds: 0, pass_yds: 0, td: 0, pass_td: 0};
          if (grp.name === "passing") { o.pass_yds = get("passingYards"); o.pass_td = get("passingTouchdowns"); }
          if (grp.name === "rushing") { o.rush_yds = get("rushingYards"); o.td += get("rushingTouchdowns"); }
          if (grp.name === "receiving") { o.rec = get("receptions"); o.rec_yds = get("receivingYards"); o.td += get("receivingTouchdowns"); }
        }
      }
      NBOX[gid] = {box, final: L.state === "post"};
    } catch (e) {}
  }));
}
function boxStat(gid, k) { const B = (NBOX[gid] || {}).box; if (!B) return undefined; const o = B[nrm(k.name)]; return o ? (k.mk === "td" ? o.td : o[k.mk]) : null; }
function scoreOf(g) { const L = LIVE[g.game_id]; if (L && (L.state === "in" || L.state === "post")) return L;
  if (g.result) return {state: "post", detail: "Final", home: g.result.home, away: g.result.away}; return null; }
function settle(g, b) {
  const s = scoreOf(g); if (!s || s.state !== "post") return "";
  const m = s.home - s.away, t = s.home + s.away; let v;
  if (b.m === "ml") v = b.s === "home" ? m : -m;
  else if (b.m === "spread") v = b.s === "home" ? m + b.line : b.line - m;
  else v = b.s === "over" ? t - b.line : b.line - t;
  return v > 0 ? "won" : v < 0 ? "lost" : "push";
}

// ---------- helpers ----------
function lum(hex) { const c = (hex || "#888").replace("#", ""); const f = i => { const v = parseInt(c.substr(i, 2), 16) / 255;
  return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }; return 0.2126 * f(0) + 0.7152 * f(2) + 0.0722 * f(4); }
const inkOf = hex => lum(hex) > 0.3 ? ["#14301f", ""] : ["#ffffff", "ink-light"];
function logo(t) { return `<img class="logo" src="${esc(t.logo)}" alt="${esc(t.abbr)}" onerror="this.outerHTML='<div class=&quot;code&quot;>${esc(t.abbr)}</div>'">`; }
const kickLab = s => new Date(s).toLocaleString("en-US", {weekday: "short", hour: "numeric", minute: "2-digit", timeZone: "America/New_York"});
function empty(e, t, s) { return `<div class="card empty"><div class="e">${e}</div><div class="t">${esc(t)}</div><div class="note">${esc(s)}</div></div>`; }
function bet(o) { BETS.push(o); return BETS.length - 1; }
function label(g, b) {
  const t = b.s === "home" ? g.home : g.away;
  if (b.m === "ml") return `${t.abbr} win`;
  if (b.m === "spread") return `${t.abbr} ${sp(b.line)}`;
  return `${b.s === "over" ? "Over" : "Under"} ${b.line}`;
}
const duo = (g, big) => `<span class="duo ${big ? "duo-b" : ""}"><img src="${esc(g.away.logo)}" alt="" onerror="this.remove()"><img src="${esc(g.home.logo)}" alt="" onerror="this.remove()"></span>`;
const tlabel = (g, b) => (b.m === "total" ? duo(g) : "") + esc(label(g, b));
function mkBets(g) {   // attach line numbers (home handicap = −spread) to the exported model-vs-market rows
  return g.bets.map(b => Object.assign({}, b, {line: b.m === "spread" ? (b.s === "home" ? -g.spread : g.spread) : b.m === "total" ? g.total_line : null}));
}
function tile(g, b) {
  const cls = settle(g, b), val = b.edge != null && b.edge >= D.meta.edge_flag;
  const i = bet({g, b, p: b.p, label: label(g, b)});
  const ic = cls === "won" ? "✅ " : cls === "lost" ? "❌ " : cls === "push" ? "➖ " : "";
  return `<button class="tile ${cls} ${val ? "val" : ""}" data-bet="${i}"><span class="l">${ic}${tlabel(g, b)}</span>

// ---------- games ----------
function gameCard(g) {

  const bets = mkBets(g);
  // one column per market: market line big, the model's own number small, an edge tag only when it's real
  const best = m => bets.filter(b => b.m === m).sort((x, y) => (y.edge ?? -9) - (x.edge ?? -9))[0];
  const fav = g.spread >= 0 ? h : a, favLine = Math.abs(g.spread);
  const modelFav = g.model_margin >= 0 ? h : a;
  const N = g.news || {};
  const newsTag = (v, unit) => v != null && Math.abs(v) >= 0.5 ? `<span class="mn">${unit} ${v > 0 ? "+" : "−"}${Math.abs(v).toFixed(1)} since line</span>` : "";
  const col = (title, main, sub, b, extra = "") => {
    const e = b && b.edge != null && b.edge >= LIKE_EDGE, i = b ? bet({g, b, p: b.p, label: label(g, b)}) : null;
    const res = b ? settle(g, b) : "";
    return `<button class="mcol ${e ? "hot" : ""}" ${i != null ? `data-bet="${i}"` : ""}><span class="mt">${title}</span><span class="mm">${main}</span><span class="ms">${sub}</span>${extra}
      ${e ? `<span class="me ${res}">${res === "won" ? "✅ " : res === "lost" ? "❌ " : ""}${esc(b.m === "total" ? (b.s === "over" ? "Over" : "Under") : b.m === "ml" ? (b.s === "home" ? h.abbr : a.abbr) : label(g, b))} +${(100 * b.edge).toFixed(0)}%</span>` : `<span class="me none">no edge</span>`}</button>`; };
  const mkt = bets.find(b => b.m === "ml" && b.s === "home");
  const mlFav = (mkt && mkt.mkt != null ? mkt.mkt : ph) >= 0.5 ? h : a, mlP = mlFav === h ? (mkt && mkt.mkt != null ? mkt.mkt : ph) : 1 - (mkt && mkt.mkt != null ? mkt.mkt : ph);
  let html = `<div class="card gc" style="background:linear-gradient(170deg, ${a.color} 0%, ${a.color} 22%, ${h.color} 62%, ${h.color} 100%)">

    ${trow(a, 1 - ph, s && s.away, s && s.home, ia, ca)}${trow(h, ph, s && s.home, s && s.away, ih, ch)}</div>
    <div class="body"><div class="mk3">
      ${col("Spread", favLine ? `${esc(fav.abbr)} −${favLine}` : "Pick'em", `model ${esc(modelFav.abbr)} −${Math.abs(Math.round(2 * g.model_margin) / 2)}`, best("spread"), newsTag(N.m != null ? N.m : null, "🚑 " + esc(h.abbr)))}
      ${col("Total", `O/U ${g.total_line}`, `model ${g.model_total.toFixed(1)}`, best("total"), newsTag(N.t, "🌦️"))}
      ${col("To win", `${esc(mlFav.abbr)} ${pct(mlP)}`, `model ${esc(ph >= 0.5 ? h.abbr : a.abbr)} ${pct(Math.max(ph, 1 - ph))}`, best("ml"))}
    </div>`;

      .map(([k, n]) => `<button class="${view === k ? "on" : ""}" data-pv="${g.game_id}|${k}">${n}</button>`).join("");
    const body = view === "bets" ? `<div class="tiles">${bets.map(b => tile(g, b)).join("")}</div>${altHtml(g)}`
      : view === "matchup" ? matchupHtml(g) : view === "players" ? gamePlayers(g) : view === "field" ? fieldHtml(g) : scoreHtml(g);
    html += `<div class="panel"><div class="ptabs">${tabs}</div>${body}</div>`;
  }
  return html + `<button class="more" data-more="${g.game_id}">${OPEN.has(g.game_id) ? "Less ▴" : "More ▾"}</button></div></div>`;
}

  document.querySelectorAll("[data-cs]").forEach(b => b.onclick = () => { C.side = b.dataset.cs; C.line = null; render(); });
  $("#cl") && ($("#cl").onchange = e => { C.line = Math.round(2 * Number(e.target.value.replace("−", "-"))) / 2; render(); });
  $("#cgo") && ($("#cgo").onclick = () => { const G = g(), b = {m: C.m, s: C.side, line: C.m === "ml" ? null : Number(C.line)};
    const p = C.m === "ml" ? prob(G, "ml", C.side) : prob(G, C.m, C.side, b.line); openSheet({g: G, b, p, label: label(G, b)}); });
}

// ---------- sheet ----------
function openSheet(o) {
  const pr = o.b.price, own = o.b.src && o.b.src !== "Mkt" && o.b.src !== "Line" && pr;
  SH = {o, sign: own ? (pr < 0 ? -1 : 1) : (fair(o.p) < 0 ? -1 : 1), num: own ? String(Math.abs(Math.round(pr))) : ""};
  drawSheet(); $("#scrim").classList.add("open"); $("#sheet").classList.add("open");
}
function closeSheet() { $("#scrim").classList.remove("open"); $("#sheet").classList.remove("open"); SH = null; PSH = null; }
function verdictHtml(p, o) {
  const book = implied(o) / 1.0225, edge = p - book, ev = p * (decimal(o) - 1) * 100 - (1 - p) * 100;
  const [cls, v] = edge >= THR ? ["good", "✅ Bet it"] : edge > 0 ? ["meh", "🤏 Small edge, pass or bet small"] : ["bad", "❌ Pass"];
  return `<div class="verdict ${cls}"><div class="h">${v}</div><div class="d">Model ${pct(p)} vs ${esc(BOOK())} ${pct(book)} · edge ${(edge >= 0 ? "+" : "") + (100 * edge).toFixed(1)} pts · ${ev >= 0 ? "+" : "−"}$${Math.abs(ev).toFixed(2)} per $100</div></div>`;
}
function drawSheet() {
  if (!SH) return;
  const o = SH.o, g = o.g, odds = SH.num ? SH.sign * Number(SH.num) : NaN;
  const mk = o.b.mkt != null ? `<div class="hint">Market (median no-vig across ${g.n_books || "the"} books): ${pct(o.b.mkt)} → model ${o.b.edge >= 0 ? "+" : "−"}${Math.abs(100 * o.b.edge).toFixed(1)} pts.</div>` : "";
  $("#sheet").innerHTML = `<div class="grab"></div><button class="iconbtn close" id="shx" aria-label="Close">✕</button>
    <div class="sh-t">${esc(o.label)}</div><div class="sh-s">${esc(g.away.city)} ${esc(g.away.name)} @ ${esc(g.home.city)} ${esc(g.home.name)}</div>
    <div class="kpis"><div class="kpi"><div class="k">Chance</div><div class="n">${pct(o.p)}</div></div><div class="kpi"><div class="k">Fair</div><div class="n">${am(fair(o.p))}</div></div>
      <div class="kpi g"><div class="k">Bet at</div><div class="n">${am(fair(o.p - THR))}</div></div></div>${mk}
    <div class="sh-s" style="margin:10px 0 6px">Other odds? (optional)</div>
    <div class="oddsrow"><div class="sign"><button data-s="1" class="${SH.sign > 0 ? "on" : ""}">+</button><button data-s="-1" class="${SH.sign < 0 ? "on" : ""}">−</button></div>
      <input class="odds" id="odds" inputmode="numeric" pattern="[0-9]*" placeholder="110" value="${esc(SH.num)}"></div>
    <div id="vd">${isFinite(odds) && Math.abs(odds) >= 100 ? verdictHtml(o.p, odds) : `<div class="hint">Type a price only to check it against the model; bets use the live book price below.</div>`}</div>
    ${mbTrackHtml(o.b.price || Math.round(fair(o.p)))}`;
  $("#shx").onclick = closeSheet;
  mbWireTrack(() => SH && SH.num ? SH.sign * Number(SH.num) : NaN, o.b.price || Math.round(fair(o.p)),
    () => ({sport: "NFL", kind: "single", label: o.label,
            legs: [{label: o.label, sub: `${g.away.abbr} @ ${g.home.abbr}`, gid: g.game_id, start: g.start_utc, p: o.p, logos: [g.away.logo, g.home.logo], key: {t: "game", m: o.b.m, s: o.b.s, l: o.b.line}}]}));
  $("#sheet").querySelectorAll("[data-s]").forEach(x => x.onclick = () => { SH.sign = Number(x.dataset.s); drawSheet(); });
  $("#odds").oninput = e => { SH.num = e.target.value.replace(/[^0-9]/g, ""); const o2 = SH.sign * Number(SH.num);
    $("#vd").innerHTML = SH.num && Math.abs(o2) >= 100 ? verdictHtml(o.p, o2) : `<div class="hint">Keep typing… (American odds, e.g. -110)</div>`; };
}
function openInfo() {
  const b = D.meta.backtest || {}, f = x => x ? `${(100 * x[0]).toFixed(1)}% (${x[1]} games)` : "–";
  $("#sheet").innerHTML = `<div class="grab"></div><button class="iconbtn close" id="shx" aria-label="Close">✕</button>
    <div class="sh-t">How it works</div>
    <div class="hint" style="font-size:14.5px">Teams are rated on opponent-adjusted <b>EPA per play</b> (expected points added) from nflverse play-by-play, plus points, with recent games weighted more. The starting QB is checked against the team's usual QB play, and a ruled-out starter is swapped for his backup. Injured starters elsewhere (from ESPN's injury list, 40%+ snap players) cost about ${(D.meta.pts_per_starter || 0.85).toFixed(1)} points each. That gives the model's own margin and total. Prices then start from the market and move toward the model only as far as it has earned in testing (about ${Math.round(100 * ((D.meta.blend || {}).total || 0))}% on totals, ${Math.round(100 * ((D.meta.blend || {}).side || 0))}% on sides), and final scores are spread around them with the real bumps on <b>3 and 7</b>. Tiles show the model's chance and the market's (median no-vig across US books${D.games.some(g => g.src === "odds") ? "" : "; posted lines until odds are pulled"}).</div>
    <div class="sec">Backtest vs closing lines, ${esc(D.meta.backtest_seasons || "")}</div>
    <div class="kv"><div><span>Margin error: model / close</span><b>${(b.mae_model || 0).toFixed(2)} / ${(b.mae_line || 0).toFixed(2)}</b></div>
      <div><span>Total error: model / close</span><b>${(b.tmae_model || 0).toFixed(2)} / ${(b.tmae_line || 0).toFixed(2)}</b></div>
      <div><span>ATS, model off close by 3+</span><b>${f(b.ats_3)}</b></div><div><span>O/U, model off close by 3+</span><b>${f(b.ou_3)}</b></div></div>
    <div class="hint">Closing lines are sharper than this model (52.4% is break-even at -110). Use it to spot numbers worth a look early in the week and to price alt lines, not as a betting system on its own.</div>
    <div class="hint">Data through ${esc(D.meta.data_through)}${D.meta.odds_at ? ` · odds pulled ${new Date(D.meta.odds_at).toLocaleString("en-US", {weekday: "short", hour: "numeric", minute: "2-digit", timeZone: "America/New_York"})} ET` : ""}.</div>`;
  $("#shx").onclick = closeSheet;
  $("#scrim").classList.add("open"); $("#sheet").classList.add("open");
}

// ---------- shell ----------
function header() {
  const m = D.meta;
  $("#title").textContent = m.week ? `Week ${m.week}` : "NFL";
  let sub = `${D.games.length} games`;
  if (m.generated_at) sub += " · ↻ " + new Date(m.generated_at).toLocaleString("en-US", {hour: "numeric", minute: "2-digit", timeZone: "America/New_York"});
  $("#sub").textContent = sub;
}
function strip() {
  let h = "";
  const st = D.games.map(g => (scoreOf(g) || {}).state), nl = st.filter(x => x === "in").length, nf = st.filter(x => x === "post").length;
  if (TAB === "games") {
    if (nl) h += `<span class="chip" style="background:var(--red-soft)">🔴 ${nl} live</span>`;
    if (nf) h += `<span class="chip">🏁 ${nf} final</span>`;
    h += `<span class="chip info">${D.games.some(g => g.src === "odds") ? "📊 market consensus" : "📊 posted lines"}</span>`;
  }
  $("#strip").innerHTML = h; $("#strip").style.display = h ? "" : "none";
}
function nav() {
  const T = [["games", "🏈 Games"], ["props", "👤 Props"], ["check", "🎟️ Bets"], ["updates", "📰 Updates"]];
  $("#nav").innerHTML = T.map(([k, n]) => `<button class="${TAB === k ? "on" : ""}" data-k="${k}">${n}</button>`).join("");
  $("#nav").querySelectorAll("button").forEach(b => b.onclick = () => { TAB = b.dataset.k; render(); window.scrollTo(0, 0); });
}
// 📝 paper bets: game lines grade from final scores; NFL props are settled by hand (no box scores on this page)
const MB_PAGE = "NFL";
function mbGrade(leg) {
  const k = leg.key || {};
  const g = D.games.find(x => x.game_id === leg.gid); if (!g) return undefined;
  if (k.t === "prop") { const L = scoreOf(g); if (!L || L.state !== "post" || !(NBOX[g.game_id] || {}).final) return undefined;
    const v = boxStat(g.game_id, k); if (v == null) return undefined;   // not in the box score (inactive or no touches): settle by hand
    const d = (k.dir || "over") === "over" ? v - k.l : k.l - v; return d > 0 ? true : d < 0 ? false : "push"; }
  if (k.t !== "game") return undefined;
  const r = settle(g, {m: k.m, s: k.s, line: k.l});
  return r === "won" ? true : r === "lost" ? false : r === "push" ? "push" : undefined;
}
// DraftKings prop prices published with the page (over and under)
function mbPropOdds(leg) {
  const k = leg.key || {}, p = (D.players || []).find(x => String(x.id) === String(k.pid)); if (!p || !p.dk) return null;
  const x = p.dk[`${k.mk}|${k.mk === "td" ? 0.5 : k.l}`], o = x && ((k.dir || "over") === "over" ? x.o : x.u);
  return o != null ? {odds: o, book: D.meta.props_book || "DraftKings"} : null;
}
function mbArtFor(leg) {   // logos / headshot for bets saved without them
  const k = leg.key || {}, g = D.games.find(x => x.game_id === leg.gid);
  if (k.t === "prop") { const p = (D.players || []).find(x => x.id === k.pid); return p ? {img: p.headshot, logo: teamOf(p.team).logo, name: p.name} : {logo: teamOf(k.team).logo, name: k.name}; }
  return g ? {logos: [g.away.logo, g.home.logo]} : null;
}
function mbLiveLeg(leg) {
  const g = D.games.find(x => x.game_id === leg.gid); if (!g) return null;
  const L = scoreOf(g) || LIVE[g.game_id] || {}, k = leg.key || {}; let cur = null, unit = "";
  if (k.t === "prop") { const v = boxStat(g.game_id, k); cur = v == null ? (v === null && L.state === "in" ? 0 : null) : v;
    unit = {rec: "catches", rec_yds: "rec yds", rush_yds: "rush yds", pass_yds: "pass yds", td: "TD"}[k.mk] || ""; }
  return {state: L.state || "pre", detail: L.detail, start: g.start_utc, home: L.home || 0, away: L.away || 0, homeAbbr: g.home.abbr, awayAbbr: g.away.abbr, cur, unit};
}
function render() {
  try { mbAutoSettle("NFL", mbGrade); } catch (e) {}
  BETS = []; header(); strip(); nav();
  $("#view").innerHTML = {games, props, teams, check, updates}[TAB]();
  document.querySelectorAll("[data-uf]").forEach(b => b.onclick = () => { UF = b.dataset.uf; render(); });
  document.querySelectorAll("[data-hv]").forEach(b => b.onclick = () => { HV = b.dataset.hv; render(); });
  if (TAB === "updates" && HV === "health") wireHealth(render);
  document.querySelectorAll("[data-iexp]").forEach(b => b.onclick = () => { const k = b.dataset.iexp; IEXP.has(k) ? IEXP.delete(k) : IEXP.add(k); render(); });
  document.querySelectorAll("[data-goinj]").forEach(b => b.onclick = () => { TAB = "updates"; UF = "injury"; render(); window.scrollTo(0, 0); });
  document.querySelectorAll("[data-fm]").forEach(b => b.onclick = e => { e.stopPropagation(); const [id, k, v] = b.dataset.fm.split("|"); FORM[id][k] = v; render(); });
  if (TAB === "check") wireCheck();
  if (TAB === "props") { wireProps(); wireMix(render, m => { PMODE = m; }); }
  $("#view").querySelectorAll("[data-pp]").forEach(el => el.onclick = e => { e.stopPropagation(); const [id, gid, m] = el.dataset.pp.split("|"); openPlayer(id, gid, m); });
  $("#view").querySelectorAll("[data-golucky]").forEach(el => el.onclick = () => { PS.m = "lucky"; TAB = "props"; render(); window.scrollTo(0, 0); });
  $("#view").querySelectorAll("[data-allprops]").forEach(el => el.onclick = () => { PS.game = el.dataset.allprops; PS.q = ""; TAB = "props"; render(); window.scrollTo(0, 0); });
  document.querySelectorAll("[data-ts]").forEach(b => b.onclick = () => { TSORT = b.dataset.ts; render(); });
  $("#view").querySelectorAll("[data-bet]").forEach(el => el.onclick = e => { e.stopPropagation(); openSheet(BETS[Number(el.dataset.bet)]); });
  $("#view").querySelectorAll("[data-pv]").forEach(el => el.onclick = () => { const [id, k] = el.dataset.pv.split("|"); PANEL[id] = k; render(); });
  $("#view").querySelectorAll("[data-more]").forEach(el => el.onclick = () => { const id = el.dataset.more; OPEN.has(id) ? OPEN.delete(id) : OPEN.add(id); render(); });
  mbAfterRender(render);
}
$("#scrim").onclick = closeSheet;
$("#infoBtn").onclick = () => D && openInfo();
function openWeights() {
  $("#sheet").innerHTML = `<div class="grab"></div><button class="iconbtn close" id="shx" aria-label="Close">✕</button>
    <div class="sh-t">⚙️ How the model is weighted</div>${weightsHtml((D.meta || {}).weights)}`;
  $("#shx").onclick = closeSheet;
  $("#scrim").classList.add("open"); $("#sheet").classList.add("open"); $("#sheet").scrollTop = 0;
}
$("#gearBtn").onclick = () => D && openWeights();
fetch("nfl.json?v=" + Date.now()).then(r => r.json()).then(async d => {
  D = d; render(); await loadLive(); await loadBoxes(); render();
  setInterval(async () => { if (D.games.some(g => (LIVE[g.game_id] || {}).state === "in")) { await loadLive(); await loadBoxes(); render(); } }, 60000);
}).catch(e => { $("#title").textContent = "NFL"; $("#sub").textContent = "This week's prices aren't published yet."; });
</script>
