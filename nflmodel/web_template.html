<style>
:root {

// ---------- live scores (ESPN) ----------

          if (grp.name === "passing") { o.pass_yds = get("passingYards"); o.pass_td = get("passingTouchdowns"); }

                  weather: "🌦️ Weather", price: "💲 Model", line: "📊 Market", model: "⚙️ Settings", data: "📥 Data"};

  const segs = [["net", "Overall"], ["off", "Offense"], ["dfn", "Defense"], ["pas", "Passing"], ["pts", "Points"]];
  return `<div class="strip" style="padding-left:0">${segs.map(([k, n]) => `<button class="chip ${TSORT === k ? "on" : ""}" data-ts="${k}">${n}</button>`).join("")}</div>
    <div class="card">${T.map(t => { const v = t[TSORT] || 0, w = 50 * Math.abs(v) / mx;
      return `<div class="tr2"><span class="n">${t.rank[TSORT]}</span>${logo(t)}<div style="min-width:0"><b>${esc(t.city)} ${esc(t.name)}</b>
        <div class="s">${esc(t.record)} · off #${t.rank.off} · def #${t.rank.dfn}</div></div>
        <div class="nbar"><div style="width:${v < 0 ? 50 - w : 50}%"></div><div style="width:${w}%;background:${v >= 0 ? t.color : "#c9c1b0"}"></div></div></div>`; }).join("")}
    <div class="hint">Opponent-adjusted EPA per play (offense minus defense), recent games weighted more, last season still counts early on.</div></div>`;
}

// ---------- shell ----------
function header() {
  const m = D.meta;
  $("#title").textContent = m.week ? `Week ${m.week}` : "NFL";
  let sub = "NFL";
  if (m.generated_at) sub += " · ↻ " + new Date(m.generated_at).toLocaleString("en-US", {hour: "numeric", minute: "2-digit", timeZone: "America/New_York"});
  $("#sub").textContent = sub;
}
function strip() {
  let h = "";
  const st = D.games.map(g => (scoreOf(g) || {}).state), nl = st.filter(x => x === "in").length, nf = st.filter(x => x === "post").length;
  if (TAB === "games") {
    if (nl) h += `<span class="chip" style="background:var(--red-soft)">🔴 ${nl} live</span>`;
    if (nf) h += `<span class="chip">🏁 ${nf} final</span>`;
  }

}
const pTD = (p, l) => l === 0.5 ? 1 - Math.exp(-p.lam_td) : 1 - Math.exp(-p.lam_td) * (1 + p.lam_td);
// ---------- 📊 projections adapter (the shared engine in calib/web/proj.js draws the screens) ----------
function modelLine(g) { const m = g.margin; if (Math.abs(m) < 0.25) return "Pick'em"; return `${m > 0 ? g.home.abbr : g.away.abbr} −${Math.abs(Math.round(2 * m) / 2)}`; }
function oneScore(g) { const d = g.mpmf; if (!d || !d.p) return null; let s = 0; for (let k = -8; k <= 8; k++) s += d.p[k - d.lo] || 0; return s; }
// a player's main yardage market (QB passing, else receiving or rushing, whichever is bigger), and a sort key that puts them on one scale
const yk = p => p.vals.pass_yds ? "pass_yds" : (p.vals.rec_yds && (!p.vals.rush_yds || p.vals.rec_yds.v >= p.vals.rush_yds.v)) ? "rec_yds" : p.vals.rush_yds ? "rush_yds" : null;
const ys = p => { const k = yk(p); return k ? p.vals[k].v / (k === "pass_yds" ? 3 : 1) : -1; };
function nGame(g) {
  const s = scoreOf(g), st = !s ? "pre" : s.state === "in" ? "live" : "final", W = g.weather || {};
  const sub = t => esc(t.qb ? t.qb.split(" ").slice(-1)[0] : "QB TBD");
  const v = {id: g.game_id, state: st, time: kickLab(g.start_utc), detail: s && s.detail, ph: g.p_home, lph: null,
    a: Object.assign({}, g.away, {sub: sub(g.away)}), h: Object.assign({}, g.home, {sub: sub(g.home)}),
    sa: Math.round(g.pts_away), sh: Math.round(g.pts_home), total: g.total, totalTxt: `${g.total.toFixed(1)} pts`,
    score: st === "pre" ? null : {a: s.away ?? 0, h: s.home ?? 0},
    note: W.icon ? `${W.icon}${W.temp != null ? " " + Math.round(W.temp) + "°" : ""}${W.wind >= 12 ? " · " + Math.round(W.wind) + " mph" : ""}` : (g.neutral ? "Neutral site" : ""),
    stats: [["Total", `${g.total.toFixed(1)} pts`], ["Line", modelLine(g)], ["One score", oneScore(g) != null ? pct(oneScore(g)) : "–"], ["Venue", g.roof === "dome" || g.roof === "closed" ? "Indoors" : "Outdoors"]]};
  if (st === "final") v.hit = (s.home > s.away) === (g.p_home >= 0.5);
  return v;
}
const NMK = {td: {lab: "to score"}, rec_yds: {L: 49.5, lab: "50+ yds"}, rush_yds: {L: 49.5, lab: "50+ yds"}, pass_yds: {L: 249.5, lab: "250+ yds"}, rec: {L: 3.5, lab: "4+ catches"}};
function nPlayer(p) {
  const t = teamOf(p.team), g = gameOf(p), live = g && scoreOf(g) ? (k => { const v = boxStat(g.game_id, {name: p.name, mk: k}); return v == null ? null : v; }) : () => null;
  const ok = {td: p.role !== "QB" || p.lam_td > 0.12, rec_yds: p.role !== "QB" && p.rec_yds >= 8, rush_yds: p.rush_yds >= 8, pass_yds: p.pass_yds != null, rec: p.role !== "QB" && p.rec >= 1};
  const val = (k, v, txt) => !ok[k] ? null : {v, txt, chance: k === "td" ? p.p_td : pOver(p, k, NMK[k].L), chanceLab: NMK[k].lab, live: live(k)};
  return {id: p.id, gid: p.game_id, name: p.name, team: p.team, pos: p.pos, img: p.headshot, logo: t.logo, color: t.color,
    meta: `${p.team} · ${p.pos}${g ? ` · ${g.home.abbr === p.team ? "vs" : "@"} ${p.opp}` : ""}${p.status ? " · " + ST(p.status) : ""}`,
    vals: {td: val("td", p.p_td, pct(p.p_td)), rec_yds: val("rec_yds", p.rec_yds, Math.round(p.rec_yds || 0)), rush_yds: val("rush_yds", p.rush_yds, Math.round(p.rush_yds || 0)),
           pass_yds: val("pass_yds", p.pass_yds, Math.round(p.pass_yds || 0)), rec: val("rec", p.rec, (p.rec || 0).toFixed(1))}};
}
PJA = {
  sport: "NFL", sheetNote: "The model's projection for this week: target and carry share, the team's projected plays, the opponent, the starting QB and the weather.", totalLabel: "Highest total", topLabel: "Likeliest touchdown scorers", gamesLabel: "This week's games",
  markets: [{k: "td", label: "TDs", unit: "to score", note: "Chance to score a touchdown"},
            {k: "rec_yds", label: "Rec yds", unit: "proj yds", note: "Projected receiving yards · bar = chance of 50+"},
            {k: "rush_yds", label: "Rush yds", unit: "proj yds", note: "Projected rushing yards · bar = chance of 50+"},
            {k: "pass_yds", label: "Pass yds", unit: "proj yds", note: "Projected passing yards · bar = chance of 250+"},
            {k: "rec", label: "Catches", unit: "proj rec", note: "Projected receptions · bar = chance of 4+"}],
  kicker: () => `NFL · ${D.meta.week ? "Week " + D.meta.week : "This week"}`,
  header, strip,
  games: () => byStatus(D.games).map(nGame),

  top: () => (D.players || []).filter(p => p.role !== "QB" && nflOpen(gameOf(p))).sort((x, y) => y.p_td - x.p_td).slice(0, 8).map(p => ({p: nPlayer(p), mk: "td"})),
  panels: gm => { const g = D.games.find(x => String(x.game_id) === String(gm.id));
    const P = (D.players || []).filter(p => p.game_id === g.game_id).map(nPlayer), top = mk => P.filter(p => p.vals[mk]).sort((x, y) => y.vals[mk].v - x.vals[mk].v).slice(0, 5);
    return [{k: "matchup", label: "Matchup", html: () => matchupHtml(g)},
      {k: "players", label: "Players", html: () => `<div class="xmk-sec">Touchdown chances</div><div class="pj-mini">${top("td").map(p => pjPlayerRow(p, "td")).join("")}</div>
        <div class="xmk-sec">Yardage leaders</div><div class="pj-mini">${P.filter(yk).sort((x, y) => ys(y) - ys(x)).slice(0, 5).map(p => pjPlayerRow(p, yk(p))).join("")}</div>`},
      {k: "field", label: "Formation", html: () => fieldHtml(g)},
      {k: "margin", label: "Margin", html: () => scoreHtml(g)}]; },
  playerLines: id => { const p = (D.players || []).find(x => String(x.id) === String(id)); if (!p) return [];
    const out = [["Anytime TD", pTD(p, 0.5)], ["2+ TDs", pTD(p, 1.5)]];
    if (p.pass_yds != null) for (const L of [199.5, 249.5, 299.5]) out.push([`${L + 0.5}+ pass yds`, pOver(p, "pass_yds", L)]);
    if (p.rush_yds >= 8) for (const L of [24.5, 49.5, 74.5, 99.5]) out.push([`${L + 0.5}+ rush yds`, pOver(p, "rush_yds", L)]);
    if (p.role !== "QB" && p.rec_yds >= 8) for (const L of [24.5, 49.5, 74.5, 99.5]) out.push([`${L + 0.5}+ rec yds`, pOver(p, "rec_yds", L)]);
    if (p.role !== "QB" && p.rec >= 1) for (const L of [2.5, 4.5, 6.5]) out.push([`${L + 0.5}+ catches`, pOver(p, "rec", L)]);
    return out; },
  record: () => { const fin = D.games.filter(g => { const s = scoreOf(g); return s && s.state === "post"; }); if (!fin.length) return "";
    const w = fin.filter(g => { const s = scoreOf(g); return (s.home > s.away) === (g.p_home >= 0.5); }).length;
    return `<button class="card pj-rec" data-go="model"><span class="pj-rr"><b>${w}/${fin.length}</b><i>favourites won</i></span><span><b>Model check</b><i>Power ratings, calibration and every update</i></span><span class="chev">›</span></button>`; },
  modelHtml: () => updates() + `<div class="hx-h" style="margin:22px 2px 10px"><b>Power ratings</b></div>` + teams(),
  modelWire: render => {
    document.querySelectorAll("[data-info]").forEach(b => b.onclick = () => D && openInfo());
    document.querySelectorAll("[data-weights]").forEach(b => b.onclick = () => D && openWeights());
    document.querySelectorAll("[data-uf]").forEach(b => b.onclick = () => { UF = b.dataset.uf; render(); });
    document.querySelectorAll("[data-hv]").forEach(b => b.onclick = () => { HV = b.dataset.hv; render(); });
    document.querySelectorAll("[data-iexp]").forEach(b => b.onclick = () => { const k = b.dataset.iexp; IEXP.has(k) ? IEXP.delete(k) : IEXP.add(k); render(); });
    document.querySelectorAll("[data-ts]").forEach(b => b.onclick = () => { TSORT = b.dataset.ts; render(); });
    if (HV === "health") wireHealth(render); },
  after: render => {
    document.querySelectorAll("#view [data-fm]").forEach(b => b.onclick = e => { e.stopPropagation(); const [id, k, v] = b.dataset.fm.split("|"); FORM[id][k] = v; render(); });
    document.querySelectorAll("#view [data-pp]").forEach(el => el.onclick = e => { e.stopPropagation(); pjOpenPlayer(el.dataset.pp.split("|")[0]); });
    document.querySelectorAll("#view [data-goinj]").forEach(b => b.onclick = () => { TAB = "model"; UF = "injury"; render(); window.scrollTo(0, 0); });
  },
};
function openInfo() {
  pjSheet(`<div class="sh-t">How it works</div>
    <div class="hint" style="font-size:14.5px">MikeModels rates every team on opponent-adjusted efficiency (offense, defense, passing), adjusts for the starting quarterback, injuries, rest, travel and kickoff weather,
    and turns that into a full distribution of final margins and totals: win chances, projected scores and the likeliest outcomes. Player projections come from each player's share of targets and carries, the team's projected plays and the opponent.
    Data refresh several times a day; the model re-fits weekly and checks its own calibration (Model tab).</div>`);

function render() { pjRender(); }
$("#scrim").onclick = closeSheet;
$("#updBtn").onclick = () => { if (!D) return; pjGo(TAB === "model" ? "home" : "model"); };

const darkLogo = u => !u ? u : u.replace("/500/", "/500-dark/");
document.addEventListener("error", e => { const el = e.target; if (!el || el.tagName !== "IMG") return; const s0 = el.getAttribute("src") || "";
  if (s0.includes("/500-dark/")) { e.stopImmediatePropagation(); e.stopPropagation(); el.src = s0.replace("/500-dark/", "/500/"); } }, true);
fetch("nfl.json?v=" + Date.now()).then(r => r.json()).then(async d => {
  for (const g of d.games || []) for (const t of [g.home, g.away]) if (t) t.logo = darkLogo(t.logo);
