<script>
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const pct = p => (p == null || isNaN(p)) ? "–" : Math.round(100 * p) + "%";
const am = x => (x == null || !isFinite(x)) ? "–" : (x > 0 ? "+" : "") + Math.round(x);
const fair = p => { p = Math.min(Math.max(p, 1e-9), 1 - 1e-9); return p >= 0.5 ? -100 * p / (1 - p) : 100 * (1 - p) / p; };
const sp = x => x == null ? "" : (x > 0 ? "+" : x < 0 ? "−" : "") + Math.abs(x);
const THR = 0.025;
let D = null, TAB = "home", LIVE = {};
const OPEN = new Set(), PANEL = {};
// ---------- pricing from the exported distributions (mirrors nflmodel.model) ----------
function dist(g, m) { return m === "total" ? g.tpmf : g.mpmf; }
function prob(g, m, side, line) {
  // returns win chance with pushes removed: ml, spread (line = home handicap, e.g. -3.5), total (line = points)
  if (m === "ml") { const ph = g.p_home; return side === "home" ? ph : 1 - ph; }
  // spread lines are the handicap of the side asked about (home -3.5 / away +3.5)
  const d = dist(g, m); let over = 0, push = 0, under = 0;
  const cut = m === "total" ? line : (side === "home" ? -line : line);    // home covers -3.5 when margin > 3.5
  d.p.forEach((p, i) => { const k = d.lo + i; if (k > cut) over += p; else if (k === cut) push += p; else under += p; });
  const pf = over / Math.max(over + under, 1e-9);
  return (side === "home" || side === "over") ? pf : 1 - pf;
}
function pushP(g, m, line, side) { if (m === "ml") return 0; const d = dist(g, m), cut = m === "total" ? line : (side === "home" ? -line : line); return d.p[cut - d.lo] || 0; }

// ---------- live scores (ESPN) ----------
const ESPN_FIX = {LAR: "LA", WSH: "WAS"};
async function loadLive() {
  try {
    const r = await (await fetch("https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard")).json();
    for (const ev of r.events || []) {
      const c = ev.competitions[0], tm = {}; c.competitors.forEach(x => tm[x.homeAway] = {abbr: ESPN_FIX[x.team.abbreviation] || x.team.abbreviation, score: Number(x.score)});
      const g = D.games.find(x => x.home.abbr === tm.home.abbr && x.away.abbr === tm.away.abbr); if (!g) continue;
      LIVE[g.game_id] = {espn: ev.id, state: ev.status.type.state, detail: ev.status.type.shortDetail, home: tm.home.score, away: tm.away.score,
                         poss: (c.situation || {}).possession, yard: (c.situation || {}).yardLine, down: (c.situation || {}).shortDownDistanceText};
    }
  } catch (e) {}
}
// box scores (ESPN game summary) for games with open prop bets: drives the sweat and grades NFL props at the final
const NBOX = {};
const nrm = s => String(s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/\b(jr|sr|ii|iii|iv)\b/g, "").replace(/[^a-z]/g, "");
async function loadBoxes() {
  let need;
  need = new Set(D.games.filter(g => { const L = LIVE[g.game_id]; return L && (L.state === "in" || L.state === "post"); }).map(g => g.game_id));
  await Promise.all([...need].map(async gid => {
    const L = LIVE[gid]; if (!L || !L.espn || L.state === "pre" || (NBOX[gid] && NBOX[gid].final)) return;
    try {
      const sm = await (await fetch("https://site.api.espn.com/apis/site/v2/sports/football/nfl/summary?event=" + L.espn)).json(), box = {};
      for (const team of (sm.boxscore || {}).players || []) for (const grp of team.statistics || []) {
        const k = grp.keys || [];
        for (const a of grp.athletes || []) {
          const v = a.stats || [], get = key => { const i = k.indexOf(key); return i < 0 ? 0 : Number(String(v[i]).split("/")[0]) || 0; };
          const o = box[nrm((a.athlete || {}).displayName)] = box[nrm((a.athlete || {}).displayName)] || {rec: 0, rec_yds: 0, rush_yds: 0, pass_yds: 0, td: 0, pass_td: 0};
          if (grp.name === "passing") { o.pass_yds = get("passingYards"); o.pass_td = get("passingTouchdowns"); }
          if (grp.name === "rushing") { o.rush_yds = get("rushingYards"); o.td += get("rushingTouchdowns"); }
          if (grp.name === "receiving") { o.rec = get("receptions"); o.rec_yds = get("receivingYards"); o.td += get("receivingTouchdowns"); }
        }
      }
      NBOX[gid] = {box, final: L.state === "post"};
    } catch (e) {}
  }));
}
function boxStat(gid, k) { const B = (NBOX[gid] || {}).box; if (!B) return undefined; const o = B[nrm(k.name)]; return o ? (k.mk === "td" ? o.td : o[k.mk]) : null; }
function scoreOf(g) { const L = LIVE[g.game_id]; if (L && (L.state === "in" || L.state === "post")) return L;
  if (g.result) return {state: "post", detail: "Final", home: g.result.home, away: g.result.away}; return null; }
function settle(g, b) {
  const s = scoreOf(g); if (!s || s.state !== "post") return "";
  const m = s.home - s.away, t = s.home + s.away; let v;
  if (b.m === "ml") v = b.s === "home" ? m : -m;
  else if (b.m === "spread") v = b.s === "home" ? m + b.line : b.line - m;
  else v = b.s === "over" ? t - b.line : b.line - t;
  return v > 0 ? "won" : v < 0 ? "lost" : "push";
}

// ---------- helpers ----------
function lum(hex) { const c = (hex || "#888").replace("#", ""); const f = i => { const v = parseInt(c.substr(i, 2), 16) / 255;
  return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }; return 0.2126 * f(0) + 0.7152 * f(2) + 0.0722 * f(4); }
const inkOf = hex => lum(hex) > 0.3 ? ["#14301f", ""] : ["#ffffff", "ink-light"];
function logo(t) { return `<img class="logo" src="${esc(t.logo)}" alt="${esc(t.abbr)}" onerror="this.outerHTML='<div class=&quot;code&quot;>${esc(t.abbr)}</div>'">`; }
const kickLab = s => new Date(s).toLocaleString("en-US", {weekday: "short", hour: "numeric", minute: "2-digit", timeZone: "America/New_York"});
function empty(e, t, s) { return `<div class="card empty"><div class="e">${e}</div><div class="t">${esc(t)}</div><div class="note">${esc(s)}</div></div>`; }
// missing starters: one line per team on the card, full list in the matchup panel
const ST = s => { s = String(s || ""); return /^out/i.test(s) ? "Out" : /^doubt/i.test(s) ? "Doubtful" : /^quest/i.test(s) ? "Q" : /reserve|^ir/i.test(s) ? "IR" : s; };
// ---------- updates: injuries and every adjustment, with filters ----------
const UPD_KIND = {all: "All", injury: "🚑 Injuries", qb: "🏈 QBs", teams: "📈 Teams", recal: "🎯 Props", record: "🧾 Record",
                  weather: "🌦️ Weather", price: "💲 Model", line: "📊 Market", model: "⚙️ Settings", data: "📥 Data"};
let UF = "all", IEXP = new Set();
const fmtT = t => new Date(t).toLocaleString("en-US", {weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit", timeZone: "America/New_York"}) + " ET";
function injuryCard() {
  const all = Object.values(D.injuries || {}).sort((a, b) => (a.inj_pts ?? 0) - (b.inj_pts ?? 0));
  if (!all.length) return "";
  const teams = all.filter(t => t.counted.length || t.qbs.length), full = all.filter(t => !t.counted.length && !t.qbs.length);
  const rows = teams.map(t => {
    const T = teamOf(t.abbr), open = IEXP.has(t.abbr);
    const c = t.counted.map(p => `${p.value >= 1.5 ? "⭐ " : ""}${esc(p.name)} <span class="x">${esc(p.pos)}</span> ${esc(ST(p.status))} <b class="neg">${p.pts.toFixed(1)}</b>`).join(" · ");
    const q = t.qbs.map(p => `🏈 ${esc(p.name)} (QB) ${esc(ST(p.status))}: ${esc(p.note)}`).join("<br>");
    const more = open && t.listed.length ? `<div class="x" style="margin-top:4px">Listed but not counted: ${t.listed.map(p => `${esc(p.name)} (${esc(p.pos)}, ${esc(ST(p.status))}: ${esc(p.note)})`).join("; ")}</div>` : "";
    return `<div class="it">${logo(T)}<div><b>${esc(T.city || "")} ${esc(T.name || t.abbr)}</b></div>
      <span class="pill ${t.inj_pts < -0.05 ? "neg" : ""}">${t.inj_pts < -0.05 ? t.inj_pts.toFixed(1) + " pts" : "full"}</span>
      <div class="ilist">${c || `<span class="x">No regulars out.</span>`}${q ? "<br>" + q : ""}${more}
      ${t.listed.length ? `<button class="link" style="padding:2px 0;margin:0;font-size:12px" data-iexp="${esc(t.abbr)}">${open ? "Hide" : `+${t.listed.length} more listed`}</button>` : ""}</div></div>`; }).join("");
  return `<div class="card"><div class="lk-h">🚑 Injury report · Week ${esc(D.meta.week || "")}</div>${rows || `<div class="hint">No regulars listed yet.</div>`}
    ${full.length ? `<div class="hint">✅ No regulars out: ${full.map(t => esc(t.abbr)).join(", ")}</div>` : ""}
    <div class="hint">Points = how much each absence moves the team's projected margin. A player counts for the snaps he has in the team's ratings (recent games weighted, like the ratings), so a starter who has played every week counts fully, someone already out for weeks or just traded in counts less. Out ×1, Doubtful ×0.99, Questionable ×0.33 (how often each actually sat, 2021-25). ⭐ = star: players count more by contract (cap share vs an average starter, from 0.5× up to 2.5×), which tested better than counting every starter the same. About ${(D.meta.pts_per_starter || 1).toFixed(2)} pts per full-time starter. Injured QBs are handled by starting the backup. Source: ${esc(D.meta.inj_source || "–")}.</div></div>`;
}
/*CALIB_JS*/
let HV = "feed";   // Updates tab: feed or model health
function hvSwitch() { return `<div class="hv"><button class="${HV === "feed" ? "on" : ""}" data-hv="feed">Feed</button><button class="${HV === "health" ? "on" : ""}" data-hv="health">Model health</button></div>`; }
function updates() {
  const links = `<div class="updlinks"><button data-info="1">How it works</button><button data-weights="1">Model weights</button></div>`;
  return links + updatesInner();
}
function updatesInner() {
  if (HV === "health") return hvSwitch() + healthHtml(D.calib, "NFL", (D.meta || {}).repo);
  const runs = D.updates || [];
  const kinds = Object.keys(UPD_KIND).filter(k => k === "all" || k === "injury" || runs.some(r => r.items.some(i => i.kind === k)));
  const chips = `<div class="strip" style="padding-left:0">${kinds.map(k => `<button class="chip ${UF === k ? "on" : ""}" data-uf="${k}">${UPD_KIND[k]}</button>`).join("")}</div>`;
  const MD = D.meta.model || {}, RC = D.meta.record || {}, RL = D.meta.recal || {};
    const recalRows = Object.entries(RL).map(([k, v]) => `<div><span>${esc(PM[k] || k)}</span><b>×${v.level.toFixed(3)} <span style="font-size:12px;color:var(--muted)">${v.n} games</span></b></div>`).join("");
  const m = D.meta, now = UF === "all" ? `<div class="card"><div class="lk-h">Right now</div><div class="kv" style="margin-top:8px">
      <div><span>Results through</span><b>${esc(m.data_through)}</b></div><div><span>Games fit</span><b>${MD.games_fit || "–"}</b></div>
      <div><span>Per missing starter</span><b>${(m.pts_per_starter || 0).toFixed(2)} pts</b></div><div><span>Injury source</span><b>${esc(m.inj_source || "–")}</b></div>
      ${MD.hfa != null ? `<div><span>Home-field edge</span><b>${MD.hfa.toFixed(2)} pts</b></div><div><span>League scoring</span><b>${MD.league_total ?? "–"} pts/game</b></div>` : ""}
</div>
      ${recalRows ? `<div class="sec">Prop recalibration (this season's results)</div><div class="kv">${recalRows}</div>` : ""}
      <div class="hint">Every run refits the team ratings, home-field edge, score spread, key numbers and injury value on all finished games (${MD.games_fit || "–"} so far), and recalibrates player props against this season's box scores, the same way the hockey model updates. Changes are logged below.</div></div>` : "";
  const list = runs.map(r => { const it = r.items.filter(i => UF === "all" || i.kind === UF); if (!it.length) return "";
    return `<div class="card upd"><div class="ut">${esc(fmtT(r.time))}</div>${it.map(i => `<div class="ui"><span>${i.icon}</span><span>${esc(i.text)}</span></div>`).join("")}</div>`; }).join("");
  return hvSwitch() + chips + now + (UF === "all" || UF === "injury" ? injuryCard() : "")
    + (list || `<div class="note" style="color:var(--muted)">No ${UF === "all" ? "" : UPD_KIND[UF].replace(/^\S+ /, "").toLowerCase() + " "}changes logged yet. They'll show here after the next runs.</div>`);
}

const MX = [["Offense", "off"], ["Passing", "pas"], ["Defense", "dfn"], ["Pass defense", "pdef"], ["Points rating", "pts"]];
function matchupHtml(g) {
  const A = D.teams[g.away.abbr] || {}, H = D.teams[g.home.abbr] || {}, a = g.away, h = g.home, ph = g.p_home, C = 2 * Math.PI * 42;
  const ring = `<div class="xring"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" class="xr-bg"/>
      <circle cx="50" cy="50" r="42" stroke="${esc(h.color)}" stroke-dasharray="${C * ph - 1.5} ${C}" transform="rotate(-90 50 50)"/>
      <circle cx="50" cy="50" r="42" stroke="${esc(a.color)}" stroke-dasharray="${C * (1 - ph) - 1.5} ${C}" transform="rotate(${-90 + 360 * ph} 50 50)"/></svg>
    <div class="xr-in"><b>${Math.round(g.pts_away)}<i>–</i>${Math.round(g.pts_home)}</b><span>proj score</span></div></div>`;
  const side = (t, p, al) => `<div class="xside ${al}">${logo(t)}<b>${pct(p)}</b><span>${esc(t.abbr)} win</span></div>`;
  const rows = MX.map(([lab, k]) => { const va = A[k] ?? 0, vh = H[k] ?? 0, sc = k === "pts" ? 8 : 0.15, ra = (A.rank || {})[k], rh = (H.rank || {})[k];
    const w = v => Math.max(4, Math.min(100, 100 * Math.abs(v) / sc)), better = ra != null && rh != null ? (ra < rh ? "a" : rh < ra ? "h" : "") : "";
    return `<div class="xrow"><span class="xv ${better === "a" ? "win" : ""}">#${ra ?? "–"}</span>
      <div class="xmid"><span class="xlab">${lab}</span><div class="xbars"><div class="xb l"><i style="width:${w(va)}%;background:${va >= 0 ? esc(a.color) : "#ff6b6b"};opacity:${better === "h" ? .45 : 1}"></i></div>
        <div class="xb"><i style="width:${w(vh)}%;background:${vh >= 0 ? esc(h.color) : "#ff6b6b"};opacity:${better === "a" ? .45 : 1}"></i></div></div></div>
      <span class="xv r ${better === "h" ? "win" : ""}">#${rh ?? "–"}</span></div>`; }).join("");
  const edges = MX.map(([lab, k]) => ({lab, d: ((H.rank || {})[k] ?? 16) - ((A.rank || {})[k] ?? 16)})).filter(x => Math.abs(x.d) >= 8).sort((x, y) => Math.abs(y.d) - Math.abs(x.d)).slice(0, 2)
    .map(x => `<span class="xchip" style="--c:${esc(x.d > 0 ? a.color : h.color)}"><i></i>${esc(x.d > 0 ? a.abbr : h.abbr)} ${x.lab.toLowerCase()}</span>`);
  const W = g.weather || {}, notes = [];
  if (W.icon && W.expo === "outdoor") notes.push(`${W.icon} ${W.temp != null ? Math.round(W.temp) + "°" : ""}${W.wind >= 12 ? " · wind " + Math.round(W.wind) : ""}`);
  if (g.neutral) notes.push("Neutral site");
  const qb = t => t.qb ? `<span class="xchip soft">🏈 ${esc(t.abbr)} ${esc(t.qb.split(" ").slice(-1)[0])}${t.qb_adj != null && Math.abs(t.qb_adj) >= 0.03 ? ` <b class="${t.qb_adj < 0 ? "neg" : "pos"}">${t.qb_adj < 0 ? "▼" : "▲"}</b>` : ""}</span>` : "";
  const ip = t => t.inj_pts != null && t.inj_pts < -0.05 ? `<b>${esc(t.abbr)}</b> ${t.inj_pts.toFixed(1)} pts` : null, injl = [ip(a), ip(h)].filter(Boolean);
  return `<div class="xmx"><div class="xtop">${side(a, 1 - ph, "")}${ring}${side(h, ph, "r")}</div>
    <div class="xhd"><span>${esc(a.abbr)}</span><span>rank of 32</span><span>${esc(h.abbr)}</span></div>${rows}
    <div class="xedges">${edges.length ? `<span class="xet">Edge</span>${edges.join("")}` : `<span class="xet">Even matchup</span>`}${qb(a)}${qb(h)}${notes.map(n => `<span class="xchip soft">${n}</span>`).join("")}</div>
    ${injl.length ? `<button class="xmiss" data-goinj="1"><span class="xmd"></span>Injury adjustment: ${injl.join(", ")} <i>· details in Model ›</i></button>` : ""}
    <div class="xrec">Records: ${esc(a.abbr)} ${esc(A.record || "–")} · ${esc(h.abbr)} ${esc(H.record || "–")}</div></div>`;
}
function scoreHtml(g) {
  const d = g.mpmf, lo = -28, hi = 28, bars = [];
  for (let k = lo; k <= hi; k++) { const p = d.p[k - d.lo] || 0; bars.push(`<div class="${k === 0 ? "z" : [3, 7, 10, 14].includes(Math.abs(k)) ? "k" : ""}" style="height:${Math.min(100, 1400 * p)}%" title="${k}: ${(100 * p).toFixed(1)}%"></div>`); }
  const p3 = [3, -3].map(k => d.p[k - d.lo] || 0).reduce((x, y) => x + y, 0), p7 = [7, -7].map(k => d.p[k - d.lo] || 0).reduce((x, y) => x + y, 0);
  return `<div class="sec">Final margin (${esc(g.home.abbr)} minus ${esc(g.away.abbr)})</div><div class="dist">${bars.join("")}</div>
    <div class="dlab"><span>${esc(g.away.abbr)} by 28</span><span>tie</span><span>${esc(g.home.abbr)} by 28</span></div>
    ${weatherHtml(g)}<div class="kv" style="margin-top:12px"><div><span>Projected score</span><b>${esc(g.away.abbr)} ${g.pts_away.toFixed(1)} – ${g.pts_home.toFixed(1)} ${esc(g.home.abbr)}</b></div>
      <div><span>Model line</span><b>${esc(g.home.abbr)} ${sp(-Math.round(2 * g.margin) / 2)} · ${g.total.toFixed(1)}</b></div>
      <div><span>Decided by exactly 3</span><b>${pct(p3)}</b></div><div><span>Decided by exactly 7</span><b>${pct(p7)}</b></div></div>`;
}
// formation view: who lines up for each side, on the field (offense going up, defense facing down)
const FORM = {};   // game_id -> {team: "home"|"away", unit: "off"|"def"}
const SPOTS = {   // x, y in % of the field; offense snaps the ball going up, the defense lines up facing it
  off: {OL: [[22, 17], [36, 17], [50, 17], [64, 17], [78, 17]], TE: [[88, 31]], WR: [[11, 31], [88, 60], [28, 47]],
        QB: [[50, 44]], RB: [[50, 70]]},
  def: {DL: [[20, 80], [40, 80], [60, 80], [80, 80]], LB: [[38, 48], [66, 48]], CB: [[12, 63], [88, 63], [14, 40]], S: [[30, 16], [70, 16]]},
};
function newsLine(g) {
  const N = g.news || {}; if (N.m == null) return "";
  const parts = [];
  if (Math.abs(N.inj_h || 0) >= 0.1) parts.push(`${esc(g.home.abbr)} injuries ${N.inj_h.toFixed(1)}`);
  if (Math.abs(N.inj_a || 0) >= 0.1) parts.push(`${esc(g.away.abbr)} injuries ${N.inj_a.toFixed(1)}`);

    return {spread: [S("spread", "away", -lh, prob(g, "spread", "away", -lh), `${g.away.abbr} ${pjSp(-lh)}`, "Spread"), S("spread", "home", lh, prob(g, "spread", "home", lh), `${g.home.abbr} ${pjSp(lh)}`, "Spread")],
      total: [S("total", "over", T, prob(g, "total", "over", T), `Over ${T}`, "Total points"), S("total", "under", T, prob(g, "total", "under", T), `Under ${T}`, "Total points")],
      ml: [S("ml", "away", null, 1 - g.p_home, `${g.away.abbr} to win`, "Moneyline"), S("ml", "home", null, g.p_home, `${g.home.abbr} to win`, "Moneyline")]}; },
  record: () => { const fin = D.games.filter(g => { const s = scoreOf(g); return s && s.state === "post"; }); if (!fin.length) return "";
    const w = fin.filter(g => { const s = scoreOf(g); return (s.home > s.away) === (g.p_home >= 0.5); }).length;
    return `<button class="card pj-rec" data-go="model"><span class="pj-rr"><b>${w}/${fin.length}</b><i>favourites won</i></span><span><b>Model check</b><i>Power ratings, calibration and every update</i></span><span class="chev">›</span></button>`; },
  modelHtml: () => updates() + `<div class="hx-h" style="margin:22px 2px 10px"><b>Power ratings</b></div>` + teams(),
  modelWire: render => {
    document.querySelectorAll("[data-info]").forEach(b => b.onclick = () => D && openInfo());
    document.querySelectorAll("[data-weights]").forEach(b => b.onclick = () => D && openWeights());
    document.querySelectorAll("[data-uf]").forEach(b => b.onclick = () => { UF = b.dataset.uf; render(); });
    document.querySelectorAll("[data-hv]").forEach(b => b.onclick = () => { HV = b.dataset.hv; render(); });
    document.querySelectorAll("[data-iexp]").forEach(b => b.onclick = () => { const k = b.dataset.iexp; IEXP.has(k) ? IEXP.delete(k) : IEXP.add(k); render(); });
    document.querySelectorAll("[data-ts]").forEach(b => b.onclick = () => { TSORT = b.dataset.ts; render(); });
    if (HV === "health") wireHealth(render); },
  after: render => {
    document.querySelectorAll("#view [data-fm]").forEach(b => b.onclick = e => { e.stopPropagation(); const [id, k, v] = b.dataset.fm.split("|"); FORM[id][k] = v; render(); });
    document.querySelectorAll("#view [data-pp]").forEach(el => el.onclick = e => { e.stopPropagation(); pjOpenPlayer(el.dataset.pp.split("|")[0]); });
    document.querySelectorAll("#view [data-goinj]").forEach(b => b.onclick = () => { TAB = "model"; UF = "injury"; render(); window.scrollTo(0, 0); });
  },
};
function openInfo() {
  pjSheet(`<div class="sh-t">How it works</div>
    <div class="hint" style="font-size:14.5px">The engine rates every team on opponent-adjusted efficiency (offense, defense, passing), adjusts for the starting quarterback, injuries, rest, travel and kickoff weather,
    and turns that into a full distribution of final margins and totals: win chances, projected scores and the likeliest outcomes. Player projections come from each player's share of targets and carries, the team's projected plays and the opponent.
    Data refresh several times a day; the model re-fits weekly and checks its own calibration (Model tab).</div>`);
}
function render() { pjRender(); }
$("#scrim").onclick = closeSheet;
$("#updBtn").onclick = () => { if (!D) return; pjGo(TAB === "model" ? "home" : "model"); };
$("#infoBtn").onclick = () => D && openInfo();
function openWeights() {
  $("#sheet").innerHTML = `<div class="grab"></div><button class="iconbtn close" id="shx" aria-label="Close">✕</button>
    <div class="sh-t">⚙️ How the model is weighted</div>${weightsHtml((D.meta || {}).weights)}`;
  $("#shx").onclick = closeSheet;
  $("#scrim").classList.add("open"); $("#sheet").classList.add("open"); $("#sheet").scrollTop = 0;
}
$("#gearBtn").onclick = () => D && openWeights();
const darkLogo = u => !u ? u : u.replace("/500/", "/500-dark/");
document.addEventListener("error", e => { const el = e.target; if (!el || el.tagName !== "IMG") return; const s0 = el.getAttribute("src") || "";
  if (s0.includes("/500-dark/")) { e.stopImmediatePropagation(); e.stopPropagation(); el.src = s0.replace("/500-dark/", "/500/"); } }, true);
fetch("nfl.json?v=" + Date.now()).then(r => r.json()).then(async d => {
  for (const g of d.games || []) for (const t of [g.home, g.away]) if (t) t.logo = darkLogo(t.logo);
  D = d; render(); await loadLive(); await loadBoxes(); render();
  setInterval(async () => { if (document.hidden) return; if (D.games.some(g => { const L = LIVE[g.game_id] || {}; return L.state === "in" || (L.state !== "post" && new Date(g.start_utc) - Date.now() < 3 * 36e5); })) { await loadLive(); await loadBoxes(); render(); } }, 30000);   // real time: scores, clock and box scores every 30 seconds around game time
}).catch(e => { $("#title").textContent = "NFL"; $("#sub").textContent = "This week's prices aren't published yet."; });
</script>
