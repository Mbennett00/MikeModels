<script>
/*SIM_JS*/
$("#back").innerHTML = ICON.back + "NFL";
const nm = n => GEN.has(n) ? n : lastName(n), tk = who => who ? ` (${esc(nm(who))})` : "";
let D = null, SD = null;
const TM = {}, CALK = {}, GEN = new Set(), FORM = .12, RZ = .66, NEUTRAL = .55, SIM_VER = "5|";   // bump when the engine changes so saved tunings are redone

  fg: {a: 6.31, b: -.1017}, xp: .945, two: {rate: .09, succ: .48}, secs: {run: 38, hurry: 20, inc: 6}, q: {}, ko: {tb: .3}, punt: {tb: .08, fc: .3, in20: .4}, pens: []};
const QM = {};
const meanQ = k => { if (k in QM) return QM[k]; const q = LG.q[k], P = LG.qp; if (!q || !q.length) return QM[k] = null;
  if (!P || P.length !== q.length) return QM[k] = q.reduce((s, v) => s + v, 0) / q.length;
  let m = 0; for (let i = 1; i < q.length; i++) m += (q[i] + q[i - 1]) / 2 * (P[i] - P[i - 1]); return QM[k] = m; };
// a draw from the league's real spread of yards for this kind of play (fallback: a simple shape)
const fromQ = (k, fb) => {
  const q = LG.q[k], P = LG.qp; if (!q || q.length < 5) return fb();
  if (!P || P.length !== q.length) { const u = R() * (q.length - 1), i = Math.floor(u); return q[i] + (q[Math.min(q.length - 1, i + 1)] - q[i]) * (u - i); }

const TOGO = t => t <= 1 ? "1" : t <= 3 ? "2-3" : t <= 6 ? "4-6" : t <= 10 ? "7-10" : "11+";
const FIELD = x => { const g = 100 - x; return g >= 61 ? "own" : g >= 41 ? "mid" : g >= 31 ? "edge" : "fg"; };

// 4th-down aggressiveness, penalties, its kicker, punter and returners, and which defenders make the plays.

  if (!rush.some(r => r.qb)) rush.push({name: qb, w: 2.8, ypc: 4.8, qb: true, tr: {}});

    const W = nmS("WR"), TE = nmS("TE"), RB = nmS("RB");
    tgt = [[W[0] || gen("WR1"), 7.5, .64, 13], [W[1] || gen("WR2"), 6, .63, 12.5], [W[2] || gen("WR3"), 4, .62, 11.5], [TE[0] || gen("TE"), 5, .7, 10.5], [RB[0] || gen("RB"), 3.5, .78, 7.5]]

  const listed = new Set(tgt.concat(rush).map(r => r.name)), depth = s => off.filter(p => s.includes(p.slot) && !listed.has(p.name)).map(p => p.name);
  const tgtGap = att * .95 - tgt.reduce((s, r) => s + r.w, 0), carGap = 26.5 - rush.reduce((s, r) => s + r.w, 0);

  if (carGap > .5) { const d = depth(["RB"]); rush.push({name: d[0] || gen("RB2"), w: carGap, ypc: 4.1, tr: {}}); }

  const ypaQB = qbP && qbP.pass_yds && qbP.att ? qbP.pass_yds / qbP.att : null, wsum = tgt.reduce((s, r) => s + r.w, 0);

  const g = (D.games || []).find(x => x.home.abbr === ab || x.away.abbr === ab), pts = g ? (g.home.abbr === ab ? g.pts_home : g.pts_away) : 22;
  const listedTD = P.reduce((s2, p) => s2 + (p.lam_td || 0), 0), depthTD = Math.max(.15, .8 * pts / 7 - listedTD - (qbP ? (qbP.lam_pass_td || 0) * 0 : 0));

    qb, qbP, qbT, rush, tgt, att, passRate: qbP ? clamp(drop / (drop + car), .4, .75) : clamp(.585 + (o.proe || 0), .4, .75),

}
const gameOf = (a, h) => (D.games || []).find(x => x.home.abbr === h && x.away.abbr === a);
function expected(a, h) {
  const g = gameOf(a, h); if (g && g.pts_home != null) return [g.pts_away, g.pts_home];

}
function pModel(a, h) {

// the game's conditions: wind, cold and rain move passing, kicking and ball security (domes and closed roofs don't)
function weather(a, h) {
  const g = gameOf(a, h), W = g && g.weather;

// tune each offence's efficiency until its average score matches the model's projection for this matchup
function prepare(a, h) {

// ---------- the engine: one snap at a time ----------
function simulate(a, h, Q) {

      xr: Math.sqrt((o.xr || 1) * (d.xr || 1)), rz: Math.sqrt((o.rz || 1) * (d.rz || 1)), third: Math.sqrt((o.third || 1) * (d.third || 1)),

  const ev = [], ord = ["", "1st", "2nd", "3rd", "4th"];

    fgm: 0, fga: 0, flong: 0, xpm: 0, xpa: 0, tkl: 0, sacks: 0, ints: 0, pd: 0, punts: 0, pyd: 0, kr: 0, kryd: 0, prt: 0, pryd: 0});

  const spot = (k, y) => y === 50 ? "the 50" : y < 50 ? `${S[k].ab} ${y}` : `${S[opp(k)].ab} ${100 - y}`;
  const yds = n => `${n} yard${Math.abs(n) === 1 ? "" : "s"}`;
  const say = (o, f) => { if (Q) return null; const e = Object.assign({pl: pl(), t: clk(), score: {...st.score}}, o, {text: f()}); ev.push(e); return e; };

        ${sxTable(["Kicking", "FG", "Lng", "XP", "Pts"], Ki.map(b => [esc(b.name), `${b.fgm}/${b.fga}`, b.flong || "–", `${b.xpm}/${b.xpa}`, 3 * b.fgm + b.xpm]))}
        ${sxTable(["Punting", "Punts", "Yds", "Avg"], Pu.map(b => [esc(b.name), b.punts, b.pyd, (b.pyd / b.punts).toFixed(1)]))}
        ${sxTable(["Returns", "KR", "Yds", "PR", "Yds"], Rt.map(b => [esc(b.name), b.kr, b.kryd, b.prt, b.pryd]))}
        ${sxTable(["Defense", "Tkl", "Sck", "Int", "PD"], De.map(b => [esc(b.name), b.tkl, b.sacks, b.ints, b.pd]))}</div>`; }).join("");
  },
  // the battle: how a play reads as a move, each offence's type, and the live win chance on the HP bars
  frac(e) { const m = /(\d+):(\d+)/.exec(e.t || "") || [0, 0, 0], secs = +m[1] * 60 + +m[2], q = +String(e.pl).replace("Q", "") || 5;
    return q <= 4 ? ((4 - q) * 900 + secs) / 3600 : secs / 3600; },
  liveP(sim, e) { const f = SIMX.frac(e), lead = e.score.h - e.score.a, mu = sim.exp[1] - sim.exp[0];
    if (e.kind === "sec" && /Final/.test(e.text)) return lead > 0 ? 1 : lead < 0 ? 0 : .5;
    const z = (lead + mu * f) / (13.5 * Math.sqrt(Math.max(f, .004))); return 1 / (1 + Math.exp(-1.702 * z)); },
  type: T => { const pr = (T.o || {}).proe || 0; return pr > .025 ? {n: "Air", c: "#3b82f6"} : pr < -.025 ? {n: "Ground", c: "#b7791f"} : {n: "Normal", c: "#8b90a8"}; },
  move(e, sim) {
    const T = sim.T, me = e.side && T[e.side] ? T[e.side].ab : "", them = e.side ? T[e.side === "a" ? "h" : "a"].ab : "", txt = e.text || "", y = +((/for (?:a loss of )?(-?\d+) yard/.exec(txt) || [])[1] || 0);
    if (e.kind === "td") return {mv: `${me} used TOUCHDOWN BLAST!`, eff: "It's super effective!"};
    if (e.kind === "fg") return e.sc ? {mv: `${me} used BOOT KICK!`, eff: "It's a hit!"} : {mv: `${me} used BOOT KICK!`, eff: "But it missed!"};
    if (e.kind === "int") return {mv: `${them} used PICK OFF!`, eff: "A critical hit!"};
    if (e.kind === "fum") return {mv: `${them} used STRIP BALL!`, eff: "A critical hit!"};
    if (e.kind === "pen") return {mv: `${me} got flagged!`, eff: ""};
    if (e.kind === "punt") return {mv: `${me} used PUNT AWAY!`, eff: ""};
    if (e.kind === "ko") return {mv: "KICKOFF!", eff: ""};
    if (e.kind === "to") return {mv: `${them} used IRON WALL!`, eff: "It's super effective!"};
    if (/sacked/.test(txt)) return {mv: `${them} used SACK ATTACK!`, eff: "It's super effective!"};
    if (/kneels/.test(txt)) return {mv: `${me} used REST!`, eff: ""};
    if (/incomplete/.test(txt)) return {mv: `${me} used AIR STRIKE!`, eff: "But it missed!"};
    if (/scrambles/.test(txt)) return {mv: `${me} used QUICK ESCAPE!`, eff: y >= 15 ? "A critical hit!" : ""};
    if (/pass/.test(txt)) return {mv: `${me} used ${y >= 20 ? "SKY BOMB" : "AIR STRIKE"}!`, eff: y >= 20 ? "A critical hit!" : ""};
    if (/rush/.test(txt)) return {mv: `${me} used GROUND POUND!`, eff: y >= 15 ? "A critical hit!" : y <= 0 ? "It had no effect…" : ""};
    return null;
  },
  props(B) {   // the sportsbook's player props: quarterback, lead back, top receivers, likeliest scorers
    const out = [];
    for (const k of ["a", "h"]) {
      const T = B.T[k], P = (D.players || []).filter(p => p.team === T.ab && !/^(out|ir|doubtful)/i.test(p.status || "")), val = (d, n, i) => ((d.p[k + "|" + n] || [])[i] || 0);
      const qb = P.find(p => p.role === "QB"); if (qb) out.push({id: `py_${k}`, who: qb.name, team: k, stat: "pass yds", kind: "ou", get: d => val(d, qb.name, 0)});
      P.filter(p => p.role === "RB").sort((x, y) => y.rush_yds - x.rush_yds).slice(0, 1).forEach((p, i) => out.push({id: `ry_${k}${i}`, who: p.name, team: k, stat: "rush yds", kind: "ou", get: d => val(d, p.name, 1)}));
      P.filter(p => p.role !== "QB").sort((x, y) => y.rec_yds - x.rec_yds).slice(0, 2).forEach((p, i) => out.push({id: `cy_${k}${i}`, who: p.name, team: k, stat: "rec yds", kind: "ou", get: d => val(d, p.name, 2)}));
      P.filter(p => p.role !== "QB").sort((x, y) => y.p_td - x.p_td).slice(0, 3).forEach((p, i) => out.push({id: `td_${k}${i}`, who: p.name, team: k, stat: "anytime TD", kind: "yes", get: d => val(d, p.name, 4)}));
    }
    return out;
  },
  digest(sim) {   // what the 1,000-game view keeps from each game
    const p = {}; for (const b of Object.values(sim.st.box)) if (b.p) p[b.k + "|" + b.name] = [b.pyds, b.ryds, b.cyds, b.rec, b.rtd + b.ctd > 0 ? 1 : 0];
    return {s: sim.final, ot: sim.st.q === 5, p};
  },
  multiPlayers(M) {
    const rows = [];
    for (const k of ["a", "h"]) { const T = M.T[k], av = (name, i) => M.res.reduce((s, d) => s + ((d.p[k + "|" + name] || [])[i] || 0), 0) / M.res.length;
      const P = (D.players || []).filter(p => p.team === T.ab && !/^(out|ir|doubtful)/i.test(p.status || ""));
      const qb = P.find(p => p.role === "QB"), rb = P.filter(p => p.role === "RB").sort((x, y) => y.rush_yds - x.rush_yds).slice(0, 2), wr = P.filter(p => p.role !== "QB").sort((x, y) => y.rec_yds - x.rec_yds).slice(0, 4);
      if (qb) rows.push([T, qb.name, "Pass yds", av(qb.name, 0).toFixed(0), qb.pass_yds.toFixed(0)]);
      for (const p of rb) rows.push([T, p.name, "Rush yds", av(p.name, 1).toFixed(0), p.rush_yds.toFixed(0)]);
      for (const p of wr) rows.push([T, p.name, "Rec yds", av(p.name, 2).toFixed(0), p.rec_yds.toFixed(0)], [T, p.name, "Catches", av(p.name, 3).toFixed(1), p.rec.toFixed(1)]);
      for (const p of rb.concat(wr).sort((x, y) => y.p_td - x.p_td).slice(0, 3)) rows.push([T, p.name, "Anytime TD", sxPct(av(p.name, 4)), sxPct(p.p_td)]);
    }
    if (!rows.length) return "";
    return `<div class="sx-h"><b>Players: sim vs model</b><span>Average over ${M.res.length.toLocaleString()} games</span></div>
      <div class="sx-card">${sxTable(["Player", "Stat", "Sim", "Model"], rows.map(([T, n, s, v, m]) => [`${esc(nm(n))} <span style="color:var(--t3);font-weight:500">${esc(T.ab)}</span>`, `<span style="color:var(--t2)">${s}</span>`, `<b>${v}</b>`, `<span style="color:var(--t3)">${m}</span>`]))}</div>`;
  },
};
sxBoot();
</script>
</body>
</html>
