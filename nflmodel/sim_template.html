/*SIM_CSS*/

.fld { position: relative; height: 70px; margin: 0 14px 14px; border-radius: 8px; overflow: hidden; background: #1d5230; }

.fld .ez.a { left: 0; } .fld .ez.a b { transform: rotate(180deg); } .fld .ez.h { right: 0; }
.fld .yl { position: absolute; top: 0; bottom: 0; width: 1px; background: rgba(255,255,255,.22); }

<body class="sim">
<div class="wrap">
  <div class="hdr"><div class="sx-top"><a href="nfl.html" id="back"></a><b>Game sim</b><img class="mlogo" src="pikt-wordmark.png" alt="Pikt"></div></div>
  <div id="view"><div class="empty"><div class="t">Loading teams…</div></div></div>
</div>
<script>
/*SIM_JS*/
$("#back").innerHTML = ICON.back + "NFL";
const nm = n => GEN.has(n) ? n : lastName(n), tk = who => who ? `(${esc(nm(who))})` : "";
let D = null;
const TM = {}, CALK = {}, GEN = new Set(), FORM = .12, SIM_VER = "3|";   // bump when the engine changes so saved tunings are redone

// ---------- teams, from the NFL model ----------
// Each offence plays to its players' projections: who gets the carries and targets, each receiver's catch rate and
// yards per catch, each runner's yards per carry, and the team's run/pass mix from its quarterback's projected attempts.
function team(ab) {
  if (TM[ab]) return TM[ab];
  const T = D.teams[ab] || {}, L = (D.lineups || {})[ab] || {}, off = (L.off || {}).players || [], def = (L.def || {}).players || [];
  const P = (D.players || []).filter(p => p.team === ab && !/^(out|ir|doubtful)/i.test(p.status || ""));
  const gen = role => { const n = `${T.name || ab} ${role}`; GEN.add(n); return n; };   // a stand-in when the model lists no one
  const qbP = P.find(p => p.role === "QB"), qb = qbP ? qbP.name : (off.find(p => p.slot === "QB") || {}).name || gen("QB");
  let rush = P.filter(p => p.car > .2).map(p => ({name: p.name, p, w: p.car, ypc: clamp(1.07 * p.rush_yds / p.car, 2.4, 8.5), qb: p.role === "QB"}));
  if (!rush.some(r => !r.qb)) { const rb = off.filter(p => p.slot === "RB").map(p => p.name); rush.push({name: rb[0] || gen("RB"), w: 15, ypc: 4.3}, {name: rb[1] || gen("RB2"), w: 5, ypc: 4.1}); }
  if (!rush.some(r => r.qb)) rush.push({name: qb, w: 2.8, ypc: 4.8, qb: true});
  let tgt = P.filter(p => p.tgt > .2).map(p => ({name: p.name, p, w: p.tgt, cr: clamp(p.rec / p.tgt, .42, .9), ypr: clamp(p.rec_yds / Math.max(.1, p.rec), 4, 19)}));
  if (!tgt.length) { const nm = s => off.filter(p => p.slot === s).map(p => p.name);
    const W = nm("WR"), TE = nm("TE"), RB = nm("RB");
    tgt = [[W[0] || gen("WR1"), 7.5, .64, 13], [W[1] || gen("WR2"), 6, .63, 12.5], [W[2] || gen("WR3"), 4, .62, 11.5], [TE[0] || gen("TE"), 5, .7, 10.5], [RB[0] || gen("RB"), 3.5, .78, 7.5]]
      .map(([name, w, cr, ypr]) => ({name, w, cr, ypr})); }

  const listed = new Set(tgt.concat(rush).map(r => r.name)), depth = s => off.filter(p => s.includes(p.slot) && !listed.has(p.name)).map(p => p.name);
  const tgtGap = att * .95 - tgt.reduce((s, r) => s + r.w, 0), carGap = 26.5 - rush.reduce((s, r) => s + r.w, 0);
  if (tgtGap > .5) { const d = depth(["WR", "TE"]); tgt.push({name: d[0] || gen("WR"), w: tgtGap * .6, cr: .62, ypr: 11}, {name: d[1] || gen("TE"), w: tgtGap * .4, cr: .68, ypr: 9.5}); }
  if (carGap > .5) { const d = depth(["RB"]); rush.push({name: d[0] || gen("RB2"), w: carGap, ypc: 4.1}); }

  const ypaQB = qbP && qbP.pass_yds && qbP.att ? qbP.pass_yds / qbP.att : null, wsum = tgt.reduce((s, r) => s + r.w, 0);
  if (ypaQB) { const f = clamp(ypaQB / (tgt.reduce((s, r) => s + r.w * r.cr * r.ypr, 0) / wsum), .7, 1.35); for (const r of tgt) r.ypr *= f; }
  const car = rush.reduce((s, r) => s + r.w, 0), drop = att / (1 - .066);
  const dn = s => def.filter(p => s.includes(p.slot)).map(p => p.name);
  const tack = def.map(p => p.name), rushers = dn(["DL", "LB", "EDGE"]), dbs = dn(["CB", "S"]);
  return TM[ab] = {ab, name: T.name || ab, full: `${T.city || ""} ${T.name || ab}`.trim(), color: sxVis(T.color, T.color2), logo: T.logo, record: T.record || "",
    qb, qbP, rush, tgt, att, passRate: clamp(drop / (drop + car), .45, .72),

const gameOf = (a, h) => (D.games || []).find(x => x.home.abbr === h && x.away.abbr === a);
function expected(a, h) {
  const g = gameOf(a, h); if (g && g.pts_home != null) return [g.pts_away, g.pts_home];
  const A = D.teams[a] || {}, H = D.teams[h] || {}, m = (H.pts || 0) - (A.pts || 0) + 1.5;
  return [22.4 - m / 2, 22.4 + m / 2];
}
function pModel(a, h) {
  const g = gameOf(a, h); if (g && g.p_home != null) return g.p_home;
  const [ea, eh] = expected(a, h), z = (eh - ea) / 13.5;   // margin spread of NFL games
  return 1 / (1 + Math.exp(-1.702 * z));
}
// tune each offence's efficiency until its average score matches the model's projection for this matchup
function prepare(a, h) {
  const key = a + "|" + h; if (CALK[key]) return CALK[key];
  const saved = sxCalGet("nfl", SIM_VER + (D.meta.generated_at || D.meta.week), key); if (saved) return CALK[key] = saved;
  const [ea, eh] = expected(a, h); let k = {a: 1, h: 1};
  for (const n of [250, 400, 800, 1500]) {
    CALK[key] = k; let sa = 0, sh = 0;
    for (let i = 0; i < n; i++) { const s = simulate(a, h, true); sa += s.final.a; sh += s.final.h; }
    k = {a: clamp(k.a * Math.pow(ea / Math.max(3, sa / n), .55), .5, 2), h: clamp(k.h * Math.pow(eh / Math.max(3, sh / n), .55), .5, 2)};
  }
  sxCalPut("nfl", SIM_VER + (D.meta.generated_at || D.meta.week), key, k);
  return CALK[key] = k;
}

// ---------- the engine: one snap at a time ----------
function simulate(a, h, Q) {
  const S = {a: team(a), h: team(h)}, K0 = CALK[a + "|" + h] || {a: 1, h: 1};
  const K = {a: K0.a * Math.exp(FORM * norm()), h: K0.h * Math.exp(FORM * norm())};   // each offence has a good or bad day
  const ts = () => ({plays: 0, fd: 0, pyds: 0, ryds: 0, rcar: 0, cmp: 0, att: 0, sacks: 0, sackYds: 0, to: 0, third: [0, 0], fourth: [0, 0], top: 0, pens: 0});
  const st = {q: 1, clock: 900, score: {a: 0, h: 0}, qs: {a: [0, 0, 0, 0, 0], h: [0, 0, 0, 0, 0]}, team: {a: ts(), h: ts()}, box: {}, scoring: []};
  const ev = [], opp = k => k === "a" ? "h" : "a", ord = ["", "1st", "2nd", "3rd", "4th"];
  const pb = (k, name, p) => st.box[k + "|" + name] || (st.box[k + "|" + name] = {k, name, p, cmp: 0, att: 0, pyds: 0, ptd: 0, int: 0, sk: 0, car: 0, ryds: 0, rtd: 0, rlong: 0, rec: 0, tgt: 0, cyds: 0, ctd: 0, clong: 0, fgm: 0, fga: 0, flong: 0, xpm: 0, xpa: 0, sacks: 0, ints: 0});

  const clk = () => `${Math.floor(st.clock / 60)}:${String(st.clock % 60).padStart(2, "0")}`;
  const spot = (k, y) => y === 50 ? "the 50" : y < 50 ? `${S[k].ab} ${y}` : `${S[opp(k)].ab} ${100 - y}`;
  const yds = n => `${n} yard${Math.abs(n) === 1 ? "" : "s"}`;
  const say = (o, f) => { if (Q) return null; const e = Object.assign({pl: pl(), t: clk(), score: {...st.score}}, o, {text: f()}); ev.push(e); return e; };
  let pos = "a", x = 25, down = 1, togo = 10, over = false, otPoss = 0;
  const half2 = R() < .5 ? "a" : "h";
  const lead = () => st.score[pos] - st.score[opp(pos)];
  const hurry = () => (st.q === 2 && st.clock <= 120) || (st.q >= 4 && st.clock <= 240 && lead() < 0);
  const snapTime = () => hurry() ? 15 + Math.round(R() * 7) : st.q >= 4 && lead() > 0 ? 40 + Math.round(R() * 4) : 36 + Math.round(R() * 7);

  function tick(s) {   // run the clock; returns "half" when a new half or overtime began, "end" when the game is over
    st.team[pos].top += Math.min(s, st.clock);
    st.clock = Math.max(0, st.clock - s);
    if (st.clock > 0) return null;
    if (st.q === 1 || st.q === 3) { say({kind: "sec"}, () => `End of the ${ord[st.q]} quarter`); st.q++; st.clock = 900; return null; }
    if (st.q === 2) { say({kind: "sec"}, () => "Halftime"); st.q = 3; st.clock = 900; next(half2, 0, true); return "half"; }
    if (st.q === 4 && st.score.a === st.score.h) { say({kind: "sec"}, () => "End of regulation · overtime"); st.q = 5; st.clock = 600; otPoss = 0; next(R() < .5 ? "a" : "h", 0, true); return "half"; }

  }
  const after = (s, f) => { if (!tick(s) && !over) f(); };
  function next(k, y, ko) {   // a new possession: overtime ends once both teams have had the ball and someone leads

    if (ko) {
      if (R() < .6) { y = 35; say({kind: "ko", side: k}, () => "Kickoff, touchback"); }
      else { y = clamp(Math.round(29 + norm() * 7), 8, 60); say({kind: "ko", side: k}, () => `Kickoff returned to the ${spot(k, y)}`); }
    }
    pos = k; x = y; down = 1; togo = 10; if (st.q === 5) otPoss++;
    say({kind: "sec", side: k, bx: y, fd: y + 10, ndd: "1st & 10", nat: spot(k, y)}, () => `${S[k].name} ball at ${spot(k, y)}`);
  }
  function score(k, pts) { st.score[k] += pts; st.qs[k][st.q - 1] += pts; }
  function touchdown(desc, secs) {
    const O = S[pos], k = pos; score(k, 6);
    const d = st.score[k] - st.score[opp(k)], two = st.q >= 4 && (d === -1 || d === 5 || d === -5) && st.clock < 600;
    let tail;
    if (two) { const good = R() < .48; if (good) score(k, 2); tail = good ? "two-point try good" : "two-point try fails"; }
    else { const kick = pb(k, `${O.ab} kicker`); kick.xpa++; const good = R() < .945; if (good) { kick.xpm++; score(k, 1); } tail = good ? "extra point good" : "extra point missed"; }
    st.scoring.push({pl: pl(), t: clk(), k, text: `${desc} (${tail})`, a: st.score.a, h: st.score.h});
    say({kind: "td", side: k, sc: true, bx: 100}, () => `<b>Touchdown ${esc(O.name)}</b> · ${tail}`);

  }
  function fieldGoal() {
    const O = S[pos], k = pos, d = 117 - x, kick = pb(k, `${O.ab} kicker`); kick.fga++; st.team[k].plays++;
    if (R() < 1 / (1 + Math.exp((d - 57) / 5.6))) {
      kick.fgm++; kick.flong = Math.max(kick.flong, d); score(k, 3);
      st.scoring.push({pl: pl(), t: clk(), k, text: `${d}-yard field goal`, a: st.score.a, h: st.score.h});
      say({kind: "fg", side: k, sc: true, bx: x}, () => `<b>${d}-yard field goal is good</b>`);
      after(5, () => next(opp(k), 0, true));
    } else {
      say({kind: "fg", side: k, to: true, bx: x}, () => `${d}-yard field goal is no good`);
      const y = Math.max(20, 100 - (x - 7)); after(5, () => next(opp(k), y));

  }
  function punt() {

    const land = x + gross;
    if (land >= 100) { say({kind: "punt", side: k, bx: x}, () => "Punt into the end zone, touchback"); after(7, () => next(opp(k), 20)); return; }
    const fair = R() < .42 || land > 88, ret = fair ? 0 : Math.max(0, Math.round(8 + norm() * 6)), y = clamp(100 - land + ret, 1, 70);

  }
  // a snap's result: move the ball, keep the downs, the clock and the books
  function advance(g, secs, txt, desc) {
    const T = st.team[pos], b = {down, togo, x};
    T.plays++; x += g;
    const e = say({kind: "play", side: pos, dd: `${ord[b.down]} & ${b.togo >= 100 - b.x ? "Goal" : b.togo}`}, txt);
    if (x >= 100) { if (b.down >= 3) T[b.down === 3 ? "third" : "fourth"][0]++; if (e) e.bx = 100; return touchdown(desc, Math.min(secs, 7)); }
    if (x <= 0) { score(opp(pos), 2); st.scoring.push({pl: pl(), t: clk(), k: opp(pos), text: "Safety", a: st.score.a, h: st.score.h}); say({kind: "td", side: opp(pos), sc: true}, () => "<b>Safety</b>"); return after(secs, () => next(opp(pos), 35)); }

      if (down > 4) { if (e) Object.assign(e, {bx: x}); say({kind: "to", side: pos, to: true, bx: x}, () => "Turnover on downs"); const y = 100 - x; return after(secs, () => next(opp(pos), y)); } }
    if (e) Object.assign(e, {bx: x, fd: Math.min(100, x + togo), ndd: `${ord[down]} & ${togo >= 100 - x ? "Goal" : togo}`, nat: spot(pos, x)});

  function pass() {

    if (R() < .066) {   // sack

    const t = pick(O.tgt, O.tgt.map(r => r.w * (toGoal <= 10 && r.p && r.p.pos === "TE" ? 1.3 : 1))), r = pb(pos, t.name, t.p); r.tgt++;

      const air = Math.min(toGoal + 5, Math.round(8 + R() * 22)), who = pick(X.dbs, X.dbs.map(() => 1)), ret = Math.max(0, Math.round(6 + norm() * 8));

      return turnover(100 - Math.min(99, x + air) + ret, snapTime());

    if (R() > clamp(t.cr * Math.pow(k, .1), .3, .92)) {
      return advance(0, 6, () => `${esc(nm(O.qb))} pass incomplete ${pick(["short", "short", "deep"], [1, 1, 1])} ${dir()}, intended for ${esc(nm(t.name))}`);

    let y = Math.round(t.ypr * k * (.3 + .7 * expo())); if (R() < .08) y = Math.min(y, Math.round(R() * 4) - 2);   // screens and checkdowns behind the line

    }
    q.cmp++; q.pyds += y; r.rec++; r.cyds += y; r.clong = Math.max(r.clong, y); T.cmp++; T.pyds += y;

    const r = pick(O.rush, O.rush.map(c => c.w * (toGoal <= 3 && !c.qb ? 1.25 : 1))), b = pb(pos, r.name, r.p);

    advance(y, snapTime(), () => `${esc(nm(r.name))} ${r.qb && R() < .5 ? "scrambles" : "rush"} ${pick(["up the middle", "left end", "right end", "left tackle", "right guard"], [3, 1, 1, 1, 1])} for ${td ? `${yds(y)}, <b>touchdown</b>` : `${yds(y)} ${tk(who)}`}`,

  }
  function passRate() {
    const base = S[pos].passRate, ld = lead(), toGoal = 100 - x; let p;
    if (down === 1) p = base - .05; else if (down === 2) p = togo >= 8 ? base + .08 : togo <= 3 ? base - .14 : base;
    else p = togo >= 7 ? .9 : togo >= 4 ? .78 : togo >= 2 ? .58 : .34;
    if (toGoal <= 3) p = Math.min(p, .45);
    if (st.q >= 4) { if (ld >= 9 || (ld > 0 && st.clock <= 300)) p = Math.min(p, .28); if (ld <= -9 || (ld < 0 && st.clock <= 300)) p = Math.max(p, .8); }
    if (st.q === 2 && st.clock <= 120) p = Math.max(p, .72);
    return p;
  }
  function fourth() {
    const ld = lead(), d = 117 - x;
    if (st.q >= 4 && st.clock <= 300 && ld < 0 && !(d <= 55 && ld >= -3)) return "go";
    if (d <= 56) return togo <= 1 && x >= 95 && R() < .45 ? "go" : "fg";
    if (togo <= 1 && x >= 40) return R() < .7 ? "go" : "punt";
    if (togo <= 2 && x >= 50) return R() < .45 ? "go" : "punt";
    if (togo <= 4 && x >= 57) return R() < .35 ? "go" : "punt";
    return "punt";
  }
  function snap() {
    const ld = lead(), O = S[pos];
    // take a knee when the clock can be run out
    if ((st.q >= 4 && ld > 0 && st.clock <= (5 - down) * 40) || (st.q === 2 && st.clock <= 25 && x < 60 && down < 4)) {
      st.team[pos].plays++; say({kind: "play", side: pos, dd: `${ord[down]} & ${togo}`, bx: x}, () => `${esc(nm(O.qb))} kneels`);
      down++; x = Math.max(1, x - 1); if (down > 4) { const y = 100 - x; return after(Math.min(40, st.clock), () => next(opp(pos), y)); }
      return tick(Math.min(40, st.clock));
    }
    if ((st.q === 2 || (st.q >= 4 && ld >= -3 && ld <= 0)) && st.clock <= 8 && 117 - x <= 58) return fieldGoal();
    if (down === 4) { const d = fourth(); if (d === "fg") return fieldGoal(); if (d === "punt") return punt(); }
    if (down >= 3) st.team[pos].third[1] += down === 3 ? 1 : 0, st.team[pos].fourth[1] += down === 4 ? 1 : 0;
    R() < passRate() ? pass() : run();
  }
  say({kind: "sec"}, () => "Kickoff");
  next(opp(half2), 0, true);
  for (let guard = 0; !over && guard < 500; guard++) snap();
  say({kind: "sec"}, () => `Final${st.q === 5 ? " · overtime" : ""}`);
  return {a, h, T: S, st, ev, final: {...st.score}, exp: expected(a, h)};
}

// ---------- screens ----------
const statLine = (b, kind) => kind === "pass" ? `${b.cmp}/${b.att}, ${b.pyds} yds${b.ptd ? `, ${b.ptd} TD` : ""}${b.int ? `, ${b.int} INT` : ""}` : kind === "rush" ? `${b.car} car, ${b.ryds} yds${b.rtd ? `, ${b.rtd} TD` : ""}` : `${b.rec} rec, ${b.cyds} yds${b.ctd ? `, ${b.ctd} TD` : ""}`;
const mmss = s => `${Math.floor(s / 60)}:${String(Math.round(s % 60)).padStart(2, "0")}`;
const SIMX = {
  dataUrl: "nfl.json", startPl: "Q1", startClock: "15:00", kickText: "Coin toss", otLabel: "Overtime", emptyText: "No NFL teams in the data",
  multiN: 1000, multiChunk: 50, marginBins: [[-99, -17], [-16, -11], [-10, -7], [-6, -4], [-3, -1], [0, 0], [1, 3], [4, 6], [7, 10], [11, 16], [17, 99]], marginEdge: 17, marginMid: "Tie",
  note: "Every snap is played out: run or pass by down, distance, score and clock; carries and targets by each player's projection; each receiver's catch rate and yards per catch and each runner's yards per carry from the model; real fourth-down, field-goal, clock and overtime rules. Each offence's efficiency is then tuned so its average score matches the model's projection for the matchup. No two games are alike.",
  fmt: v => v.toFixed(1),
  init(d) { D = d; for (const g of D.games || []) for (const t of [g.home, g.away]) if (D.teams[t.abbr] && !D.teams[t.abbr].logo) D.teams[t.abbr].logo = t.logo; },
  teams: () => Object.keys(D.teams || {}).map(team).sort((x, y) => x.full.localeCompare(y.full)),
  team, expected, pModel, prepare, simulate,
  slate: () => (D.games || []).slice().sort((x, y) => (x.state === "post") - (y.state === "post") || String(x.start_utc).localeCompare(String(y.start_utc))).map(g => ({a: team(g.away.abbr), h: team(g.home.abbr), pa: g.pts_away, ph: g.pts_home, pHome: g.p_home,
    when: g.start_utc ? new Date(g.start_utc).toLocaleString("en-US", {weekday: "short", hour: "numeric", minute: "2-digit"}) : ""})),
  slateLabel: () => `Week ${D.meta.week || ""}`,
  teamSub: (sim, e, k) => sim.T[k].record,
  finalLab: sim => sim.final.a === sim.final.h ? "FINAL · TIE" : sim.st.q === 5 ? "FINAL · OT" : "FINAL",
  stage(sim, e, n) {
    const L = sim.ev.slice(0, n).reverse().find(x => x.bx != null), k = L && L.side, T = sim.T;
    const fx = v => `${(8.333 + (k === "h" ? 100 - v : v) * .83333).toFixed(2)}%`;   // the field reads away end zone left, home right
    const nums = [10, 20, 30, 40, 50, 60, 70, 80, 90];
    return `<div class="sx-sit"><span>${L && L.ndd ? `<b>${esc(L.ndd)}</b> at ${esc(L.nat)}` : "&nbsp;"}</span><span>${k ? `${esc(T[k].ab)} ball` : ""}</span></div>
      <div class="fld"><div class="gr"></div><div class="ez a" style="background:${esc(T.a.color)}"><b>${esc(T.a.ab)}</b></div><div class="ez h" style="background:${esc(T.h.color)}"><b>${esc(T.h.ab)}</b></div>
        ${nums.map(y => `<i class="yl" style="left:${(8.333 + y * .83333).toFixed(2)}%"></i><span class="yn" style="left:${(8.333 + y * .83333).toFixed(2)}%">${y > 50 ? 100 - y : y}</span>`).join("")}
        ${L && L.fd != null && L.fd < 100 ? `<i class="fd" style="left:${fx(L.fd)}"></i>` : ""}${L ? `<i class="los" style="left:${fx(Math.min(L.bx, 100))}"></i><i class="ball" style="left:${fx(Math.min(L.bx, 100))}"></i>` : ""}</div>`;
  },
  summary(sim) {
    const {st, T} = sim, B = Object.values(st.box), A = st.team.a, H = st.team.h;
    const lead = (f, kind, label) => { const b = B.filter(f).sort((x, y) => (kind === "pass" ? y.pyds - x.pyds : kind === "rush" ? y.ryds - x.ryds : y.cyds - x.cyds))[0];
      return b && {label, name: b.name, img: b.p && b.p.headshot, team: T[b.k], line: statLine(b, kind)}; };
    const tops = [lead(b => b.att, "pass", "Passing"), lead(b => b.car, "rush", "Rushing"), lead(b => b.rec, "rec", "Receiving")].filter(Boolean);
    const ot = st.q === 5, tot = t => t.pyds - t.sackYds + t.ryds;
    return sxTops(tops)
      + `<div class="sx-h"><b>Scoring</b></div>` + sxLineScore(sim, ["1", "2", "3", "4"].concat(ot ? ["OT"] : []), {a: st.qs.a.slice(0, ot ? 5 : 4), h: st.qs.h.slice(0, ot ? 5 : 4)})
      + `<div class="sx-card sx-feed" style="margin-top:8px">${st.scoring.map(s => `<div class="sx-r sc"><i>${esc(s.pl)} ${esc(s.t)}</i><span><b>${esc(T[s.k].ab)}</b> · ${esc(s.text)}</span><em>${s.a}–${s.h}</em></div>`).join("") || `<div class="sx-r"><i></i><span>No scoring</span></div>`}</div>`
      + `<div class="sx-h"><b>Team stats</b><span>Model ${esc(T.a.ab)} ${sim.exp[0].toFixed(1)} – ${sim.exp[1].toFixed(1)} ${esc(T.h.ab)}</span></div>`
      + sxCompare(sim, [["Total yards", tot(A), tot(H), true], ["Passing", A.pyds - A.sackYds, H.pyds - H.sackYds, true], ["Rushing", A.ryds, H.ryds, true], ["First downs", A.fd, H.fd, true],
        ["Third down", A.third[1] ? A.third[0] / A.third[1] : 0, H.third[1] ? H.third[0] / H.third[1] : 0, true, `${A.third[0]}/${A.third[1]}`, `${H.third[0]}/${H.third[1]}`],
        ["Turnovers", A.to, H.to, false], ["Sacks allowed", A.sacks, H.sacks, false], ["Possession", A.top, H.top, true, mmss(A.top), mmss(H.top)]]);
  },
  box(sim) {
    const {st, T} = sim;
    return ["a", "h"].map(k => { const B = Object.values(st.box).filter(b => b.k === k);
      const P = B.filter(b => b.att || b.sk).sort((x, y) => y.att - x.att), Ru = B.filter(b => b.car).sort((x, y) => y.ryds - x.ryds), Re = B.filter(b => b.tgt).sort((x, y) => y.cyds - x.cyds);
      const Ki = B.filter(b => b.fga || b.xpa), De = B.filter(b => b.sacks || b.ints).sort((x, y) => (y.sacks + y.ints) - (x.sacks + x.ints));
      return `<div class="sx-card" style="margin-top:12px;padding-bottom:6px">${sxHead(T[k])}
        ${sxTable(["Passing", "C/Att", "Yds", "TD", "Int", "Sk"], P.map(b => [esc(b.name), `${b.cmp}/${b.att}`, b.pyds, b.ptd, b.int, b.sk]))}
        ${sxTable(["Rushing", "Car", "Yds", "Avg", "TD", "Lng"], Ru.map(b => [esc(b.name), b.car, b.ryds, (b.ryds / b.car).toFixed(1), b.rtd, b.rlong]))}
        ${sxTable(["Receiving", "Rec", "Tgt", "Yds", "TD", "Lng"], Re.map(b => [esc(b.name), b.rec, b.tgt, b.cyds, b.ctd, b.clong]))}
        ${sxTable(["Kicking", "FG", "Lng", "XP", "Pts"], Ki.map(b => ["Kicker", `${b.fgm}/${b.fga}`, b.flong || "–", `${b.xpm}/${b.xpa}`, 3 * b.fgm + b.xpm]))}
        ${sxTable(["Defense", "Sacks", "Int"], De.map(b => [esc(b.name), b.sacks, b.ints]))}</div>`; }).join("");
  },
  digest(sim) {   // what the 1,000-game view keeps from each game
    const p = {}; for (const b of Object.values(sim.st.box)) if (b.p) p[b.k + "|" + b.name] = [b.pyds, b.ryds, b.cyds, b.rec, b.rtd + b.ctd > 0 ? 1 : 0];
    return {s: sim.final, ot: sim.st.q === 5, p};
  },
  multiPlayers(M) {
    const rows = [];
    for (const k of ["a", "h"]) { const T = M.T[k], av = (name, i) => M.res.reduce((s, d) => s + ((d.p[k + "|" + name] || [])[i] || 0), 0) / M.res.length;
      const P = (D.players || []).filter(p => p.team === T.ab && !/^(out|ir|doubtful)/i.test(p.status || ""));
      const qb = P.find(p => p.role === "QB"), rb = P.filter(p => p.role === "RB").sort((x, y) => y.rush_yds - x.rush_yds).slice(0, 2), wr = P.filter(p => p.role !== "QB").sort((x, y) => y.rec_yds - x.rec_yds).slice(0, 4);
      if (qb) rows.push([T, qb.name, "Pass yds", av(qb.name, 0).toFixed(0), qb.pass_yds.toFixed(0)]);
      for (const p of rb) rows.push([T, p.name, "Rush yds", av(p.name, 1).toFixed(0), p.rush_yds.toFixed(0)]);
      for (const p of wr) rows.push([T, p.name, "Rec yds", av(p.name, 2).toFixed(0), p.rec_yds.toFixed(0)], [T, p.name, "Catches", av(p.name, 3).toFixed(1), p.rec.toFixed(1)]);
      for (const p of rb.concat(wr).sort((x, y) => y.p_td - x.p_td).slice(0, 3)) rows.push([T, p.name, "Anytime TD", sxPct(av(p.name, 4)), sxPct(p.p_td)]);
    }
    if (!rows.length) return "";
    return `<div class="sx-h"><b>Players: sim vs model</b><span>Average over ${M.res.length.toLocaleString()} games</span></div>
      <div class="sx-card">${sxTable(["Player", "Stat", "Sim", "Model"], rows.map(([T, n, s, v, m]) => [`${esc(nm(n))} <span style="color:var(--t3);font-weight:500">${esc(T.ab)}</span>`, `<span style="color:var(--t2)">${s}</span>`, `<b>${v}</b>`, `<span style="color:var(--t3)">${m}</span>`]))}</div>`;
  },
};
sxBoot();
</script>
